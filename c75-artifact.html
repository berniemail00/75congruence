function miniRing(pct, size, color){
  size = size || 30;
  const r = (size - 6) / 2, c = 2 * Math.PI * r;
  return `<svg class="mring" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="rgba(255,205,140,0.14)" stroke-width="4"/>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color||'#ffb020'}" stroke-width="4" stroke-linecap="round"
      stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${(c*(1-Math.max(0,Math.min(1,pct)))).toFixed(1)}" transform="rotate(-90 ${size/2} ${size/2})"/>
  </svg>`;
}

function coachBanner(dn, day){
  const t = todayStr();
  const y = addDays(t,-1), y2 = addDays(t,-2);
  let main = coachMain(dn, day, t, y, y2);
  // a freshly-completed fortnight outranks the other nudges — but never rides
  // under a red crisis banner; the shelf and future mornings resurface it
  const rr = reportReady();
  if (rr > 0 && !S.reports[rr] && !main.includes('banner red')){
    main += `<div class="banner ember"><span class="b-ic">📊</span><div><b>Fortnight ${rr} report is ready.</b> Photos side by side, the tape, the dials, the whole story of days ${periodRange(rr).a}–${periodRange(rr).b}.<div class="mt8"><button class="btn sm" onclick="App.openReport(${rr})">Open the report</button></div></div></div>`;
    return main;
  }
  // lower-priority nudges can stack under the main banner (max one)
  if (dn >= 1 && parseDate(t).getDay() === 0 && !S.affirm[t] && !(day && day.closed)){
    main += `<div class="banner ember"><span class="b-ic">✍️</span><div><b>Sunday — values affirmation.</b> 15 minutes, by hand, before the mission block: one value core to who you are and why it matters. Highest-evidence tool in the whole book (Ch.4).<div class="mt8"><button class="btn sm ghost" onclick="App.openAffirm()">Open the exercise</button></div></div></div>`;
  } else if (dn >= 1 && CAN_STORE){
    const lb = S.profile.lastBackup;
    const stale = !lb || (parseDate(t) - parseDate(lb)) / 86400000 >= 7;
    if (stale && parseDate(t).getDay() === 0){
      main += `<div class="banner ember"><span class="b-ic">💾</span><div><b>Sunday admin: back up the evidence file.</b> 30 seconds in Settings → Export. ${lb ? 'Last backup ' + shortDate(lb) + '.' : 'No backup yet.'}</div></div>`;
    }
  }
  return main;
}
function coachMain(dn, day, t, y, y2){
  // the second consecutive loss just got logged tonight → the restart rule, now
  if (day && day.closed && day.status === 'lost'
      && parseDate(y) >= parseDate(S.profile.startDate) && isLostStatus(dayStatus(y))){
    return `<div class="banner red"><span class="b-ic">🔁</span><div><b>That's two in a row — the restart rule.</b> Pre-decided, no ceremony: two consecutive lost days restart the 75. Run the recovery protocol first, fix the environment, then light Day 1 again. The evidence file keeps every vote you've cast.<div class="two-col mt8"><button class="btn sm danger" onclick="App.armRestart(this)">Restart — Day 1 tomorrow</button><button class="btn sm ghost" onclick="App.openRecovery()">Recovery protocol</button></div></div></div>`;
  }
  // two consecutive losses behind you → the restart rule fires
  if (dn > 1 && parseDate(y2) >= parseDate(S.profile.startDate)
      && isLostStatus(dayStatus(y)) && isLostStatus(dayStatus(y2))){
    return `<div class="banner red"><span class="b-ic">🔁</span><div><b>Two lost days in a row — the restart rule.</b> That's the pre-decided deal: two consecutive losses restart the 75. No shame, no ceremony — run the recovery protocol, fix the environment, and light Day 1 again. The evidence you've built doesn't get erased.<div class="two-col mt8"><button class="btn sm danger" onclick="App.armRestart(this)">Restart — Day 1 tomorrow</button><button class="btn sm ghost" onclick="App.openRecovery()">Recovery protocol</button></div></div></div>`;
  }
  // post-slip: yesterday lost → never miss twice
  if (parseDate(y) >= parseDate(S.profile.startDate) && isLostStatus(dayStatus(y))){
    const yClosedLost = S.days[y] && S.days[y].closed && S.days[y].status === 'lost';
    const M = momentumScore();
    const ifWin = Math.round(M + 0.20 * (100 - M));
    return `<div class="banner red"><span class="b-ic">🛡</span><div><b>Never miss twice.</b> Yesterday didn't go your way — that makes today <b>mandatory</b>. One bad day is a data point. Two is a pattern.${yClosedLost?' Win today and the <b>+3 COMEBACK bonus</b> banks with it — bouncing back is the stat that matters.':''} Momentum <b>${M}</b> — win today and it jumps to <b>~${ifWin}</b>. A loss is arithmetic, not identity.<div class="mt8"><button class="btn sm ghost" onclick="App.openRecovery()">Run the recovery protocol</button></div></div></div>`;
  }
  if (dn < 1){
    return '';   // the Runway Command Center section carries Day 0
  }
  if (dn >= 3 && dn <= 14){
    return `<div class="banner ember"><span class="b-ic">🧠</span><div><b>Days 3–14: the reset window.</b> Flat mood, boredom, cravings — this is supposed to feel bad. It's the seesaw re-leveling, and it's exactly where everyone quits. It resolves. Do not quit here.</div></div>`;
  }
  if (dn >= 15 && dn <= 30 && dn % 3 === 0){
    return `<div class="banner green"><span class="b-ic">📈</span><div><b>Baseline recovering.</b> Music sounds better, food tastes better, boring work gets tolerable — that's the recalibration paying out. Keep pressing the effort side.</div></div>`;
  }
  if (dn === 60 || dn === 61){
    return `<div class="banner ember"><span class="b-ic">📜</span><div><b>Day 60: write The Standard.</b> Define Day-76-and-forever now, while you're strong — not while you're tired. Open it in FORGE → The Standard. And retake the MDS-16 (Ch.8) — compare it to your Day-0 baseline.</div></div>`;
  }
  if (dn === FORGE_DAYS){
    return `<div class="banner ember"><span class="b-ic">👑</span><div><b>Day 75.</b> Close it out tonight. Tomorrow the Forge becomes the Standard — same man, sustainable forever.</div></div>`;
  }
  if (dn > FORGE_DAYS){
    return `<div class="banner green"><span class="b-ic">♾️</span><div><b>The Standard — Day ${dn}.</b> Photo + tracking weekly, speech 3×/week, everything else unchanged. This is just who you are now.</div></div>`;
  }
  return '';
}

/* ---------- TODAY ---------- */
function renderToday(){
  const t = todayStr();
  const day = getDay(t);
  const dn = dayNumOf(t);
  const req = requiredRules(dn);
  const met = req.reduce((a,r)=>a+(ruleMet(day,r)?1:0),0);
  const q = quoteFor(dn);
  const phase = dn < 1 ? 'THE RUNWAY' : (dn <= FORGE_DAYS ? 'THE FORGE' : 'THE STANDARD');
  const dayLabel = dn < 1 ? 'Day 0' : 'Day ' + dn;
  const denom = dn <= FORGE_DAYS ? '/ 75' : '· beyond';

  const votes = votesCast();
  const xp = xpTotal();
  App._xpShown = xp;   // the ceremony bar animates from the last value the hero showed
  const lv = levelFor(xp);
  const cq = corpus().length ? corpus()[hashStr(t+'daily') % corpus().length] : null;
  /* week strip — Mon→Sun of the current week, each day a tappable circle */
  const dowT = parseDate(t).getDay();
  const monday = addDays(t, dowT === 0 ? -6 : 1 - dowT);
  let strip = '<div class="wkstrip">';
  for (let i = 0; i < 7; i++){
    const ds = addDays(monday, i);
    const dnum = dayNumOf(ds);
    const future = parseDate(ds) > parseDate(t);
    const st = future ? 'future' : dayStatus(ds);
    const rec = S.days[ds];
    let cls = 'future', glyph = parseDate(ds).getDate();
    if (ds === t) cls = 'today';
    else if (dnum < 1) { /* before Day 1: outside the run — neutral, never a red ✕ */ }
    else if (st === 'won') { cls = isImmaculate(ds, rec) ? 'imm' : 'won'; glyph = '✓'; }
    else if (isLostStatus(st)) { cls = 'lost'; glyph = '✕'; }
    else if (st === 'paused') { cls = 'paused'; glyph = '‖'; }
    strip += `<div class="wk-d ${cls}" onclick="App.peekDay('${ds}', ${dnum})">
      <span>${['M','T','W','T','F','S','S'][i]}</span><span class="wk-c">${glyph}</span></div>`;
  }
  strip += '</div>';
  const fs = flameState();
  const isPausedToday = dayStatus(t) === 'paused';
  // the ring is the level light: it flares all around when a rank is crossed
  const lvlUp = App._lvShown != null && lv.L > App._lvShown;
  App._lvShown = lv.L;
  if (lvlUp){ sfx('rank'); buzz([15,80,15]); }
  document.body.classList.toggle('ignited', !day.closed && !isPausedToday && met === req.length);
  document.body.classList.toggle('guttering', !day.closed && !isPausedToday && met < req.length && new Date().getHours() >= 20);
  let html = strip + `
  <div class="hero">
    <div class="grow">
      <div class="phase">${phase}${chapterFor(dn)?' · '+chapterFor(dn):''}${S.attempts.length?' · ATTEMPT '+(S.attempts.length+1):''}</div>
      <div class="big">${dayLabel} <span style="font-size:16px;color:var(--ink-3);font-weight:800">${denom}</span></div>
      <div class="date">${niceDate(t)}${votes>0?` · <b style="color:var(--ember-text)">${votes.toLocaleString()} votes</b>`:''}</div>
      <div class="rank-line"><span class="rk">⚒ ${lv.name}</span><span class="xv">${xp} XP · ${lv.need-lv.into} to ${levelFor(lv.next).name}</span></div>
      <div class="xpbar"><i style="width:${(lv.into/lv.need*100).toFixed(1)}%"></i></div>
      <div class="flame-line">${flameSVG(fs[0])}<span class="fl-t">${fs[1]}</span></div>
      ${(()=>{
        /* the overdrive chip: absent at zero (never a nag), an invitation while
           a chain is alive, hot while today is already beyond a goal */
        if (dn < 1) return '';
        const od = overdriveData().map;
        // a sealed day that didn't overdrive ends the chain — the designed
        // state is quiet absence, never "alive" on a day that already closed
        if (day.closed && !od[t]) return '';
        let y = addDays(t,-1); while (S.pauses[y]) y = addDays(y,-1);
        const chain = od[t] || od[y] || 0;
        const beyondNow = !day.closed && !isPausedToday && overdriveMarks(t, day).length > 0;
        if (!chain && !beyondNow) return '';
        /* passive display only — states what IS, never asks for more (that's
           the design: stretch effort stays volunteered, not solicited) */
        const label = beyondNow
          ? '⚡ OVERDRIVE LIVE · ×' + ((od[y]||0)+1) + ' TONIGHT'
          : (od[t] ? '⚡ OVERDRIVE ×' + od[t] + ' — SEALED' : '⚡ RUN ×' + chain + ' ALIVE');
        return `<div class="ov-chip${(beyondNow || chain>=3)?' hot':''}" onclick="App.openOverdrive()">${label}</div>`;
      })()}
      <div class="quote">“${cq?esc(cq.q):q[0]}” <span style="opacity:.7">— ${cq?esc(cq.a):q[1]}</span></div>
    </div>
    ${ringSVG(met/req.length, 104, met+'/'+req.length, (!day.closed && met >= req.length-2 && met < req.length) ? (req.length-met)+' to close' : 'locked in').replace('ring-wrap', 'ring-wrap' + (lvlUp ? ' lvlup' : '') + ((overdriveStreak() >= 3 && !(day.closed && !overdriveData().map[t])) ? ' overdrive' : ''))}
  </div>`;

  /* your own words, replayed — the investment loop's payoff */
  const pastNotes = Object.keys(S.days).filter(d=>d!==t && S.days[d].closed && S.days[d].note && S.days[d].note.trim()).sort();
  if (pastNotes.length){
    const pd = pastNotes[hashStr(t+'note') % pastNotes.length];
    html += `<div class="card tight small" style="border-left:3px solid var(--ember-text)"><b style="color:var(--ember-text)">DAY ${dayNumOf(pd)} YOU:</b> “${esc(S.days[pd].note.trim())}”</div>`;
  }

  html += coachBanner(dn, day);

  /* the replanned day (AI planner): times moved, requirements didn't */
  if (S.ui.aiday && S.ui.aiday.d === t && !day.closed){
    const ad = S.ui.aiday;
    const nowM2 = new Date().getHours()*60 + new Date().getMinutes();
    html += `<div class="card tight">
      <div class="row"><div class="small grow"><b>⚡ TODAY, REPLANNED</b> · ${esc(ad.summary)}</div>
      <button class="del" style="color:var(--ink-3);padding:2px 6px" onclick="App.aiRevert()" aria-label="Revert to normal template">✕</button></div>
      <div class="sched" style="margin-top:8px">${ad.blocks.map(b=>{
        const m = +b.start.slice(0,-3)*60 + +b.start.slice(-2), m2 = +b.end.slice(0,-3)*60 + +b.end.slice(-2);
        return `<div class="slot ${nowM2>=m&&nowM2<m2?'now':''}"><div class="t">${esc(b.start)}–${esc(b.end)}</div><div class="b">${esc(b.title)}</div></div>`;
      }).join('')}</div>
    </div>`;
  }

  /* the day, blocked — lives right under the hero: even folded, the badge is a
     live "what am I doing right now" ticker (and the replan door sits inside) */
  const now = new Date();
  const mins = now.getHours()*60 + now.getMinutes();
  let schedInner = `<div class="sched" style="margin:0 -3px">`;
  let nowLabel = '';
  SCHEDULE.forEach((s,i)=>{
    const isNow = mins >= SCHED_MIN[i][0] && mins < SCHED_MIN[i][1];
    if (isNow) nowLabel = s[1].split(/[·.]/)[0].trim();
    schedInner += `<div class="slot ${isNow?'now':''}"><div class="t">${s[0]}</div><div class="b">${s[1]}</div></div>`;
  });
  schedInner += `</div><button class="btn ghost sm mt12" onclick="App.openSettings('planner')">⚡ Something came up — replan the day</button>`;
  html += fold('sched', 'The Day, Blocked', nowLabel ? '▸ ' + nowLabel.slice(0, 22) : '', schedInner, false);

  /* focus quest — targets his own leakiest rule, pays only if cleared */
  const fq = dn >= 1 ? focusRuleFor(t) : null;
  if (fq && !day.closed){
    const fr = RULES.find(r=>r.id===fq);
    const cleared = ruleMet(day, fr);
    html += cleared
      ? `<div class="quest-banner"><span>✅</span><div><b>Focus quest cleared — ${fr.title}.</b> +2 XP banked for tonight.</div></div>`
      : `<div class="quest-banner"><span>🎯</span><div><b>FOCUS QUEST · ${fr.title}.</b> Your leakiest rule this week — clear it today for +2 XP. Environment beats willpower: make it easier before you make it harder.</div></div>`;
  }

  /* ----- Runway Command Center (Day 0 / before Day 1) ----- */
  if (dn < 1){
    const done = RUNWAY_TASKS.filter(x=>S.runway.checks[x[0]]).length;
    const pct = done / RUNWAY_TASKS.length;
    html += `
    <h2 class="sec">Runway Command Center <span class="ln"></span>CH. 20</h2>
    <div class="card">
      <div class="rw-head"><div class="small"><b>${dn===0?'Day 1 is tomorrow.':'Day 1 is coming.'}</b> This chapter is meant to be executed, not studied. Top to bottom.</div>
      <div class="rw-pct">${done}/${RUNWAY_TASKS.length}</div></div>
      <div class="rw-bar"><i style="width:${(pct*100).toFixed(0)}%"></i></div>
      ${['Demolition','Supply'].map(grp=>`
        <div class="gcat">${grp}${grp==='Demolition'?' — tear it down':' — stock the machine'}</div>
        ${RUNWAY_TASKS.filter(x=>x[1]===grp).map(x=>`
          <div class="rw-item ${S.runway.checks[x[0]]?'on':''}" onclick="App.toggleRunway('${x[0]}')">
            <div class="gbox" style="border:2px solid var(--baseline);border-radius:7px;width:22px;height:22px;flex:none;display:grid;place-items:center;color:transparent;${S.runway.checks[x[0]]?'background:var(--good);border-color:var(--good);color:#0a2b0a':''}">${ICONS.check}</div>
            <div class="grow"><div class="rw-t">${x[2]}</div><div class="rw-d">${x[3]}</div></div>
          </div>`).join('')}`).join('')}
      <div class="two-col mt12">
        <div><div class="muted" style="margin-bottom:4px">MDS-16 baseline score</div>
        <input inputmode="numeric" id="rwMds" placeholder="0–64" value="${esc(S.runway.mds16||'')}" onchange="App.saveRunwayBase()"></div>
        <div><div class="muted" style="margin-bottom:4px">Speech baseline (WPM)</div>
        <input inputmode="numeric" id="rwWpm" placeholder="e.g. 178" value="${esc(S.runway.wpm||'')}" onchange="App.saveRunwayBase()"></div>
      </div>
      <div class="muted mt8">Baselines are the before-photo for your mind and your mouth. You'll retake both around Day 60–75.</div>
    </div>`;
  }

  if (day.closed){
    html += day.status==='won'
      ? `<div class="banner green"><span class="b-ic">✅</span><div><b>Day ${dn} — WON.</b> Every non-negotiable, done. Another vote cast. <button class="btn sm ghost" style="margin-top:8px" onclick="App.reopenDay('${t}')">Reopen</button></div></div>`
      : `<div class="banner red"><span class="b-ic">📕</span><div><b>Day logged — not won.</b> Situational cause, one environment fix, and tomorrow is mandatory. High standards, kind voice. <button class="btn sm ghost" style="margin-top:8px" onclick="App.reopenDay('${t}')">Reopen</button></div></div>`;
  }

  html += `<h2 class="sec">The Non-Negotiables <span class="ln"></span><span style="color:var(--ember-text)">${met}/${req.length}</span></h2>
  ${!day.closed && met===0 ? `<div class="muted mb8" style="margin:-4px 2px 8px">Hold a card to seal it. Hold − / + to fast-count. Tap a number to type it.</div>` : ''}`;

  const dow = parseDate(t).getDay();
  const wknd = dow === 0 || dow === 6;
  const rung = currentRung();
  for (const r of RULES){
    const required = req.includes(r);
    const done = ruleMet(day, r);
    const dis = day.closed || isPausedToday;   // a held position takes no seals
    if (r.id === 'line'){
      // three-state keystone: unanswered / held / crossed. Crossing is only ever

      const st = day.r.line;
      html += `
      <div class="rule tappable keystone ${st===true?'done':''} ${st===false?'crossed':''}${App._sealNow==='line'?' sealed-now':''}" ${dis?'':`data-hold="line"`}>
        <div class="r-ic">${ICONS[r.icon]}</div>
        <div class="grow">
          <div class="r-title">${r.title}</div>
          <div class="r-sub">${r.sub}</div>
          ${st===null?`<div class="r-hint mt8" style="margin-top:5px">Hold to seal when held — the close-out asks either way</div>`:''}
          ${st===false?`<div class="r-hint mt8" style="margin-top:5px;color:var(--critical)">Crossed — the restart rule applies</div>`:''}
        </div>
        <div class="r-check">${st===false?'✕':ICONS.check}</div>
      </div>`;
    } else if (r.type === 'bool'){
      const isSocial = r.id === 'social';
      const isPhoto = r.id === 'photo';
      const isSpeech = r.id === 'speech';

        <div class="r-ic">${ICONS[r.icon]}</div>
        <div class="grow">
          <div class="r-title">${r.title}${required?'':' <span style="font-size:10px;color:var(--ink-3);font-weight:700">(3×/WK NOW)</span>'}</div>
          <div class="r-sub">${r.sub}</div>
          ${isSocial?`<div class="ladder-line"><b>WK ${Math.min(rung,LADDER.length)} — ${LADDER[rung-1][0].toUpperCase()}:</b> ${LADDER[rung-1][1]} <button class="chip" style="margin-top:7px;display:block" onclick="event.stopPropagation();App.repeatRung()">Repeat this rung another week</button></div>
          ${done?`<div class="anx-row" onclick="event.stopPropagation()"><span class="anx-l">ANXIETY AT THE REP</span>${Array.from({length:10},(_,i)=>`<button class="anx ${day.socialAnx===i+1?'on':''}" onclick="App.setAnx(${i+1})">${i+1}</button>`).join('')}</div>`:''}`:''}
        </div>
        ${isPhoto&&!dis?`<button class="icon-btn" style="width:34px;height:34px" onclick="event.stopPropagation();App.snapPhoto()" aria-label="Take progress photo">📷</button>`:''}
        ${isSpeech&&!dis?`<button class="icon-btn" style="width:34px;height:34px" onclick="event.stopPropagation();App.openSpeech()" aria-label="Open speech drill">🎙</button>`:''}

      const altLabel = r.alt ? (wknd
        ? (dow===6 ? 'Weekend block — Sat: JJ 9am + groceries + the big social rep counts' : 'Weekend block — Sun: church + batch cook + plan the week counts')

      html += `

        <div class="r-bottom">
          <div class="grow">

          <div class="ctr">

    }
  }
  html += `<input type="file" accept="image/*" capture="environment" id="photoInput" style="display:none" onchange="App.photoPicked(this)">`;

  /* supplements — folded: one glance, one tap */
  const suppsOn = SUPPS.filter(s=>day.supps[s[0]]).length;
  let suppInner = `<div class="chip-row">`;
  for (const s of SUPPS){
    const on = !!day.supps[s[0]];
    suppInner += `<button class="chip ${on?'on':''}" onclick="App.toggleSupp('${s[0]}')">${on?'✓ ':''}${s[1]}</button>`;
  }
  suppInner += `</div><div class="muted mt8">Mag at night · caffeine dies at noon.</div>`;
  html += fold('stack', 'The Stack', suppsOn + '/' + SUPPS.length, suppInner, false);

  /* morning weight — folded */
  const w = day.weight;
  html += fold('weight', 'Morning Weight', w!=null ? w.toFixed(1)+' lbs' : '—', `
  <div class="row">

/* hold-to-seal: a rule is committed with a ~550ms press — the ring draws while
   you hold, early release cancels. Motor commitment kills misclicks and makes
   every rule a micro-ceremony. */
let _hold = null;
const HOLD_C = 106.8;   // circumference of the r=17 progress ring
function holdStart(el, e){
  if (e.target.closest('button, input, textarea, .anx-row, .alt-chip')) return;
  const id = el.dataset.hold;
  if (!id) return;
  holdCancel();
  const check = el.querySelector('.r-check');
  // sealing draws ember; UN-sealing (card already done/crossed) draws bone-white,
  // and the check itself keeps its current look until the hold completes
  const unseal = el.classList.contains('done') || el.classList.contains('crossed');
  let hr = null;
  if (check){
    const old = check.querySelector('.hold-ring');
    if (old) old.remove();
    check.insertAdjacentHTML('beforeend',
      `<svg class="hold-ring" viewBox="0 0 38 38"><circle class="hr" cx="19" cy="19" r="17" fill="none" stroke="${unseal ? 'rgba(255,246,238,0.9)' : 'var(--ember-text)'}" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="${HOLD_C}" stroke-dashoffset="${HOLD_C}" transform="rotate(-90 19 19)"/></svg>`);
    hr = check.querySelector('.hold-ring .hr');
  }
  const t0 = performance.now();
  _hold = { el, id, raf: 0, done: false };
  el.classList.add('holding');
  const tickFrame = (t)=>{
    if (!_hold || _hold.el !== el) return;
    const p = Math.min(1, (t - t0) / 550);
    if (hr) hr.style.strokeDashoffset = (HOLD_C * (1 - p)).toFixed(1);
    if (p >= 1){
      _hold.done = true;
      el.classList.remove('holding');
      _hold = null;
      if (id === 'line') App.toggleLine(); else App.toggleRule(id);
      return;
    }
    _hold.raf = requestAnimationFrame(tickFrame);
  };
  _hold.raf = requestAnimationFrame(tickFrame);
}
function holdCancel(){
  if (!_hold) return;
  cancelAnimationFrame(_hold.raf);
  const el = _hold.el;
  _hold = null;
  el.classList.remove('holding');
  // let go early: the ring retreats smoothly, then leaves without a blink
  const ring = el.querySelector('.hold-ring');
  if (ring){
    const hr = ring.querySelector('.hr');
    if (hr){ hr.style.transition = 'stroke-dashoffset .22s var(--ease-out)'; hr.style.strokeDashoffset = HOLD_C; }
    setTimeout(()=>{ if (ring.parentNode) ring.remove(); }, 260);
  }
}

/* the daily XP haul, itemized for the ceremony */
function dayXP(t){
  const d = S.days[t];
  if (!d) return { total:0, lines:[] };
  const lines = [];
  const rules = RULES.reduce((a,r)=>a+(ruleMet(d,r)?1:0),0);
  if (rules) lines.push(['Non-negotiables kept ×' + rules, rules]);
  if (d.closed && d.status === 'won'){
    lines.push(['Every rule — day won', 3]);
    const yr = S.days[addDays(t, -1)];
    if (yr && yr.closed && yr.status === 'lost') lines.push(['COMEBACK — never missed twice', 3]);
  }
  if (d.waves) lines.push(['Waves outlasted ×' + d.waves, d.waves * 2]);
  // personal record: most dials in a single day — judged against days BEFORE t
  // only (chronological, matching _xpCalc), so a past report can never shrink
  const dialsToday = d.r.dials || 0;
  if (dialsToday > 0){
    let best = 0;
    for (const k in S.days) if (k < t) best = Math.max(best, S.days[k].r.dials || 0);
    if (dialsToday > best && best > 0) lines.push(['PR — most dials in a day (' + dialsToday + ')', 1]);
  }
  const f = focusRuleFor(t);
  if (f && ruleMet(d, RULES.find(r=>r.id===f))) lines.push(['Focus quest cleared', 2]);
  const mt = S.money.meetings[t] || 0;
  if (mt) lines.push(['Meetings booked ×' + mt, mt * 3]);
  const mk = Math.min(3, S.money.mocks[t] || 0);
  if (mk) lines.push(['Mock calls (deliberate practice)', mk]);
  if (S.affirm[t] && S.affirm[t] !== 'skip') lines.push(['Values affirmation', 2]);
  const rec = S.recoveries[t];
  if (rec && rec.cause && rec.cause.trim() && rec.fix && rec.fix.trim()) lines.push(['Recovery protocol run', 2]);
  if (d.closed && d.status === 'won'){
    const ov = overdriveMarks(t, d);
    if (ov.length){
      lines.push(['⚡ OVERDRIVE — ' + ov.map(m=>m.label.toLowerCase()).join(' · '), 2]);
      const st = overdriveData().map[t] || 0;
      const tier = OV_TIERS.find(x => x[0] === st);
      if (tier) lines.push([tier[3] + ' ' + tier[1] + ' — ' + st + ' overdrive days straight', tier[2]]);
    }

  return { total: lines.reduce((a,l)=>a+l[1],0), lines };
}

/* ============================================================
   FORTNIGHT REPORTS — every 14 days the record becomes a story
   ============================================================ */
function periodRange(n){
  const a = 14 * (n - 1) + 1;
  const b = Math.min(14 * n, FORGE_DAYS);
  return { a, b, da: dateOfDayNum(a), db: dateOfDayNum(b) };
}
function periodCount(){ return Math.ceil(FORGE_DAYS / 14); }   // 6 (last = days 71-75)
function reportReady(){
  // newest fully-elapsed fortnight, if any
  const dn = dayNumOf(todayStr());
  for (let n = periodCount(); n >= 1; n--){
    if (dn > periodRange(n).b) return n;
  }
  return 0;
}
function periodStats(n){
  const { a, b, da, db } = periodRange(n);
  const t = todayStr();
  const s = { n, a, b, da, db, days: b - a + 1, won: 0, lost: 0, votes: 0, xp: 0,
    dials: 0, convos: 0, mocks: 0, meetings: 0, waves: 0, comebacks: 0,
    ddMin: 0, income: 0, saved: 0, anxFirst: [], anxLast: [], comp: {} };
  for (const r of RULES) s.comp[r.id] = { met: 0, tot: 0 };
  const half = (b - a + 1) / 2;   // midpoint split works for the 5-day final period too
  for (let d = a; d <= b; d++){
    const ds = dateOfDayNum(d);
    if (parseDate(ds) > parseDate(t)) continue;
    const rec = S.days[ds];
    const st = dayStatus(ds);
    if (st === 'won') s.won++;
    else if (isLostStatus(st)) s.lost++;
    if (rec){
      s.xp += dayXP(ds).total;
      for (const r of requiredRules(d)){
        s.comp[r.id].tot++;
        if (ruleMet(rec, r)) s.comp[r.id].met++;
        if (ruleMet(rec, r)) s.votes++;
      }
      s.dials += rec.r.dials || 0;
      s.waves += rec.waves || 0;
      if (rec.socialAnx != null) (d - a < half ? s.anxFirst : s.anxLast).push(rec.socialAnx);
      const yr = S.days[addDays(ds, -1)];
      if (rec.closed && rec.status === 'won' && yr && yr.closed && yr.status === 'lost') s.comebacks++;
    } else {
      // no day record (imported/edge state): money-keyed XP still counts,
      // matching _xpCalc so the report and the total never disagree
      s.xp += 3 * (S.money.meetings[ds] || 0) + Math.min(3, S.money.mocks[ds] || 0);
      if (S.affirm[ds] && S.affirm[ds] !== 'skip') s.xp += 2;
    }
    s.convos += S.money.convos[ds] || 0;
    s.mocks += S.money.mocks[ds] || 0;
    s.meetings += S.money.meetings[ds] || 0;
    s.ddMin += S.dd.filter(x => x.date === ds).reduce((x, y) => x + y.min, 0);
  }
  for (const wk of [2 * n - 1, 2 * n]){
    // only weeks whose day-span actually intersects this fortnight
    const wkA = 7 * (wk - 1) + 1, wkB = 7 * wk;
    if (wkB < a || wkA > b) continue;
    const r = S.reviews[wk];
    if (r && Array.isArray(r.a) && r.a.some(x => x && x.trim())) s.xp += 5;
  }
  for (const tx of S.money.txns){
    if (parseDate(tx.date) >= parseDate(da) && parseDate(tx.date) <= parseDate(db)){
      if (tx.type === 'income') s.income += tx.amount;
      else if (tx.cat === 'invest') s.saved += tx.amount;
    }
  }
  // weight: last reading in period vs last reading before it (or period first)
  const wAll = S.body.entries.filter(e => e.weight != null);
  const wIn = wAll.filter(e => parseDate(e.date) >= parseDate(da) && parseDate(e.date) <= parseDate(db));
  const wBefore = wAll.filter(e => parseDate(e.date) < parseDate(da));
  s.wStart = wBefore.length ? wBefore[wBefore.length - 1].weight : (wIn.length ? wIn[0].weight : null);
  s.wEnd = wIn.length ? wIn[wIn.length - 1].weight : null;
  s.wPts = wIn.map(e => ({ x: e.date, y: e.weight }));
  // measurements: latest full entry in period vs latest before
  const mAll = S.body.entries.filter(e => e.waist != null || e.shoulders != null || e.chest != null || e.arms != null);
  s.mNow = mAll.filter(e => parseDate(e.date) <= parseDate(db)).slice(-1)[0] || null;
  s.mPrev = s.mNow ? (mAll.filter(e => parseDate(e.date) < parseDate(s.mNow.date)).slice(-1)[0] || null) : null;
  const avg = (xs) => xs.length ? xs.reduce((x, y) => x + y, 0) / xs.length : null;
  s.anxA = avg(s.anxFirst); s.anxB = avg(s.anxLast);
  return s;
}
function trendArrow(cur, prev, goodUp){
  if (prev == null || cur == null || prev === cur) return '<span style="color:var(--ink-3)">—</span>';
  const up = cur > prev;
  const good = goodUp ? up : !up;
  return `<span style="color:${good ? 'var(--good)' : 'var(--ink-2)'}">${up ? '▲' : '▼'}</span>`;
}
/* kind-voice narrative lines, computed from the record — never shaming */
function coachLines(s, prev){
  const L = [];
  const compArr = RULES.filter(r => s.comp[r.id].tot > 0)
    .map(r => ({ r, pct: s.comp[r.id].met / s.comp[r.id].tot }));
  if (compArr.length){
    const best = compArr.slice().sort((x, y) => y.pct - x.pct)[0];
    if (best.pct >= 0.99) L.push(`🏛 <b>${best.r.title}</b> — perfect all fortnight. That rule is becoming who you are.`);
    else if (best.pct >= 0.8) L.push(`🏛 Strongest rule: <b>${best.r.title}</b> (${Math.round(best.pct * 100)}%).`);
    const worst = compArr.slice().sort((x, y) => x.pct - y.pct)[0];
    if (worst.pct < 0.7) L.push(`🎯 Biggest opening: <b>${worst.r.title}</b> (${Math.round(worst.pct * 100)}%). One environment fix beats two weeks of willpower.`);
  }
  if (prev && prev.dials > 0 && s.dials > prev.dials) L.push(`📈 Dials up <b>${Math.round((s.dials / prev.dials - 1) * 100)}%</b> on the last fortnight — the arithmetic is compounding.`);
  if (s.meetings > 0) L.push(`🎯 <b>${s.meetings} meeting${s.meetings > 1 ? 's' : ''} booked.</b> That's the number that becomes money.`);
  if (s.comebacks > 0) L.push(`🛡 <b>${s.comebacks} comeback${s.comebacks > 1 ? 's' : ''}</b> — every loss answered the next morning. Never missed twice.`);
  if (s.wStart != null && s.wEnd != null && s.wEnd !== s.wStart){
    const d = s.wEnd - s.wStart;
    L.push(`${d > 0 ? '💪' : '⚖️'} Scale: <b>${d > 0 ? '+' : ''}${d.toFixed(1)} lbs</b> this fortnight${d >= 0.5 && d <= 2.5 ? ' — right in the lean-gain lane' : ''}.`);
  }
  if (s.anxA != null && s.anxB != null && s.anxB < s.anxA) L.push(`🪜 Social anxiety at the rep: <b>${s.anxA.toFixed(1)} → ${s.anxB.toFixed(1)}</b>. The number is falling. That's the rewiring.`);
  if (s.waves > 0) L.push(`🌊 <b>${s.waves} waves outlasted.</b> Every one was a vote cast in the same hour the urge wanted one.`);
  if (!L.length) L.push('The fortnight is logged. The next one is where the story picks up.');
  return L;
}

function blobToDataURL(blob){
  return new Promise((res, rej)=>{
    const r = new FileReader();
    r.onload = ()=>res(r.result);
    r.onerror = ()=>rej(r.error);
    r.readAsDataURL(blob);
  });
}

function archiveDownload(blob, fname){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = fname;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 8000);
  toast('The complete record — saved. 📜');
}

App.saveSet = ()=>{
  const {key, xi, si, w, r} = SET_CTX;
  const ex = WORKOUTS[key].ex[xi];
  const t = todayStr();
  if (!S.workouts.logs[t]) S.workouts.logs[t] = { key, sets:{} };
  const log = S.workouts.logs[t];
  if (!log.sets) log.sets = {};
  if (!log.sets[ex[0]]) log.sets[ex[0]] = [];

App.clearSet = ()=>{
  const {key, xi, si} = SET_CTX;
  const ex = WORKOUTS[key].ex[xi];

App.saveMeasurements = ()=>{

      html += `<div class="tx"><div class="grow"><div>${esc(a.name)}</div><div class="cat">${a.kind}</div></div>
        <div class="amt ${a.kind==='asset'?'in':''}">${money(a.value)}</div>
        <button class="del" style="color:var(--ink-3);padding:4px 8px" onclick="App.editAccount('${a.id}')">✎</button></div>`;
    }
    html += `</div>`;
  }

  html += `
  <h2 class="sec">This Month <span class="ln"></span>${new Date().toLocaleDateString('en-US',{month:'long'})}</h2>
  <div class="statgrid">
    <div class="stat"><div class="lbl">In</div><div class="val pos">${money(inc)}</div><div class="sub">earned only — that's why it stays</div></div>
    <div class="stat"><div class="lbl">Out</div><div class="val">${money(exp)}</div><div class="sub">net ${money(inc-exp)}</div></div>
  </div>

  <div class="card">
    <div class="small mb8"><b>Log money in seconds</b> — amount, tap a category, done.</div>
    <div class="row"><input id="txAmt" inputmode="decimal" placeholder="$ amount" style="flex:1">
    <input id="txNote" placeholder="note (optional)" style="flex:1.2"></div>
    <div class="chip-row mt8" id="catChips">
      <button class="chip ${App._cat==='income'?'on':''}" data-cat="income" onclick="App.pickCat(this)">💵 Income</button>
      ${EXPENSE_CATS.map(c=>`<button class="chip ${App._cat===c[0]?'on':''}" data-cat="${c[0]}" onclick="App.pickCat(this)">${c[1]}</button>`).join('')}
    </div>
    <button class="btn mt12" onclick="App.addTxn()">Add</button>
  </div>`;

  /* budget meters */
  const mrow = (name, spent, cap, tip)=>{
    const pct = cap>0 ? spent/cap : 0;
    const cls = pct>1 ? 'over' : (pct>0.85?'warn':'');
    return `<div class="meter ${cls}">
      <div class="m-head"><span>${name} ${pct>1?'<b style="color:var(--critical)">⚠ over</b>':''}</span><span class="muted">${money(spent)} / ${money(cap)}</span></div>
      <div class="m-track"><i style="width:${Math.min(100,pct*100).toFixed(0)}%"></i></div>
      <div class="muted" style="margin-top:3px">${tip}</div></div>`;
  };
  html += fold('budget', '50 / 30 / 20', inc>0?'vs income':'vs $3.4k floor', `
    ${mrow('Needs — 50%', buckets.needs, alloc.needs, 'rent · groceries · transport · bills · mats')}
    ${mrow('Wants — 30%', buckets.wants, alloc.wants, 'cash-only hurts more — that’s the point')}
    ${mrow('Saved — 20%', buckets.save, alloc.save, 'automated · different bank · no card')}`, false);

  html += `
  <h2 class="sec">Savings Goals <span class="ln"></span>STACK IT WITH A NAME ON IT</h2>
  <div class="card">
    ${S.money.goals.map(g=>{
      const pct = g.target>0 ? Math.min(1, g.saved/g.target) : 0;
      const hit = g.saved >= g.target && g.target > 0;
      return `
      <div style="margin-bottom:14px">
        <div class="m-head" style="display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:5px">
          <span><b>${hit?'🏆 ':''}${esc(g.name)}</b></span>
          <span class="muted">${money(g.saved)} / ${money(g.target)}</span>
        </div>
        <div class="mini-meter ${hit?'full':''}" style="height:9px"><i style="width:${(pct*100).toFixed(0)}%"></i></div>
        <div class="chip-row" style="margin-top:8px">
          <button class="chip" onclick="App.goalAdd('${g.id}',25)">+$25</button>
          <button class="chip" onclick="App.goalAdd('${g.id}',100)">+$100</button>
          <button class="chip" onclick="App.goalAdd('${g.id}',-25)">−$25</button>
          ${g.id!=='ef'?`<button class="del" style="margin-left:auto" onclick="App.delGoal('${g.id}')">✕</button>`:''}
        </div>
      </div>`;
    }).join('')}
    <hr class="soft">
    <div class="row">
      <input id="goalName" placeholder="New goal — e.g. Africa fund" style="flex:1.4">
      <input id="goalTarget" inputmode="numeric" placeholder="$ target" style="flex:.6">
    </div>
    <button class="btn ghost sm mt8" onclick="App.addGoal()">+ Add goal</button>
    <div class="muted mt8">The $1k emergency fund is what stops the next "emergency" from restarting the go-broke cycle. Everything after it is mission fuel.</div>
  </div>`;

  /* impulse firewall — folded, pending items ride inside */
  const pending = S.money.cooling.filter(c=>!c.decided);
  let fwInner = `
    <div class="row"><input id="coolItem" placeholder="The thing you want…" style="flex:1.4">
    <input id="coolAmt" inputmode="decimal" placeholder="$" style="flex:.6"></div>
    <button class="btn ghost sm mt8" onclick="App.addCooling()">Park it for 24 hours</button>
    ${kept>0?`<div class="banner green" style="margin:12px 0 0"><span class="b-ic">💪</span><div><b>${money(kept)} kept</b> overnight.</div></div>`:''}`;
  for (const c of pending){
    const hrsLeft = Math.max(0, 24 - (Date.now() - c.addedAt)/3600000);
    const ready = hrsLeft <= 0;
    fwInner += `<div class="cool" style="margin-top:8px">
      <div class="grow"><div>${esc(c.item)} — <b>${money(c.amount)}</b></div>
      <div class="cd ${ready?'ready':''}">${ready? 'Cooled off — still want it?' : '🔥 ' + Math.ceil(hrsLeft) + 'h left'}</div></div>
      ${ready?`<button class="chip" onclick="App.decideCooling('${c.id}','skipped')">Skip 💪</button>
      <button class="chip" onclick="App.decideCooling('${c.id}','bought')">Buy</button>`
      :`<button class="del" onclick="App.decideCooling('${c.id}','removed')">✕</button>`}
    </div>`;
  }
  html += fold('firewall', 'Impulse Firewall', pending.length ? pending.length + ' cooling' : (kept>0 ? money(kept)+' kept' : '24h · $30+'), fwInner, pending.length > 0);

  /* leading indicators */
  const t7 = todayStr();
  const days7 = Array.from({length:7},(_,i)=> addDays(t7, i-6));
  const dialVals = days7.map(d=> (S.days[d]? (S.days[d].r.dials||0) : 0));
  const wkSum = (map)=> days7.reduce((a,d)=>a+(map[d]||0),0);
  const totDials = Object.keys(S.days).reduce((a,d)=>a+(S.days[d].r.dials||0),0);
  const totMeets = Object.values(S.money.meetings).reduce((a,b)=>a+b,0);
  const dpm = totMeets >= 3 ? Math.round(totDials/totMeets) : null;
  html += `
  <h2 class="sec">Leading Indicators <span class="ln"></span>DIALS PAY FIRST</h2>
  <div class="card chart-card">
    <div class="ch-title">Dials — last 7 days</div>
    <div class="ch-sub">60/day is where commissions become arithmetic instead of hope</div>
    ${barChart(dialVals, days7.map(d=>['S','M','T','W','T','F','S'][parseDate(d).getDay()]), 60)}
    <hr class="soft">
    <div class="chip-row">
      <button class="chip" onclick="App.addConvo()">+1 conversation</button>
      <button class="chip" onclick="App.addMock()">+1 mock call</button>
      <button class="chip" onclick="App.addMeeting()">🎯 +1 meeting booked</button>
    </div>
    <div class="small mt12">This week: <b>${wkSum(S.money.convos)}</b> convos · <b>${wkSum(S.money.mocks)}</b> mock calls · <b style="color:var(--ember-text)">${wkSum(S.money.meetings)}</b> meetings booked</div>
    ${dpm!==null?`<div class="small mt8">Dials per meeting: <b>${dpm}</b> <span class="muted">· benchmark 25–35, top performers 12–18</span></div>`:`<div class="muted mt8">Benchmark: 25–35 dials per booked meeting (top performers 12–18). The meetings number is the first proof it's arithmetic.</div>`}
    <div class="muted mt8">The thing you avoid is the thing that pays — mock calls count double on Tuesdays.</div>
  </div>`;

  /* weekly rollup — mirrors the Money sheet */
  const dn7 = dayNumOf(t7);
  const curWk = dn7 > 0 ? Math.ceil(dn7/7) : 0;
  if (curWk >= 1){
    let rows = '';
    for (let wk = Math.max(1, curWk-3); wk <= curWk; wk++){
      const ws = weekStats(wk);
      rows += `<tr><td>Wk ${wk}</td><td>${ws.dials}</td><td>${ws.convos}</td><td>${ws.mocks}</td><td>${ws.meets}</td><td>${ws.social}</td><td>${ws.income?money(ws.income):'—'}</td></tr>`;
    }
    html += `
    <div class="card" style="overflow-x:auto">
      <div class="ch-title" style="font-size:13px;font-weight:800;margin-bottom:8px">Weekly rollup</div>
      <table class="tbl"><tr><th>Week</th><th>Dials</th><th>Convos</th><th>Mocks</th><th>Meets</th><th>Social</th><th>Income</th></tr>${rows}</table>
    </div>`;
  }

  /* fixed cost + the 12-month lock */
  const lock = S.money.lock;
  html += fold('commit', 'Commitments', lock.offer ? '🔒 ' + lock.offer.slice(0,14) : 'lock it', `
    <div class="small" style="margin-bottom:10px"><b>Fixed:</b> NCFA — <b>$226.52</b> on the 1st. 3 classes/wk ≈ $17 each · 1/wk = $57. <span class="muted">Attendance is a money decision.</span></div>
    ${lock.offer ? `
      <div style="font-size:14.5px;line-height:1.5">🔒 Locked to <b>${esc(lock.offer)}</b> until <b>${/^\d{4}-\d{2}-\d{2}$/.test(lock.date)?niceDate(lock.date):esc(lock.date)}</b>. Boredom isn't a red flag — it's the dip.</div>
      <button class="chip mt12" onclick="App.editLock(this)">Edit (needs a real reason)</button>`
    : `
      <div class="small mb8"><b>The 12-month lock.</b> Head-hopping reset six years to zero. Name the offer. Seal it. Stop re-litigating at 11pm.</div>
      <input id="lockOffer" placeholder="The offer / company" style="margin-bottom:8px">
      <input type="date" id="lockDate" style="margin-bottom:8px">
      <button class="btn ghost sm" onclick="App.sealLock()">Seal it</button>`}`, !lock.offer);

  $('view-money').classList.remove('entering');
  $('view-money').innerHTML = html;
}
App._cat = 'income';

};
App.addTxn = ()=>{
  const amt = parseFloat($('txAmt').value);
  if (isNaN(amt) || amt<=0){ toast('Enter an amount'); return; }
  const isInc = App._cat==='income';
  S.money.txns.push({ id:uid(), date:todayStr(), type:isInc?'income':'expense', amount:amt, cat:isInc?'income':App._cat, note:$('txNote').value.trim() });
  save(); renderMoney(); toast(isInc? 'Earned. Logged. 💵' : 'Spent — logged honestly');
};
App.goalAdd = (id, d)=>{
  const g = S.money.goals.find(x=>x.id===id);
  if (!g) return;
  const wasHit = g.target>0 && g.saved >= g.target;
  g.saved = Math.max(0, g.saved + d);
  save(); renderMoney();
  if (!wasHit && g.target>0 && g.saved >= g.target){
    confettiBurst();
    toast(`${g.name}: FUNDED. Built, not taken. 🏆`);
  }
};
App.addGoal = ()=>{
  const name = $('goalName').value.trim();
  const target = parseFloat($('goalTarget').value);
  if (!name || isNaN(target) || target<=0){ toast('Name it and give it a number'); return; }
  S.money.goals.push({ id: uid(), name, target, saved: 0 });
  save(); renderMoney(); toast('Goal on the board.');
};
App.delGoal = (id)=>{ S.money.goals = S.money.goals.filter(g=>g.id!==id); save(); renderMoney(); };
App.openMoneyDetail = ()=>{

  ${S.money.goals.length?`<div class="small mt12"><b>Goals funded:</b> ${S.money.goals.filter(g=>g.target>0&&g.saved>=g.target).length}/${S.money.goals.length} · total saved ${money(S.money.goals.reduce((a,g)=>a+g.saved,0))}</div>`:''}

    save(); renderMoney(); return;

  const c = S.money.cooling.find(x=>x.id===id);
  if (c){ c.decided = decision; save(); renderMoney(); if (decision==='skipped') toast('That’s the muscle. 💪'); }

/* ---------- PROGRESS ---------- */
function renderProgress(){
  const t = todayStr();
  const dn = dayNumOf(t);
  const won = wonCount();
  const stats = recoveryStats();
  const cs = currentStreak(), bs = bestStreak();
  // only scoreable days count — an open today and Standard-mode untracked days
  // never deflate the headline number
  const scoreable = won + lostCount();
  const votes = votesCast();
  const waves = wavesTotal();
  const xpP = xpTotal();
  const lvP = levelFor(xpP);

  let html = `
  <div class="hero">
    <div class="grow">
      <div class="phase">THE SCOREBOARD</div>
      <div class="big">${won} <span style="font-size:16px;color:var(--ink-3);font-weight:800">days won</span></div>
      <div class="date">${cs>0?'streak '+cs+' · ':''}best ${bs} · Momentum ${momentumScore()} · ${dn>FORGE_DAYS? (dn-FORGE_DAYS)+' days into The Standard' : Math.max(0,FORGE_DAYS-Math.max(dn,0))+' days left in The Forge'}</div>
      <div class="date" style="margin-top:3px"><b style="color:var(--ember-text)">${votes.toLocaleString()} votes cast</b>${waves>0?` · 🌊 ${waves} waves outlasted`:''}</div>
    </div>
    ${ringSVG(scoreable>0?won/scoreable:0, 104, scoreable>0? Math.round(won/scoreable*100)+'%' : '—', 'win rate')}
  </div>
  <div class="muted" style="margin:-4px 2px 12px">No single loss decides the election. The votes never reset.</div>

  <div class="tindex">
    ${[['sec-blade','THE BLADE'],['sec-vault','THE VAULT'],['sec-reports','REPORTS'],['sec-fivemen','THE FIVE MEN'],['sec-receipts','THE RECEIPTS']].map(([id,l],i)=>`<button onclick="var e=document.getElementById('${id}');if(e)e.scrollIntoView({behavior:'smooth',block:'start'})">${l}<span class="ti-n">0${i+1}</span></button>`).join('')}
  </div>

  <div class="card center" id="sec-blade">
    ${bladeSVG(lvP.L)}
    <div class="rank-line" style="justify-content:center"><span class="rk">⚒ ${lvP.name}</span><span class="xv">${xpP} XP</span></div>
    <div class="xpbar" style="max-width:260px;margin:8px auto 0"><i style="width:${(lvP.into/lvP.need*100).toFixed(1)}%"></i></div>
    <div class="muted mt8">${lvP.need-lvP.into} XP to <b>${levelFor(lvP.next).name}</b> — every rep is a hammer strike, and the blade keeps forging into The Standard.</div>
  </div>`;

  if (S.gradSeen || dn > FORGE_DAYS){
    html += `<div class="card tight center"><button class="btn ghost sm" onclick="App.openGraduation()">👑 FORGED — read your graduation again</button></div>`;
  }

  /* the vault — wisdom earned one won day at a time */
  if (corpus().length){
    const claims = Object.entries(S.vault.claims).sort((a,b)=>a[0]<b[0]?1:-1);
    html += `<h2 class="sec" id="sec-vault">The Vault <span class="ln"></span>${vaultCount()}/${corpus().length} CARDS</h2>
    <div class="card">
      ${claims.length ? claims.slice(0,3).map(([d,i])=>{
        const c = corpus()[i]; if (!c) return '';
        return `<div class="vault-mini" style="${c.t!=='common'?'border-color:rgba(255,160,50,0.4)':''}">“${esc(c.q)}”<div class="qauthor">— ${esc(c.a)} · ${TIERS[c.t].label} · ${shortDate(d)}</div></div>`;
      }).join('') : `<div class="small mb8"><b>400 cards. Locked.</b> Tonight's is already chosen — <span style="color:var(--ember-text)">win the day and flip it.</span></div>`}
      <button class="btn ghost sm" onclick="App.openVault()">Open the vault — odds printed inside</button>
    </div>`;
  }
  html += `
  <h2 class="sec">The Forge — 75 Days <span class="ln"></span>${shortDate(S.profile.startDate).toUpperCase()} → ${shortDate(dateOfDayNum(FORGE_DAYS)).toUpperCase()}</h2>
  <div class="card">
    <div class="legend">
      <span><i style="background:var(--good)"></i>Won</span>
      <span><i style="background:linear-gradient(160deg,#ffe9b0,#fff);border:1px solid #ffd700"></i>Immaculate</span>
      <span><i style="background:var(--critical-dim);border:1px solid var(--critical)"></i>Lost</span>
      <span><i style="background:rgba(90,130,180,0.3);border:1px solid rgba(120,160,210,0.5)"></i>Paused</span>
      <span><i style="border:2px solid var(--ember-text);background:transparent"></i>Today</span>
    </div>
    <div class="grid75">`;
  const d0dow = parseDate(S.profile.startDate).getDay();
  for (let i=0;i<7;i++) html += `<div class="g-dow">${['S','M','T','W','T','F','S'][(d0dow+i)%7]}</div>`;
  for (let n=1; n<=FORGE_DAYS; n++){
    const ds = dateOfDayNum(n);
    let cls = 'future', mark = '';
    if (parseDate(ds) < parseDate(t)){
      const st = dayStatus(ds);
      const rec = S.days[ds];
      if (st==='won'){
        cls = isImmaculate(ds, rec) ? 'won immaculate' : 'won'; mark='✓';
      } else if (st==='paused'){ cls='paused'; mark='‖'; }
      else { cls='lost'; mark='✕'; }
    } else if (ds === t){
      const st = dayStatus(t);
      if (st==='won'){ cls='won today'; mark='✓'; }
      else if (st==='lost'){ cls='lost today'; mark='✕'; }
      else { cls='today'; mark=n; }
    }
    html += `<button class="g-cell ${cls}" onclick="App.peekDay('${ds}',${n})" aria-label="Day ${n}">${mark}</button>`;
  }

function fillReceipts(){

  if (!box) return;

/* ---------- chart helpers (validated palette: series-1 blue on dark) ---------- */
function niceTicks(lo, hi){
  if (hi - lo < 1e-9) { hi = lo + 1; }
  const span = hi - lo;
  const step = Math.pow(10, Math.floor(Math.log10(span/2)));
  const s = [1,2,5,10].map(m=>m*step).find(x=> span/x <= 4) || step*10;
  const start = Math.ceil(lo/s)*s;
  const out = [];
  for (let v=start; v<=hi+1e-9; v+=s) out.push(Math.round(v*100)/100);
  return out;
}
function fmtTick(v){
  if (Math.abs(v) >= 1000) return (v/1000).toFixed(Math.abs(v)>=10000?0:1).replace(/\.0$/,'') + 'k';
  return String(Math.round(v*10)/10);
}
function roundTopRect(x, y, w, h, r){
  if (h <= 0) return '';
  r = Math.min(r, w/2, h);
  return `M${x} ${y+h} L${x} ${y+r} Q${x} ${y} ${x+r} ${y} L${x+w-r} ${y} Q${x+w} ${y} ${x+w} ${y+r} L${x+w} ${y+h} Z`;
}

function lineChart(pts, opts){
  opts = opts || {};
  const W=340, H=150, L=38, R=14, T=14, B=24;
  const iw = W-L-R, ih = H-T-B;
  const ys = pts.map(p=>p.y);
  let lo = Math.min(...ys), hi = Math.max(...ys);
  if (opts.goal != null && opts.goal <= hi + (hi-lo || 4) * 1.6 && opts.goal >= lo - (hi-lo || 4)) hi = Math.max(hi, opts.goal);
  const padY = (hi-lo || 2) * 0.12;
  lo -= padY; hi += padY;
  const X = i => L + (pts.length===1 ? iw/2 : i/(pts.length-1)*iw);
  const Y = v => T + ih - (v-lo)/(hi-lo)*ih;
  const ticks = niceTicks(lo, hi);
  const path = pts.map((p,i)=> (i?'L':'M') + X(i).toFixed(1) + ' ' + Y(p.y).toFixed(1)).join(' ');
  const area = path + ` L${X(pts.length-1).toFixed(1)} ${T+ih} L${X(0).toFixed(1)} ${T+ih} Z`;
  const lastI = pts.length-1;
  const goalIn = opts.goal!=null && opts.goal>=lo && opts.goal<=hi;
  const pre = opts.prefix||'';
  const ptsData = esc(JSON.stringify(pts.map((p,i)=>({x:X(i), l: shortDate(p.x), v:p.y}))));
  return `
  <div class="chart-wrap" data-pts="${ptsData}" data-unit="${esc(opts.unit||'')}" data-prefix="${esc(pre)}">
    <svg viewBox="0 0 ${W} ${H}" style="width:100%">
      ${ticks.map(v=>`<line x1="${L}" x2="${W-R}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}" stroke="#2c2c2a" stroke-width="1"/>
        <text x="${L-6}" y="${(Y(v)+3).toFixed(1)}" font-size="9" fill="#898781" text-anchor="end">${pre}${fmtTick(v)}</text>`).join('')}
      ${goalIn?`<line x1="${L}" x2="${W-R}" y1="${Y(opts.goal).toFixed(1)}" y2="${Y(opts.goal).toFixed(1)}" stroke="#ffb020" stroke-width="1" opacity="0.55"/>
        <text x="${W-R}" y="${(Y(opts.goal)-4).toFixed(1)}" font-size="9" fill="#ffb020" text-anchor="end" font-weight="700">target ${pre}${opts.goal}</text>`:''}
      <path d="${area}" fill="#3987e5" opacity="0.10"/>
      <path d="${path}" fill="none" stroke="#3987e5" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
      <circle cx="${X(lastI).toFixed(1)}" cy="${Y(pts[lastI].y).toFixed(1)}" r="4.5" fill="#3987e5" stroke="#1a1a19" stroke-width="2"/>
      <text x="${Math.min(X(lastI), W-R-2).toFixed(1)}" y="${(Y(pts[lastI].y)-9).toFixed(1)}" font-size="10" font-weight="700" fill="#ffffff" text-anchor="end">${pre}${fmtTick(pts[lastI].y)}${esc(opts.unit||'')}</text>
      <text x="${L}" y="${H-6}" font-size="9" fill="#898781">${shortDate(pts[0].x)}</text>
      <text x="${W-R}" y="${H-6}" font-size="9" fill="#898781" text-anchor="end">${shortDate(pts[lastI].x)}</text>
      <line class="xh" y1="${T}" y2="${T+ih}" stroke="#c3c2b7" stroke-width="1" opacity="0" />
    </svg>
    <div class="tt"></div>
  </div>`;
}

function barChart(vals, labels, goal){
  const W=340, H=120, L=30, R=10, T=12, B=20;
  const iw=W-L-R, ih=H-T-B;
  const hi = Math.max(goal||0, ...vals, 10) * 1.1;
  const n = vals.length;
  const slot = iw/n;
  const bw = Math.min(24, slot-6);
  const Y = v => T + ih - (v/hi)*ih;
  const ticks = niceTicks(0, hi);
  const maxI = vals.indexOf(Math.max(...vals));
  let bars = '';
  vals.forEach((v,i)=>{
    const x = L + i*slot + (slot-bw)/2;
    const y = Y(v), h = T+ih-y;
    bars += `<path d="${roundTopRect(x, y, bw, Math.max(h, v>0?2:0), 4)}" fill="#3987e5"/>`;
    if (i===maxI && v>0) bars += `<text x="${x+bw/2}" y="${y-4}" font-size="9.5" font-weight="700" fill="#ffffff" text-anchor="middle">${v}</text>`;
    bars += `<text x="${x+bw/2}" y="${H-6}" font-size="9" fill="#898781" text-anchor="middle">${labels[i]}</text>`;
  });
  return `
  <div class="chart-wrap">
    <svg viewBox="0 0 ${W} ${H}" style="width:100%">
      ${ticks.filter(v=>v>0).map(v=>`<line x1="${L}" x2="${W-R}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}" stroke="#2c2c2a" stroke-width="1"/>
        <text x="${L-5}" y="${(Y(v)+3).toFixed(1)}" font-size="9" fill="#898781" text-anchor="end">${fmtTick(v)}</text>`).join('')}
      <line x1="${L}" x2="${W-R}" y1="${T+ih}" y2="${T+ih}" stroke="#383835" stroke-width="1"/>
      ${goal?`<line x1="${L}" x2="${W-R}" y1="${Y(goal).toFixed(1)}" y2="${Y(goal).toFixed(1)}" stroke="#ffb020" stroke-width="1" opacity="0.55"/>
      <text x="${W-R}" y="${(Y(goal)-4).toFixed(1)}" font-size="9" fill="#ffb020" text-anchor="end" font-weight="700">${goal}/day</text>`:''}
      ${bars}
    </svg>
  </div>`;
}

/* chart hover (delegated) — pointerdown too, so a TAP shows the tooltip on touch */
const chartPoint = (e)=>{
  const wrap = e.target.closest ? e.target.closest('.chart-wrap[data-pts]') : null;
  document.querySelectorAll('.chart-wrap[data-pts]').forEach(w=>{
    if (w !== wrap){
      const tt = w.querySelector('.tt'); if (tt) tt.style.display='none';
      const xh = w.querySelector('.xh'); if (xh) xh.setAttribute('opacity','0');
    }
  });
  if (!wrap) return;
  let pts;
  try { pts = JSON.parse(wrap.dataset.pts); } catch(err){ return; }
  if (!pts || !pts.length) return;
  const svg = wrap.querySelector('svg');
  const rect = svg.getBoundingClientRect();
  if (!rect.width) return;
  const fx = (e.clientX - rect.left) / rect.width * 340;
  let best = 0, bd = 1e9;
  pts.forEach((p,i)=>{ const d = Math.abs(p.x - fx); if (d < bd){ bd = d; best = i; } });
  const p = pts[best];
  const xh = wrap.querySelector('.xh'), tt = wrap.querySelector('.tt');
  if (xh){ xh.setAttribute('x1', p.x); xh.setAttribute('x2', p.x); xh.setAttribute('opacity','0.35'); }
  if (tt){
    tt.innerHTML = `<b>${wrap.dataset.prefix||''}${p.v.toLocaleString('en-US')}${wrap.dataset.unit||''}</b> · ${p.l}`;
    tt.style.display = 'block';
    tt.style.left = (p.x / 340 * rect.width) + 'px';
    tt.style.top = '14px';
  }
};
document.addEventListener('pointermove', chartPoint, { passive:true });
document.addEventListener('pointerdown', chartPoint, { passive:true });
document.addEventListener('pointerleave', (e)=>{
  // on touch screens the tooltip stays until the next tap elsewhere
  if (window.matchMedia && matchMedia('(pointer:coarse)').matches) return;
  if (e.target && e.target.classList && e.target.classList.contains('chart-wrap')){
    const tt = e.target.querySelector('.tt'); if (tt) tt.style.display='none';
    const xh = e.target.querySelector('.xh'); if (xh) xh.setAttribute('opacity','0');
  }
}, true);

/* ---------- confetti (ember burst) ---------- */
function confettiBurst(){
  if (REDUCED_MOTION) return;
  const cv = $('confetti');
  const ctx = cv.getContext('2d');
  cv.width = innerWidth; cv.height = innerHeight;
  cv.style.display = 'block';
  const colors = ['#ff5f1f','#ffc233','#ffb020','#ffffff','#d95926'];
  const ps = Array.from({length:140},()=>({
    x: innerWidth/2 + (Math.random()-0.5)*140,
    y: innerHeight*0.35,
    vx: (Math.random()-0.5)*11,
    vy: -(Math.random()*11+4),
    s: Math.random()*5+3,
    c: colors[Math.floor(Math.random()*colors.length)],
    r: Math.random()*Math.PI,
    vr: (Math.random()-0.5)*0.3,
  }));
  let frames = 0;
  (function tick(){
    frames++;
    ctx.clearRect(0,0,cv.width,cv.height);
    for (const p of ps){
      p.x += p.vx; p.y += p.vy; p.vy += 0.32; p.r += p.vr;
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.r);
      ctx.fillStyle = p.c; ctx.globalAlpha = Math.max(0, 1 - frames/110);
      ctx.fillRect(-p.s/2, -p.s/2, p.s, p.s*0.6);
      ctx.restore();
    }
    if (frames < 115) requestAnimationFrame(tick);
    else { cv.style.display='none'; ctx.clearRect(0,0,cv.width,cv.height); }
  })();
}

/* ---------- sheet plumbing ----------
   Sheets carry ONE reusable history entry (the guard) so the phone's back
   gesture closes the sheet instead of exiting the installed app. Programmatic
   closes never touch history — the armed guard is reused by the next sheet,
   or consumed invisibly by the next back press. No races, no app exits. */
function openSheet(html){
  clearInterval(App._sosT); App._sosT = null;
  $('sheet').classList.toggle('swap', $('ovl').classList.contains('open'));
  $('sheet').innerHTML = html;
  if (!$('ovl').classList.contains('open')){
    if (!App._pageOpen){
      App._scrollY = window.scrollY || 0;
      document.body.style.top = (-App._scrollY) + 'px';
      document.body.classList.add('sheet-open');   // lock the page behind the sheet (iOS)
    }
    if (!App._sheetHist){
      App._sheetHist = true;
      try { history.pushState({ c75: (App._pageOpen ? 1 : 0) + 1 }, ''); } catch(e){}
    }
  }
  $('ovl').classList.add('open');
}
function closeSheetDOM(){
  clearInterval(App._sosT); App._sosT = null;
  App._closeDate = null;               // cancelled close-outs re-capture the date next time
  App._planDate = null;
  _sheetUrls.forEach(u=>URL.revokeObjectURL(u)); _sheetUrls = [];
  $('ovl').classList.remove('open');
  $('sheet').innerHTML = '';
  if (!App._pageOpen){
    document.body.classList.remove('sheet-open');
    document.body.style.top = '';
    window.scrollTo(0, App._scrollY || 0);
  }
}

function backupToGist(){
  if (!S.gist.pat) return;

  _gistT = setTimeout(()=>{

    const body = { description: 'Congruence 75 backup', public: false,
      files: { 'c75-backup.json': { content: JSON.stringify(clone) } } };
    const url = S.gist.id ? 'https://api.github.com/gists/' + S.gist.id : 'https://api.github.com/gists';
    fetch(url, {
      method: S.gist.id ? 'PATCH' : 'POST',

      body: JSON.stringify(body),

      S.gist.last = todayStr(); S.gist.pending = false; save();

}

/* ============================================================
   PAGES — full-screen sub-screens with real back-button support.
   Hash-only pushState (file:// safe). One level deep; sheets may
   open above a page. The ONLY thing that pops UI is popstate, so
   the phone's back gesture, the ‹ chevron, and browser back all
   behave identically — and Android back stops exiting the app.
   ============================================================ */
App._pageOpen = false;
App._sheetHist = false;
function openPage(id, title, sub, bodyHtml){
  const host = $('page');
  host.innerHTML = `
    <div class="page-hdr">
      <button class="pg-back" onclick="App.closePage()" aria-label="Back">‹</button>
      <div><div class="pg-title">${title}</div>${sub?`<div class="muted" style="font-size:11px;margin-top:1px">${sub}</div>`:''}</div>
    </div>
    <div class="page-body">${bodyHtml}</div>`;
  if (!App._pageOpen){
    App._pageOpen = true;
    App._pageScroll = window.scrollY || 0;
    document.body.style.top = (-App._pageScroll) + 'px';
    document.body.classList.add('sheet-open');
    // a stale sheet guard (sheet was closed programmatically) becomes THE page
    // entry instead of sitting under it — one back always means one close
    if (App._sheetHist && !$('ovl').classList.contains('open')){
      App._sheetHist = false;
      try { history.replaceState({ c75: 1 }, '', '#/' + id); } catch(e){}
    } else {
      try { history.pushState({ c75: 1 }, '', '#/' + id); } catch(e){}
    }
    host.classList.add('on');
    requestAnimationFrame(()=> host.classList.add('in'));
  } else {
    host.scrollTop = 0;   // in-place swap (tab change) — no new history entry
  }
}
function closePageDOM(){
  const host = $('page');
  App._pageOpen = false;
  App._pageClosing = false;
  host.classList.remove('in');
  document.body.classList.remove('sheet-open');
  document.body.style.top = '';
  window.scrollTo(0, App._pageScroll || 0);
  setTimeout(()=>{ if (!App._pageOpen){ host.classList.remove('on'); host.innerHTML = ''; } }, 320);
}
App.closePage = ()=>{
  if (!App._pageOpen || App._pageClosing) return;   // double-tap during the slide can't over-pop
  App._pageClosing = true;
  // jump past any stale sheet-guard entry sitting on top of the page entry
  const extra = (App._sheetHist && !$('ovl').classList.contains('open')) ? 1 : 0;
  try { history.go(-(1 + extra)); } catch(e){ App._pageClosing = false; closePageDOM(); }
};
window.addEventListener('popstate', (e)=>{
  const target = (e.state && e.state.c75) || 0;
  const uiDepth = ()=> (App._pageOpen ? 1 : 0) + (App._sheetHist ? 1 : 0);
  let guard = 4;
  while (uiDepth() > target && guard-- > 0){
    if (App._sheetHist){
      App._sheetHist = false;
      if ($('ovl').classList.contains('open')) closeSheetDOM();
    } else if (App._pageOpen){
      closePageDOM();
    }
  }
});

/* ============================================================
   THE AI DAY PLANNER — the day got hit; reorganize what's left.
   One input (what came up). The app already knows everything
   else: the fixed schedule, which rules are still open, the
   anchors. Propose-then-confirm, never auto-apply. Times move;
   requirements never do — XP and drops still key off real reps.
   ============================================================ */
function aiTierOne(day, dn){
  // the non-negotiables still open right now, with remaining counts
  return requiredRules(dn).filter(r=>!ruleMet(day,r)).map(r=>{
    if (r.type === 'count') return r.title + ' — ' + Math.max(0, r.goal-(day.r[r.id]||0)) + ' ' + r.unit + ' left';
    return r.title;
  });
}
function aiPlanPrompt(disruption){
  const t = todayStr();
  const day = getDay(t);
  const dn = dayNumOf(t);
  const now = new Date();
  const hhmm = pad(now.getHours()) + ':' + pad(now.getMinutes());
  const sched = SCHEDULE.map((s,i)=>{
    const past = (now.getHours()*60+now.getMinutes()) >= SCHED_MIN[i][1];
    return '- ' + s[0] + ' | ' + s[1] + (past ? ' | ELAPSED' : '');
  }).join('\n');
  return `You are replanning ONE day of a fixed 75-day discipline protocol. It is ${niceDate(t)} (Day ${dn} of 75), current time ${hhmm}. Replan ONLY from now until lights-out. Something came up:

DISRUPTION (LOCKED — must appear exactly as given): ${disruption}

LOCKED ANCHORS (never move, shrink, or drop): the disruption above · wind-down starts 20:30 · in bed 21:45 · lights out 22:00 · caffeine cutoff already at 12:00.

TODAY'S NORMAL TEMPLATE (blocks marked ELAPSED are in the past — do not reschedule them):
${sched}

TIER 1 — still open right now, may SHRINK toward a minimum but may NEVER be dropped:
${aiTierOne(day, dn).map(x=>'- '+x).join('\n') || '- (all non-negotiables already sealed — protect wind-down and recovery)'}

TIER 2 (protect, may move): deep-work dial blocks · training (ideal 15:00, movable ±2h, never within 1h of lights-out) · meals.
TIER 3 (flexible): admin · hobby · social block · free block.

RULES: dials belong in morning/early-afternoon energy; keep ≥10 min between blocks and nothing back-to-back with the disruption; keep at least one real meal break; deep-work blocks 45–90 min; if it all can't fit, shrink Tier 2/3 first, and list anything that still doesn't fit in at_risk — never silently omit an item. The summary must be one neutral, practical sentence — no praise, no shame, no motivation-speak.

Return the revised plan from ${hhmm} to 22:00 as JSON only: blocks in chronological order, "changed" true on any block you moved/shrunk/created, "note" a short reason when changed (else empty string).`;
}
const AI_PLAN_SCHEMA = {
  type:'object', additionalProperties:false, required:['summary','blocks','at_risk'],
  properties:{
    summary:{type:'string'},
    blocks:{type:'array', items:{type:'object', additionalProperties:false,
      required:['start','end','title','changed','note'],
      properties:{ start:{type:'string'}, end:{type:'string'}, title:{type:'string'},
        changed:{type:'boolean'}, note:{type:'string'} }}},
    at_risk:{type:'array', items:{type:'string'}},
  },
};
/* every AI answer is untrusted data: clamp, time-check, size-cap, esc() at render */
function aiValidatePlan(p){
  if (!p || typeof p.summary !== 'string' || !Array.isArray(p.blocks)) return null;
  const T = /^([01]?\d|2[0-3]):[0-5]\d$/;
  const mins = s => +s.slice(0, -3) * 60 + +s.slice(-2);
  let blocks = p.blocks.slice(0, 30).filter(b => b && T.test(String(b.start||'')) && T.test(String(b.end||'')) && String(b.title||'').trim())
    .map(b => ({ start:String(b.start), end:String(b.end), title:String(b.title).slice(0,90),
      changed:!!b.changed, note:String(b.note||'').slice(0,120) }))
    .filter(b => mins(b.end) > mins(b.start));                   // zero/negative-length out
  blocks.sort((a,b) => mins(a.start) - mins(b.start));
  const kept = [];
  for (const b of blocks) if (!kept.length || mins(b.start) >= mins(kept[kept.length-1].end)) kept.push(b);
  blocks = kept;                                                 // overlaps out (vs last KEPT)
  if (!blocks.length) return null;
  return { summary:String(p.summary).slice(0,240), blocks,
    at_risk:(Array.isArray(p.at_risk)?p.at_risk:[]).slice(0,10).map(x=>String(x).slice(0,90)) };
}

function icsEscape(s){ return String(s).replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\r?\n/g,'\\n'); }
function icsFold(line){
  // RFC5545: physical lines max 75 OCTETS of UTF-8. Count real bytes and never
  // split a surrogate pair (emoji) across a fold.
  const bytesOf = (code)=> code < 0x80 ? 1 : (code < 0x800 ? 2 : 3);
  let out = '', cur = '', bytes = 0, budget = 74;   // continuation lines lose 1 to the lead space
  for (let i = 0; i < line.length; i++){
    const code = line.charCodeAt(i);
    const isPair = code >= 0xD800 && code <= 0xDBFF && i + 1 < line.length;
    const chunk = isPair ? line.slice(i, i + 2) : line[i];
    const b = isPair ? 4 : bytesOf(code);
    if (bytes + b > budget){ out += cur + '\r\n '; cur = ''; bytes = 0; budget = 73; }
    cur += chunk; bytes += b;
    if (isPair) i++;
  }
  return out + cur;
}
const ICS_TZ = 'America/Los_Angeles';
const ICS_VTIMEZONE = [
  'BEGIN:VTIMEZONE','TZID:' + ICS_TZ,
  'BEGIN:DAYLIGHT','TZOFFSETFROM:-0800','TZOFFSETTO:-0700','TZNAME:PDT','DTSTART:19700308T020000','RRULE:FREQ=YEARLY;BYMONTH=3;BYDAY=2SU','END:DAYLIGHT',
  'BEGIN:STANDARD','TZOFFSETFROM:-0700','TZOFFSETTO:-0800','TZNAME:PST','DTSTART:19701101T020000','RRULE:FREQ=YEARLY;BYMONTH=11;BYDAY=1SU','END:STANDARD',
  'END:VTIMEZONE',
].join('\r\n');
function icsEvent(date, hm, summary, desc, uidSeed){
  const d8 = date.replace(/-/g,'');
  const endHm = (String(+hm.slice(0,2)).padStart(2,'0')) + String(Math.min(59, +hm.slice(2)+10)).padStart(2,'0');
  const stamp = new Date().toISOString().replace(/[-:]/g,'').slice(0,15) + 'Z';
  return [
    'BEGIN:VEVENT',
    icsFold('UID:c75-' + hashStr(uidSeed + date + hm) + '-' + d8 + '@congruence75'),
    'DTSTAMP:' + stamp,
    'DTSTART;TZID=' + ICS_TZ + ':' + d8 + 'T' + hm + '00',
    'DTEND;TZID=' + ICS_TZ + ':' + d8 + 'T' + endHm + '00',
    icsFold('SUMMARY:' + icsEscape(summary)),
    icsFold('DESCRIPTION:' + icsEscape(desc)),
    'BEGIN:VALARM',
    'ACTION:DISPLAY',
    icsFold('DESCRIPTION:' + icsEscape(summary)),
    'TRIGGER:-PT0M',
    'END:VALARM',
    'END:VEVENT',

function buildAlarmPack(opts){

  for (let n = 1; n <= FORGE_DAYS; n++){
    const ds = dateOfDayNum(n);
    const dow = parseDate(ds).getDay();
    if (opts.wake) events.push(icsEvent(ds, '0600', `Day ${n} — UP. No snooze, no phone. ⚒`, 'Water. Sunlight walk. ' + qFor(ds), 'wake'));
    if (opts.caffeine) events.push(icsEvent(ds, '1200', 'Caffeine cutoff — hard stop ☕', 'Last cup. Sleep is the whole engine.', 'caf'));
    if (opts.train) events.push(icsEvent(ds, '1500', `Training — ${WORKOUTS[WEEK_PLAN[dow][0]].name} 🔥`, WEEK_PLAN[dow][1], 'train'));
    if (opts.wind) events.push(icsEvent(ds, '2030', `Wind-down — close out Day ${n}. Win it, claim tonight's drop 🎴`, 'Phone to the hallway. 10 pages. Photo. Tracker. ' + qFor(ds), 'wind'));

    if (opts.affirm && dow === 0) events.push(icsEvent(ds, '1700', 'Values affirmation — 15 min by hand ✍', 'One value core to who you are, and why. Then the mission block.', 'aff'));
  }

      if (dayNumOf(t) >= 1 && dayStatus(t) === 'open') navigator.setAppBadge(1).catch(()=>{});
      else navigator.clearAppBadge().catch(()=>{});
    }
  } catch(e){}
}
function updateHdr(){
  const t = todayStr();
  const dn = dayNumOf(t);
  const el = $('hdrDay');
  let txt;
  if (dn < 1) txt = 'RUNWAY';
  else if (dn <= FORGE_DAYS) txt = 'DAY ' + dn + ' / 75';
  else txt = 'STANDARD +' + (dn - FORGE_DAYS);
  // evening ambience: quiet countdown chip while rules remain
  const day = S.days[t];
  if (dn >= 1 && day && !day.closed && dayStatus(t) === 'open' && new Date().getHours() >= 20){
    const req = requiredRules(dn);
    const left = req.length - req.reduce((a,r)=>a+(ruleMet(day,r)?1:0),0);
    if (left > 0){
      if (new Date().getHours() >= 23){
        txt += ` · ${left} LEFT`;   // after 23:00: calm and direct, no ticking clock
      } else {
        const mins = Math.max(0, (24*60) - (new Date().getHours()*60 + new Date().getMinutes()));
        txt += ` · ${left} LEFT · ${Math.floor(mins/60)}H ${mins%60}M`;
      }
    }
  }
  el.textContent = txt;
}
/* a view doesn't blink into place — its contents rise in sequence. Only on
   arrival (tab switch / launch), never on the re-renders a tap triggers. */
function enterView(tab){
  if (REDUCED_MOTION || App._booting) return;   // the boot render stays still under the splash
  const v = $('view-' + (tab || S.ui.tab));
  if (!v) return;
  v.classList.remove('entering');
  void v.offsetWidth;                 // restart the animation cleanly
  v.classList.add('entering');
  clearTimeout(enterView._t);
  enterView._t = setTimeout(()=>v.classList.remove('entering'), 1100);
}
const TAB_ORDER = ['today','train','fuel','money','progress'];
App.go = (tab)=>{
  const dir = TAB_ORDER.indexOf(tab) >= TAB_ORDER.indexOf(S.ui.tab) ? 1 : -1;
  document.documentElement.style.setProperty('--dir', dir);
  S.ui.tab = tab; save();
  document.querySelectorAll('.view').forEach(v=>v.classList.toggle('active', v.id === 'view-'+tab));
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active', b.dataset.tab === tab));
  // fresh render of the tab being opened (dates/times may have moved)
  ({today:renderToday, train:renderTrain, fuel:renderFuel, money:renderMoney, progress:renderProgress})[tab]();
  window.scrollTo({top:0});
  enterView(tab);
};

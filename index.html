/* ---------- speech drill studio v2 ----------
   A rotating reading library (passages assembled from the 400-quote corpus +
   the Charter + protocol voice — thousands of distinct combinations, a fresh
   deterministic set every day) + a live filler-word radar. Read a passage 3×,
   slower each time, then advance; the radar counts um/uh/like while you talk.
   Neutral numbers only — data, never a verdict. */
const SP_OPEN = [
  'Slow is not hesitation. Slow is command.',
  'Read like the sentence is worth waiting for.',
  'Low breath. Long spine. Let the words walk.',
  'The room waits for the man who does not rush.',
  'Every syllable gets its full second of air.',
  'Speak like the period is a place you live.',
  'This is a rep. Treat it like the bar is loaded.',
  'Weight over speed — in the gym and in the mouth.',
];
const SP_BRIDGE = [
  'Hold that. Now this:',
  'Sit with that line. Then take the next one:',
  'Again — different words, same weight:',
  'Now the second strike:',
  'Breathe at the dash. Then:',
  'Let it land before you lift the next one:',
];
const SP_CLOSE = [
  'Say it slower than feels natural. That is the natural speed.',
  'Finish every sentence. Never let the ending fall off the table.',
  'The pause is not empty. The pause is where the weight sits.',
  'End on the consonant. Land it clean.',
  'A man who owns his pace owns the room.',
  'Done? Read it once more — slower.',
];
/* every passage lands in the 120–150 word band: long enough for a stable WPM
   (~55s at the 140 target), short enough to read three times */
function speechPassage(slot){
  const c = corpus();
  const h = (k)=> hashStr(todayStr() + '|sp' + slot + '|' + k);
  if (!c.length){
    return 'Discipline is a promise kept in the dark, when nobody is watching and nothing is owed. The man who slows his words commands the room, because what he says was worth the wait. Speak like the sentence matters. It does. Every rep of this drill is a vote for the voice you are building — steady, low, unhurried, undeniable. Say it again, slower.';
  }
  const used = {};
  const pick = (k)=>{ let i = h(k) % c.length, g = 0; while (used[i] && g++ < 30) i = (i + 13) % c.length; used[i] = 1; return c[i]; };
  const parts = [SP_OPEN[h('o') % SP_OPEN.length]];
  const q1 = pick('a'); parts.push('“' + q1.q + '” — ' + q1.a + '.');
  parts.push(SP_BRIDGE[h('br') % SP_BRIDGE.length]);
  const q2 = pick('b'); parts.push('“' + q2.q + '” — ' + q2.a + '.');
  const ch = CHARTER[h('c') % CHARTER.length];
  const charterLine = 'I am a man who ' + ch[0].charAt(0).toLowerCase() + ch[0].slice(1) + ' ' + ch[1];
  const words = ()=> parts.join(' ').trim().split(/\s+/).length;
  let g = 0;
  while (words() + charterLine.split(/\s+/).length < 122 && g++ < 4){
    const q = pick('t' + g);
    parts.push('“' + q.q + '” — ' + q.a + '.');
  }
  parts.push(charterLine);
  parts.push(SP_CLOSE[h('cl') % SP_CLOSE.length]);
  return parts.join(' ');
}
/* the improvised rep: fillers live in SPONTANEOUS speech, not in reading —
   this is where the radar belongs. Table-Topics style, his life, no research needed */
const SP_PROMPTS = [
  'Walk me through your day so far — out loud, in order.',
  'What did you do today that the old you would have skipped?',
  'Explain your job to a stranger in thirty seconds.',
  'Sell me the thing you sell. Go.',
  'What is the hardest part of the protocol this week, and why?',
  'Describe the room you are standing in, slowly, in full sentences.',
  'What are you doing tomorrow, and when exactly?',
  'Teach me one thing you learned from the last book you read.',
  'Why does the Africa mission matter to you? Say it out loud.',
  'What would you tell a friend who wants to start 75 Hard?',
  'Describe your training session today like a coach would.',
  'What is one thing you avoided this week? Say it plainly.',
  'Talk about the last conversation that went well.',
  'Explain what discipline means, without using the word discipline.',
  'What does the man you are building do on a Tuesday morning?',
  'Pitch yourself for a job in sixty seconds.',
  'What are three things you are grateful for? Full sentences.',
  'Describe the best meal you have cooked this month.',
  'What is your plan when the urge hits at 9pm?',
  'Tell the story of one call that did not go your way.',
  'What is the difference between busy and effective?',
  'Describe your ideal Saturday twelve months from today.',
  'What do you want people to say about you when you leave a room?',
  'Explain the rule you find easiest, and why it is easy.',
  'Talk about someone who has helped you this year.',
  'What did you believe a year ago that you no longer believe?',
  'Describe the walk you took today. Details.',
  'What advice would Day-75 you give Day-1 you?',
  'Explain how you handle a no, out loud.',
  'What is one habit you want to still have at thirty?',
];
function speechPrompt(n){
  return SP_PROMPTS[hashStr(todayStr() + '|prompt' + (n||0)) % SP_PROMPTS.length];
}
/* LEXICAL fillers only. Recognition backends strip "um"/"uh" from transcripts
   entirely — they can never be auto-counted, so those get a tap-counter (and
   self-tallying is itself the intervention: you become your own ah-counter). */
const FILLERS = [
  ['like', /\blike\b/g], ['you know', /\byou know\b/g], ['i mean', /\bi mean\b/g],
  ['basically', /\bbasically\b/g], ['literally', /\bliterally\b/g],
  ['actually', /\bactually\b/g], ['kinda', /\bkind of\b|\bkinda\b/g],
  ['sorta', /\bsort of\b|\bsorta\b/g], ['honestly', /\bhonestly\b/g],
  ['so…', /^\s*so\b/g], ['right?', /\bright\s*[?.]/g],
];
/* the constructor EXISTS on iOS home-screen apps but never returns a result —
   detect the situation, not the API, and never render a button that can't work */
const IS_STANDALONE = (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
const IS_IOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const SR_OK = !!(window.SpeechRecognition || window.webkitSpeechRecognition)
  && !(IS_IOS && IS_STANDALONE)
  && (location.protocol === 'https:' || location.hostname === 'localhost');
App._rec = null;
App._sp = null;
function spState(){
  if (!App._sp) App._sp = { slot:0, reads:0, cold:true, repOn:false, auto:0, byWord:{}, manual:0, words:0, heard:false };
  return App._sp;
}
App.fillerTap = ()=>{
  const s = spState();
  if (!s.repOn) return;
  s.manual++; haptic.step(); App.repRender();
};
function fillerStart(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR_OK || !SR) return;
  const s = spState();
  const rec = new SR();
  rec.lang = 'en-US'; rec.continuous = true; rec.interimResults = false;
  rec.onresult = (e)=>{
    for (let i = e.resultIndex; i < e.results.length; i++){
      if (!e.results[i].isFinal) continue;      // finals only, from resultIndex —
      const raw = String(e.results[i][0].transcript || '').trim();   // interims re-send
      if (!raw) continue;
      s.heard = true;
      s.words += raw.split(/\s+/).length;
      const txt = ' ' + raw.toLowerCase() + ' ';
      for (const [name, re] of FILLERS){
        const m = txt.match(re);
        if (m){ s.byWord[name] = (s.byWord[name]||0) + m.length; s.auto += m.length; }
      }
    }
    App.repRender();
  };
  // restarting on silence is required (engines auto-stop), but an engine that
  // errors every time must not spin: cap the restarts and fall back to tapping
  s.restarts = 0;
  rec.onend = ()=>{
    if (App._rec !== rec || !s.repOn) return;
    if (s.restarts++ > 12){ fillerStop(); App.repRender(); return; }
    try { rec.start(); } catch(err){}
  };
  rec.onerror = (e)=>{
    const err = e && e.error;
    if (err === 'no-speech') return;                    // normal: silence, onend restarts
    if (err === 'not-allowed' || err === 'service-not-allowed' || err === 'audio-capture'){
      fillerStop(); s.srDead = true; App.repRender(); return;
    }
    if (s.restarts++ > 12){ fillerStop(); s.srDead = true; App.repRender(); }   // network etc.
  };
  try { rec.start(); App._rec = rec; } catch(err){ App._rec = null; }
}
function fillerStop(){
  const rec = App._rec; App._rec = null;
  // detach onresult too, or late finals keep incrementing a total that was
  // already written to the day record
  if (rec){ try { rec.onend = null; rec.onresult = null; rec.onerror = null; rec.stop(); } catch(e){} }
}
/* ---- the improvised minute: 60 seconds of spontaneous speech ---- */
App.repToggle = ()=>{
  const s = spState();
  if (s.repOn){ App.repEnd(); return; }
  s.repOn = true; s.auto = 0; s.byWord = {}; s.manual = 0; s.words = 0; s.heard = false;
  s.repStop = Date.now() + 60000;
  fillerStart();
  clearInterval(App._repT);
  App._repT = setInterval(()=>{
    if (!App._sp || !App._sp.repOn) { clearInterval(App._repT); return; }
    if (Date.now() >= App._sp.repStop){ App.repEnd(); return; }
    App.repRender();
  }, 250);
  App.repRender();
};
App.repEnd = ()=>{
  const s = spState();
  if (!s.repOn) return;        // the timer and the Stop button both land here —
  clearInterval(App._repT); App._repT = null;   // tally exactly once
  s.repOn = false;
  fillerStop();
  const total = s.auto + s.manual;
  if (total > 0){
    const d = getDay(todayStr());
    d.fillers = (d.fillers||0) + total;   // neutral tally, never a score
    save();
  }
  haptic.tick();
  App.repRender();
};
App.repRender = ()=>{
  const box = $('repBox'); if (!box) return;
  const s = spState();
  const left = s.repOn ? Math.max(0, Math.ceil((s.repStop - Date.now())/1000)) : 0;
  const total = s.auto + s.manual;
  const chips = Object.keys(s.byWord).sort((a,b)=>s.byWord[b]-s.byWord[a]).slice(0,5)
    .map(k=>`<span class="chip">${k} ×${s.byWord[k]}</span>`).join('');
  const autoLine = (!SR_OK || s.srDead)
    ? `<div class="muted mt8">Live counting isn't available here — tap <b>um / uh</b> yourself as you hear them. Counting your own is the drill that actually works.</div>`
    : (s.repOn && !s.heard ? `<div class="muted mt8">listening… (mic takes a second to warm up)</div>` : '');
  box.innerHTML = `
    <div class="row"><div class="grow small"><b>The improvised minute</b> <span class="muted">· fillers live here, not in reading</span></div>
      ${s.repOn ? `<span class="day-chip" style="background:var(--ember-dim);color:var(--ember-text);border-color:rgba(255,160,50,.3)">${left}s</span>` : ''}</div>
    <div class="card tight small mt8" style="border-left:3px solid var(--baseline)">${esc(speechPrompt(s.slot))}</div>
    <div class="two-col mt8">
      <button class="btn ${s.repOn?'ghost ':''}sm" onclick="App.repToggle()">${s.repOn ? 'Stop early' : '🎤 Start the minute'}</button>
      <button class="btn ghost sm" ${s.repOn?'':'disabled'} onclick="App.fillerTap()">＋ um / uh${s.manual?' · '+s.manual:''}</button>
    </div>
    ${(total || (s.repOn && s.heard)) ? `<div class="small mt8">${total} filler${total===1?'':'s'}${s.words>19?` in ~${s.words} words`:''}${SR_OK&&s.auto?` <span class="muted">(${s.auto} heard, ${s.manual} tapped)</span>`:''}</div>` : ''}

    mr.onstop = ()=>{
      stream.getTracks().forEach(t=>t.stop());
      App._mr = null;
      clearTimeout(App._mrT);
      const blob = new Blob(chunks, { type: mr.mimeType || 'audio/webm' });

/* wall-clock timers: a backgrounded iOS app freezes setInterval, so counting
   ticks loses time — remaining seconds are always derived from a timestamp */
function runClock(totalSecs, clockId, onDone){
  const endAt = Date.now() + totalSecs * 1000;
  clearInterval(App._sosT);
  const paint = ()=>{
    const ms = endAt - Date.now();
    const left = Math.max(0, Math.ceil(ms / 1000));   // ceil, so the last second is real
    const el = $(clockId);
    if (el) el.textContent = Math.floor(left/60) + ':' + pad(left%60);
    // one alarm at zero, from the one place every timer ends
    if (ms <= 0){ clearInterval(App._sosT); App._sosT = null; haptic.alarm(); onDone(); }
  };
  App._sosT = setInterval(paint, 500);
  paint();
}
/* the drill deadline is persisted, not just held in a closure: closing the
   sheet (or the phone killing the tab) used to silently cancel the ten minutes
   and the rule never sealed. Now it survives, resumes, and settles on its own. */
function sealDrill(drillDate){
  const d = getDay(drillDate);
  if (!d.r.speech){
    d.r.speech = true;
    if (todayStr() === drillDate) markFirstSeal(d);
  }
  if (S.ui.drill) delete S.ui.drill;
  save();
  const b = $('sosBtn'); if (b) b.textContent = 'Sealed ✓';
  // the clock already sounded the alarm a beat ago — don't stack a second cue
  renderToday();
}
function resumeDrill(){
  const dr = S.ui.drill;
  if (!dr || !dr.d) return false;
  if (dr.d !== todayStr()){ delete S.ui.drill; save(); return false; }   // yesterday's drill
  const leftMs = dr.end - Date.now();
  if (leftMs <= 0){ sealDrill(dr.d); return false; }
  const btn = $('sosBtn');
  if (btn){ btn.textContent = 'Drilling…'; btn.disabled = true; }
  runClock(Math.round(leftMs/1000), 'sosClock', ()=>sealDrill(dr.d));
  return true;
}

/* gist auto-backup: his own GitHub, his own token, every close-out */
let _gistT = null;
function backupToGist(){
  if (!S.gist.pat) return;
  S.gist.pending = true;   // honest status until the push actually lands
  clearTimeout(_gistT);
  _gistT = setTimeout(()=>{
    // never upload the tokens inside their own backup
    const clone = JSON.parse(JSON.stringify(S));
    // pending is a live push flag, not data — shipping it true makes every
    // restored backup claim its last push failed
    clone.gist = Object.assign({}, clone.gist, { pat: '', pending: false });
    clone.ai = Object.assign({}, clone.ai, { key: '' });
    const body = { description: 'Congruence 75 backup', public: false,
      files: { 'c75-backup.json': { content: JSON.stringify(clone) } } };
    const url = S.gist.id ? 'https://api.github.com/gists/' + S.gist.id : 'https://api.github.com/gists';
    fetch(url, {
      method: S.gist.id ? 'PATCH' : 'POST',
      headers: { 'Authorization': 'Bearer ' + S.gist.pat, 'Accept': 'application/vnd.github+json' },
      body: JSON.stringify(body),
    }).then(r => r.ok ? r.json() : Promise.reject(r.status)).then(j => {
      if (j && j.id) S.gist.id = j.id;
      S.gist.last = todayStr(); S.gist.pending = false; save();
    }).catch(()=>{ S.gist.pending = true; save(); });
  }, 800);
}
// a pending push retries on the next app open

    <div class="page-hdr">
      <button class="pg-back" onclick="App.closePage()" aria-label="Back">‹</button>
      <div><div class="pg-title">${title}</div>${sub?`<div class="muted" style="font-size:11px;margin-top:1px">${sub}</div>`:''}</div>
    </div>
    <div class="page-body">${bodyHtml}</div>`;
  if (!App._pageOpen){
    App._pageOpen = true;
    App._pageScroll = window.scrollY || 0;
    document.body.style.top = (-App._pageScroll) + 'px';
    document.body.classList.add('sheet-open');
    // depth must be unique per live layer: a stale guard (sheet already closed)
    // is RECYCLED into the page entry, but a guard belonging to a sheet that is
    // still open sits below the page, so the page entry has to claim depth 2 —
    // otherwise back reads two layers as one and strands the page open
    const sheetOpen = $('ovl').classList.contains('open');
    if (App._sheetHist && !sheetOpen){
      App._sheetHist = false;
      try { history.replaceState({ c75: 1 }, '', '#/' + id); } catch(e){}
    } else {
      try { history.pushState({ c75: (App._sheetHist ? 2 : 1) }, '', '#/' + id); } catch(e){}
    }
    host.classList.add('on');
    requestAnimationFrame(()=> host.classList.add('in'));
  } else {
    host.scrollTop = 0;   // in-place swap (tab change) — no new history entry
  }
}
function closePageDOM(){
  const host = $('page');
  App._pageOpen = false;
  App._pageClosing = false;
  // the dawn ritual was skipped while this page was up — it gets its moment now
  setTimeout(()=>{ try { App.checkMorningChest(); } catch(e){} }, 400);
  host.classList.remove('in');
  document.body.classList.remove('sheet-open');
  document.body.style.top = '';
  window.scrollTo(0, App._pageScroll || 0);
  setTimeout(()=>{ if (!App._pageOpen){ host.classList.remove('on'); host.innerHTML = ''; } }, 320);
}
App.closePage = ()=>{
  if (!App._pageOpen || App._pageClosing) return;   // double-tap during the slide can't over-pop
  App._pageClosing = true;
  // jump past any stale sheet-guard entry sitting on top of the page entry
  const extra = (App._sheetHist && !$('ovl').classList.contains('open')) ? 1 : 0;
  try { history.go(-(1 + extra)); } catch(e){ App._pageClosing = false; closePageDOM(); }
};
window.addEventListener('popstate', (e)=>{
  const target = (e.state && e.state.c75) || 0;
  const uiDepth = ()=> (App._pageOpen ? 1 : 0) + (App._sheetHist ? 1 : 0);
  let guard = 4;
  while (uiDepth() > target && guard-- > 0){
    if (App._sheetHist){
      App._sheetHist = false;
      if ($('ovl').classList.contains('open')) closeSheetDOM();
    } else if (App._pageOpen){
      closePageDOM();
    }
  }
});

/* ============================================================
   THE AI DAY PLANNER — the day got hit; reorganize what's left.
   One input (what came up). The app already knows everything
   else: the fixed schedule, which rules are still open, the
   anchors. Propose-then-confirm, never auto-apply. Times move;
   requirements never do — XP and drops still key off real reps.
   ============================================================ */
function aiTierOne(day, dn){
  // the non-negotiables still open right now, with remaining counts
  return requiredRules(dn).filter(r=>!ruleMet(day,r)).map(r=>{
    if (r.type === 'count') return r.title + ' — ' + Math.max(0, r.goal-(day.r[r.id]||0)) + ' ' + r.unit + ' left';
    return r.title;
  });
}
function aiPlanPrompt(disruption){
  const t = todayStr();
  const day = getDay(t);
  const dn = dayNumOf(t);
  const now = new Date();
  const hhmm = pad(now.getHours()) + ':' + pad(now.getMinutes());
  const nowM = now.getHours()*60 + now.getMinutes();
  const sched = daySchedule().map(b=>
    '- ' + b.label + ' | ' + b.x + (nowM >= b.e ? ' | ELAPSED' : '')).join('\n');
  return `You are replanning ONE day of a fixed 75-day discipline protocol. It is ${niceDate(t)} (Day ${dn} of 75), current time ${hhmm}. Replan ONLY from now until lights-out. Something came up:

DISRUPTION (LOCKED — must appear exactly as given): ${disruption}

LOCKED ANCHORS (never move, shrink, or drop): the disruption above · wind-down starts 20:30 · in bed 21:45 · lights out 22:00 · caffeine cutoff already at 12:00.

TODAY'S NORMAL TEMPLATE (blocks marked ELAPSED are in the past — do not reschedule them):
${sched}

TIER 1 — still open right now, may SHRINK toward a minimum but may NEVER be dropped:
${aiTierOne(day, dn).map(x=>'- '+x).join('\n') || '- (all non-negotiables already sealed — protect wind-down and recovery)'}

TIER 2 (protect, may move): deep-work dial blocks · training (ideal 15:00, movable ±2h, never within 1h of lights-out) · meals.
TIER 3 (flexible): admin · hobby · social block · free block.

RULES: dials belong in morning/early-afternoon energy; keep ≥10 min between blocks and nothing back-to-back with the disruption; keep at least one real meal break; deep-work blocks 45–90 min; if it all can't fit, shrink Tier 2/3 first, and list anything that still doesn't fit in at_risk — never silently omit an item. The summary must be one neutral, practical sentence — no praise, no shame, no motivation-speak.

Return the revised plan from ${hhmm} to 22:00 as JSON only: blocks in chronological order, "changed" true on any block you moved/shrunk/created, "note" a short reason when changed (else empty string).`;
}
const AI_PLAN_SCHEMA = {
  type:'object', additionalProperties:false, required:['summary','blocks','at_risk'],
  properties:{
    summary:{type:'string'},
    blocks:{type:'array', items:{type:'object', additionalProperties:false,
      required:['start','end','title','changed','note'],
      properties:{ start:{type:'string'}, end:{type:'string'}, title:{type:'string'},
        changed:{type:'boolean'}, note:{type:'string'} }}},
    at_risk:{type:'array', items:{type:'string'}},
  },
};
/* every AI answer is untrusted data: clamp, time-check, size-cap, esc() at render */
function aiValidatePlan(p){
  if (!p || typeof p.summary !== 'string' || !Array.isArray(p.blocks)) return null;
  const T = /^([01]?\d|2[0-3]):[0-5]\d$/;
  const mins = s => +s.slice(0, -3) * 60 + +s.slice(-2);
  let blocks = p.blocks.slice(0, 30).filter(b => b && T.test(String(b.start||'')) && T.test(String(b.end||'')) && String(b.title||'').trim())
    .map(b => ({ start:String(b.start), end:String(b.end), title:String(b.title).slice(0,90),
      changed:!!b.changed, note:String(b.note||'').slice(0,120) }))
    .filter(b => mins(b.end) > mins(b.start));                   // zero/negative-length out
  blocks.sort((a,b) => mins(a.start) - mins(b.start));
  const kept = [];
  for (const b of blocks) if (!kept.length || mins(b.start) >= mins(kept[kept.length-1].end)) kept.push(b);
  blocks = kept;                                                 // overlaps out (vs last KEPT)
  if (!blocks.length) return null;
  return { summary:String(p.summary).slice(0,240), blocks,
    at_risk:(Array.isArray(p.at_risk)?p.at_risk:[]).slice(0,10).map(x=>String(x).slice(0,90)) };
}

function icsEscape(s){ return String(s).replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\r?\n/g,'\\n'); }
function icsFold(line){
  // RFC5545: physical lines max 75 OCTETS of UTF-8. Count real bytes and never
  // split a surrogate pair (emoji) across a fold.
  const bytesOf = (code)=> code < 0x80 ? 1 : (code < 0x800 ? 2 : 3);
  let out = '', cur = '', bytes = 0, budget = 74;   // continuation lines lose 1 to the lead space
  for (let i = 0; i < line.length; i++){
    const code = line.charCodeAt(i);
    const isPair = code >= 0xD800 && code <= 0xDBFF && i + 1 < line.length;
    const chunk = isPair ? line.slice(i, i + 2) : line[i];
    const b = isPair ? 4 : bytesOf(code);
    if (bytes + b > budget){ out += cur + '\r\n '; cur = ''; bytes = 0; budget = 73; }
    cur += chunk; bytes += b;
    if (isPair) i++;
  }
  return out + cur;
}
const ICS_TZ = 'America/Los_Angeles';
const ICS_VTIMEZONE = [
  'BEGIN:VTIMEZONE','TZID:' + ICS_TZ,
  'BEGIN:DAYLIGHT','TZOFFSETFROM:-0800','TZOFFSETTO:-0700','TZNAME:PDT','DTSTART:19700308T020000','RRULE:FREQ=YEARLY;BYMONTH=3;BYDAY=2SU','END:DAYLIGHT',
  'BEGIN:STANDARD','TZOFFSETFROM:-0700','TZOFFSETTO:-0800','TZNAME:PST','DTSTART:19701101T020000','RRULE:FREQ=YEARLY;BYMONTH=11;BYDAY=1SU','END:STANDARD',
  'END:VTIMEZONE',
].join('\r\n');
function icsEvent(date, hm, summary, desc, uidSeed){
  const d8 = date.replace(/-/g,'');
  // +10 minutes, rolling the hour (and the date at midnight) rather than
  // clamping the minutes to :59 — a 06:55 block used to get a 4-minute event
  const endTot = (+hm.slice(0,2) * 60 + +hm.slice(2)) + 10;
  const endD8 = (endTot >= 1440 ? addDays(date, 1) : date).replace(/-/g,'');
  const em = endTot % 1440;
  const endHm = String(Math.floor(em/60)).padStart(2,'0') + String(em%60).padStart(2,'0');
  const stamp = new Date().toISOString().replace(/[-:]/g,'').slice(0,15) + 'Z';
  return [
    'BEGIN:VEVENT',
    icsFold('UID:c75-' + hashStr(uidSeed + date + hm) + '-' + d8 + '@congruence75'),
    'DTSTAMP:' + stamp,
    'DTSTART;TZID=' + ICS_TZ + ':' + d8 + 'T' + hm + '00',
    'DTEND;TZID=' + ICS_TZ + ':' + endD8 + 'T' + endHm + '00',
    icsFold('SUMMARY:' + icsEscape(summary)),
    icsFold('DESCRIPTION:' + icsEscape(desc)),
    'BEGIN:VALARM',
    'ACTION:DISPLAY',
    icsFold('DESCRIPTION:' + icsEscape(summary)),
    'TRIGGER:-PT0M',
    'END:VALARM',
    'END:VEVENT',
  ].join('\r\n');
}
function buildAlarmPack(opts){
  const events = [];
  const qFor = (date)=>{ const c = corpus(); if (!c.length){ const q = quoteFor(dayNumOf(date)); return '"' + q[0] + '" — ' + q[1]; } const x = c[hashStr(date+'daily') % c.length]; return '"' + x.q + '" — ' + x.a; };
  for (let n = 1; n <= FORGE_DAYS; n++){
    const ds = dateOfDayNum(n);
    const dow = parseDate(ds).getDay();
    if (opts.wake) events.push(icsEvent(ds, '0600', `Day ${n} — UP. No snooze, no phone. ⚒`, 'Water. Sunlight walk. ' + qFor(ds), 'wake'));
    if (opts.caffeine) events.push(icsEvent(ds, '1200', 'Caffeine cutoff — hard stop ☕', 'Last cup. Sleep is the whole engine.', 'caf'));
    if (opts.train) events.push(icsEvent(ds, '1500', `Training — ${WORKOUTS[WEEK_PLAN[dow][0]].name} 🔥`, WEEK_PLAN[dow][1], 'train'));
    if (opts.wind) events.push(icsEvent(ds, '2030', `Wind-down — close out Day ${n}. Win it, claim tonight's drop 🎴`, 'Phone to the hallway. 10 pages. Photo. Tracker. ' + qFor(ds), 'wind'));
    if (opts.review && dow === 5) events.push(icsEvent(ds, '1800', 'WEEKLY BOSS — the honest thirty 🗡', '8 questions in the app. +5 XP.', 'rev'));
    if (opts.affirm && dow === 0) events.push(icsEvent(ds, '1700', 'Values affirmation — 15 min by hand ✍', 'One value core to who you are, and why. Then the mission block.', 'aff'));
  }
  return 'BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//Congruence75//Forge Alarms//EN\r\nCALSCALE:GREGORIAN\r\nMETHOD:PUBLISH\r\nX-WR-CALNAME:Congruence 75\r\n' + ICS_VTIMEZONE + '\r\n' + events.join('\r\n') + '\r\nEND:VCALENDAR\r\n';
}

function applyImport(text){
  try {
    const parsed = JSON.parse(text);
    if (!parsed || !(parsed.v >= 1 && parsed.v <= 5)) throw new Error('bad');
    // backups deliberately ship with the secrets blanked — importing one must
    // not silently delete the key and the token that live only on this device
    const keepKey = S.ai && S.ai.key, keepPat = S.gist && S.gist.pat, keepId = S.gist && S.gist.id;
    S = normalizeState(parsed);
    if (keepKey && !S.ai.key) S.ai.key = keepKey;
    if (keepPat && !S.gist.pat){ S.gist.pat = keepPat; if (keepId && !S.gist.id) S.gist.id = keepId; }
    save(); App.closeSheet(); renderAll(); toast('Restored ✓ — every vote back in the file');
    return true;
  } catch(e){ toast('That doesn\'t look like a C75 backup'); return false; }
}
App.doImport = ()=>{ applyImport($('impText').value); };
App.importFile = (inp)=>{
  const f = inp.files && inp.files[0];
  inp.value = '';
  if (!f) return;
  const rd = new FileReader();
  rd.onload = ()=> applyImport(rd.result);
  rd.onerror = ()=> toast('Couldn\'t read that file');
  rd.readAsText(f);
};

/* cloud restore — the missing half of the gist backup (it was push-only) */
App.armGistRestore = (btn)=>{
  if (!btn.dataset.armed){
    btn.dataset.armed = '1';
    btn.textContent = 'Tap again — this replaces what’s on this phone';
    return;
  }
  btn.textContent = 'Pulling…'; btn.disabled = true;
  fetch('https://api.github.com/gists/' + S.gist.id, {
    headers: { 'Authorization': 'Bearer ' + S.gist.pat, 'Accept': 'application/vnd.github+json' },
  }).then(r=> r.ok ? r.json() : Promise.reject(r.status)).then(j=>{
    const f = j && j.files && j.files['c75-backup.json'];
    if (!f || !f.content) throw new Error('empty');
    const pat = S.gist.pat, id = S.gist.id, key = S.ai.key;
    if (!applyImport(f.content)) throw new Error('bad backup');
    S.gist.pat = pat; S.gist.id = id; S.gist.pending = false; S.ai.key = key;   // secrets stay local
    save();
    toast('Restored from the cloud ☁ — every vote back in the file', 4000);
    App.openSettings('data');       // the page it lived on is stale now
  }).catch(()=>{
    btn.disabled = false; btn.textContent = '☁ Restore from the cloud backup…';
    delete btn.dataset.armed;
    toast('Couldn’t reach that backup — check the token');
  });
};
App.armReset = (btn)=>{
  if (btn.dataset.armed){
    S = freshState();
    // a reset is a new beginning — re-anchor Day 1 to tomorrow, never to the
    // original constant (which would land mid-Forge with a wall of lost days)
    if (parseDate(todayStr()) >= parseDate(S.profile.startDate)) S.profile.startDate = addDays(todayStr(), 1);
    photosWipe(); audioWipe();     // "everything" includes the voice tapes
    save(); App.closeSheet(); App.closePage(); renderAll(); toast('Fresh steel. Day 1 is tomorrow.');
  } else {
    btn.dataset.armed = '1';
    btn.textContent = 'Tap again to erase EVERYTHING (incl. photos)';
    btn.classList.add('danger'); btn.classList.remove('ghost');
  }
};

function renderAll(){
  updateHdr();
  renderToday(); renderTrain(); renderFuel(); renderMoney(); renderProgress();
  // ambient deadline: the icon carries a dot while today is unsealed
  try {
    if ('setAppBadge' in navigator){
      const t = todayStr();
      if (dayNumOf(t) >= 1 && dayStatus(t) === 'open') navigator.setAppBadge(1).catch(()=>{});
      else navigator.clearAppBadge().catch(()=>{});
    }
  } catch(e){}
}
function updateHdr(){
  const t = todayStr();
  const dn = dayNumOf(t);
  const el = $('hdrDay');
  let txt;
  if (dn < 1) txt = 'RUNWAY';
  else if (dn <= FORGE_DAYS) txt = 'DAY ' + dn + ' / 75';
  else txt = 'STANDARD +' + (dn - FORGE_DAYS);
  // evening ambience: quiet countdown chip while rules remain
  const day = S.days[t];
  if (dn >= 1 && day && !day.closed && dayStatus(t) === 'open' && new Date().getHours() >= 20){
    const req = requiredRules(dn);
    const left = req.length - req.reduce((a,r)=>a+(ruleMet(day,r)?1:0),0);
    if (left > 0){
      if (new Date().getHours() >= 23){
        txt += ` · ${left} LEFT`;   // after 23:00: calm and direct, no ticking clock
      } else {
        const mins = Math.max(0, (24*60) - (new Date().getHours()*60 + new Date().getMinutes()));
        txt += ` · ${left} LEFT · ${Math.floor(mins/60)}H ${mins%60}M`;
      }
    }
  }
  el.textContent = txt;
  /* On TODAY the hero already prints the day in 40px type two inches below —
     the chip was saying the same thing twice on one screen. It stays hidden
     there unless it's carrying something the hero doesn't: the evening count. */
  const dup = S.ui.tab === 'today' && !txt.includes('LEFT');
  el.style.display = dup ? 'none' : '';
  const hdr = document.querySelector('.hdr');
  if (hdr) hdr.classList.toggle('solo', dup);   // frees the wordmark back onto phones
}
/* a view doesn't blink into place — its contents rise in sequence. Only on
   arrival (tab switch / launch), never on the re-renders a tap triggers. */
function enterView(tab){
  if (REDUCED_MOTION || App._booting) return;   // the boot render stays still under the splash
  const v = $('view-' + (tab || S.ui.tab));
  if (!v) return;
  v.classList.remove('entering');
  void v.offsetWidth;                 // restart the animation cleanly
  v.classList.add('entering');
  clearTimeout(enterView._t);
  enterView._t = setTimeout(()=>v.classList.remove('entering'), 1100);
}
const TAB_ORDER = ['today','train','fuel','money','progress'];
App.go = (tab)=>{
  const dir = TAB_ORDER.indexOf(tab) >= TAB_ORDER.indexOf(S.ui.tab) ? 1 : -1;
  document.documentElement.style.setProperty('--dir', dir);
  S.ui.tab = tab; save();
  document.querySelectorAll('.view').forEach(v=>v.classList.toggle('active', v.id === 'view-'+tab));
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active', b.dataset.tab === tab));
  // fresh render of the tab being opened (dates/times may have moved)
  ({today:renderToday, train:renderTrain, fuel:renderFuel, money:renderMoney, progress:renderProgress})[tab]();
  updateHdr();     // the day chip hides on TODAY, shows everywhere else
  window.scrollTo({top:0});
  enterView(tab);
};

/* PWA plumbing — icons + manifest injected at runtime so the same single file
   works from file://, a static host, or the artifact page. Base64 icons are
   inserted by build.ps1 at the markers. */

/* ambient embers — sixteen slow sparks rising off the forge. Pauses when the
   app is hidden; absent entirely under prefers-reduced-motion. */
function startEmbers(){
  if (REDUCED_MOTION) return;
  const cv = $('embers');
  if (!cv) return;
  const ctx = cv.getContext('2d');
  let W = 0, H = 0, ps = [];
  const size = ()=>{
    W = cv.width = innerWidth; H = cv.height = innerHeight;
    ps = Array.from({ length: 16 }, ()=>spawn(true));
  };
  const spawn = (anywhere)=>({
    x: Math.random() * W,
    y: anywhere ? Math.random() * H : H + 10,
    r: Math.random() * 1.8 + 0.6,
    v: Math.random() * 0.35 + 0.12,
    drift: Math.random() * 0.6 - 0.3,
    ph: Math.random() * Math.PI * 2,
    a: Math.random() * 0.35 + 0.1,
  });
  size();
  addEventListener('resize', size);
  let t = 0;
  (function tick(){
    if (!document.hidden){
      t += 0.016;
      ctx.clearRect(0, 0, W, H);
      for (let i = 0; i < ps.length; i++){
        const p = ps[i];
        p.y -= p.v;
        p.x += Math.sin(t * 0.7 + p.ph) * p.drift * 0.4;
        if (p.y < -12) ps[i] = spawn(false);
        const flicker = 0.7 + 0.3 * Math.sin(t * 3 + p.ph);
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255,${140 + Math.round(60 * flicker)},40,${(p.a * flicker).toFixed(3)})`;
        ctx.fill();
      }
    }
    requestAnimationFrame(tick);
  })();
}

/* collapsible section helper — state persists per section in S.ui.folds.
   DAILY_FOLDS expire their remembered state each new day so context-driven
   defaults (evening check, cooling items, measure-day) win again tomorrow.
   Collapsed bodies are inert + aria-expanded so nothing invisible is focusable. */
const DAILY_FOLDS = { check:1, firewall:1, measure:1 };
function fold(id, title, badge, inner, defOpen){
  let open = !!defOpen;
  const st = S.ui.folds && S.ui.folds[id];
  if (st != null){
    const o = typeof st === 'object' ? st : { o: st, d: null };
    if (!DAILY_FOLDS[id] || o.d === todayStr()) open = !!o.o;
  }
  return `<div class="fold ${open?'open':''}" id="fold_${id}">
    <button class="fold-h" aria-expanded="${open}" onclick="App.fold('${id}')"><span>${title}</span><span class="fold-b">${badge||''}</span><span class="fold-c">▾</span></button>
    <div class="fold-body"${open?'':' inert'}><div><div class="fold-inner">${inner}</div></div></div>
  </div>`;
}
App.fold = (id)=>{
  if (!S.ui.folds) S.ui.folds = {};
  const el = document.getElementById('fold_' + id);
  if (!el) return;
  const open = el.classList.toggle('open');
  const h = el.querySelector('.fold-h'), b = el.querySelector('.fold-body');
  if (h) h.setAttribute('aria-expanded', open);
  if (b){ if (open) b.removeAttribute('inert'); else b.setAttribute('inert', ''); }
  S.ui.folds[id] = { o: open ? 1 : 0, d: todayStr() };
  save();
};

(function boot(){
  if (!CAN_STORE) $('storageWarn').style.display = 'block';
  try { history.scrollRestoration = 'manual'; } catch(e){}
  // a refresh mid-page or mid-sheet leaves a stale hash AND stale history.state
  // behind — clear both unconditionally so depth math starts from zero
  try { history.replaceState(null, '', location.pathname + location.search); } catch(e){}
  // the strike: logo splash on open — tap to skip, absent under reduced motion
  const sp = $('splash');
  if (sp){
    if (REDUCED_MOTION) sp.remove();
    else {
      // the mark flies into the header, then the app rises IN THROUGH the fading
      // splash — one continuous move, never render-then-vanish-then-rise
      App._booting = true;
      const land = ()=>{
        if (App._landed) return; App._landed = true;
        App._booting = false;
        sp.style.pointerEvents = 'none';
        sp.style.animation = 'spFade .3s ease forwards';   // also covers tap-skip
        enterView();
        const fab = $('fab');   // the FAB lands after the app rises, visibly
        if (fab){ fab.style.animation = 'none'; void fab.offsetWidth; fab.style.animation = ''; }
        setTimeout(()=>{ if (sp.parentNode) sp.remove(); }, 340);
      };
      sp.addEventListener('pointerdown', land, { once:true, passive:true });
      setTimeout(land, 1120);
    }
  }
  injectPWA();
  startEmbers();
  // real hosting only: offline cache + update-ready toast + durable storage
  if (/^https?:$/.test(location.protocol)){
    if ('serviceWorker' in navigator){
      navigator.serviceWorker.register('sw.js').then(reg=>{
        const notify = ()=>{
          if (!reg.waiting) return;
          toast('⬆ Update ready — tap here to load it', 12000, ()=>{
            App._userUpdate = true;
            $('toast').style.display = 'none'; $('toast').onclick = null;
            if (reg.waiting) reg.waiting.postMessage({ type:'SKIP_WAITING' });
          });
        };
        if (reg.waiting) notify();
        reg.addEventListener('updatefound', ()=>{
          const w = reg.installing;
          if (w) w.addEventListener('statechange', ()=>{ if (w.state === 'installed' && navigator.serviceWorker.controller) notify(); });
        });
        // coming back to the app re-checks AND re-offers a still-waiting update
        document.addEventListener('visibilitychange', ()=>{
          if (document.hidden) return;
          reg.update().catch(()=>{});
          if (reg.waiting) notify();
        });
      }).catch(()=>{});
      // reload on a real update handoff: either the session started controlled,
      // or the user explicitly tapped the update toast this session
      const _hadController = !!navigator.serviceWorker.controller;
      let _refreshing = false;
      navigator.serviceWorker.addEventListener('controllerchange', ()=>{
        if ((!_hadController && !App._userUpdate) || _refreshing) return;
        _refreshing = true; location.reload();
      });
    }
    try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(()=>{}); } catch(e){}
  }
  // native-feel press feedback + hold-to-seal, delegated so innerHTML swaps
  // never orphan them
  document.addEventListener('pointerdown', (e)=>{
    const el = e.target.closest ? e.target.closest('button, .chip, .tab, .rule.tappable, .gitem, .rw-item') : null;
    if (el && !el.disabled) el.classList.add('is-pressed');
    const hold = e.target.closest ? e.target.closest('.rule[data-hold]') : null;
    if (hold) holdStart(hold, e);
  }, { passive:true });
  for (const ev of ['pointerup','pointercancel']) document.addEventListener(ev, ()=>{
    document.querySelectorAll('.is-pressed').forEach(el=>el.classList.remove('is-pressed'));
    holdCancel();
  }, { passive:true });
  // hold − / + to fast-count: a clean tap acts on release; a hold repeats and
  // accelerates — no more mashing minus sixty times to walk a count back
  let _rep = null;
  const _repAct = (id, d)=>{
    if (id === '__set'){ const i = $('ctVal'); if (i) i.value = Math.max(0, Math.round(((parseFloat(i.value)||0) + d)*10)/10); return; }
    if (id === 'weight') App.bumpWeight(d); else App.bump(id, d);
  };
  document.addEventListener('pointerdown', (e)=>{
    const b = e.target.closest ? e.target.closest('button[data-bump]') : null;
    if (!b || b.disabled) return;
    const parts = b.dataset.bump.split(':');
    const id = parts[0], delta = parseFloat(parts[1]);
    let n = 0;
    const loop = ()=>{ n++; _repAct(id, delta); _rep.t = setTimeout(loop, n > 10 ? 65 : 130); };
    _rep = { id, delta, fired: ()=>n, t: setTimeout(loop, 420) };
  }, { passive:true });
  for (const ev of ['pointerup','pointercancel']) document.addEventListener(ev, (e)=>{
    if (!_rep) return;
    clearTimeout(_rep.t);
    const r = _rep; _rep = null;
    if (e.type === 'pointercancel' || r.fired() > 0) return;   // scroll, or the hold already counted
    _repAct(r.id, r.delta);                                     // clean tap: act once on release
  }, { passive:true });
  document.querySelectorAll('.tab').forEach(b=> b.addEventListener('click', ()=>App.go(b.dataset.tab)));
  $('btnCharter').addEventListener('click', App.openCharter);
  $('btnSettings').addEventListener('click', App.openSettings);
  $('ovl').addEventListener('click', (e)=>{ if (e.target === $('ovl')) App.closeSheet(); });
  renderAll();
  App.go(S.ui.tab && ['today','train','fuel','money','progress'].includes(S.ui.tab) ? S.ui.tab : 'today');
  // midnight rollover: if the date changes while the app is open (or when it
  // comes back to the foreground), re-render so taps land on the right day.
  // Never while a sheet is open or the user is typing — unsaved input survives.
  let _bootDay = todayStr();
  const _rollover = ()=>{
    if (todayStr() === _bootDay) return;
    if (App._closeDate) return;                              // close-out in progress
    if ($('ovl').classList.contains('open')) return;         // any sheet open — defer
    const ae = document.activeElement;
    if (ae && (ae.tagName === 'TEXTAREA' || ae.tagName === 'INPUT')) return;
    _bootDay = todayStr();
    renderAll();
  };
  setInterval(_rollover, 30000);
  document.addEventListener('visibilitychange', ()=>{ if (!document.hidden){ _rollover(); App.checkMorningChest(); } });
  // the chest greets the first open of a new day
  setTimeout(()=>App.checkMorningChest(), 900);
  // install handoff: standalone app with a blank slate → offer the restore path
  const standalone = (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
  if (standalone && CAN_STORE && !S.ui.handoff && !Object.keys(S.days).length && !Object.keys(S.runway.checks).length){
    S.ui.handoff = 1; save();
    setTimeout(()=>{ if (!$('ovl').classList.contains('open')) App.openDataSafety(); }, 1600);
  }
})();
</script>

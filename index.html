function renderToday(){
  const t = todayStr();
  const day = getDay(t);
  const dn = dayNumOf(t);
  const req = requiredRules(dn);
  const met = req.reduce((a,r)=>a+(ruleMet(day,r)?1:0),0);
  const q = quoteFor(dn);
  // "THE FORGE" was telling him where he already knew he was, every single day.
  // The phase word only earns its place when it ISN'T the default 75 — the
  // runway before, and The Standard after. Inside the run, the chapter says more.
  const phase = dn < 1 ? 'RUNWAY' : (dn <= FORGE_DAYS ? '' : 'THE STANDARD');
  const dayLabel = dn < 1 ? 'Day 0' : 'Day ' + dn;
  const denom = dn <= FORGE_DAYS ? '/ 75' : '· beyond';

  const votes = votesCast();
  const xp = xpTotal();
  App._xpShown = xp;   // the ceremony bar animates from the last value the hero showed
  const lv = currentLevel();
  const cq = corpus().length ? corpus()[hashStr(t+'daily') % corpus().length] : null;
  /* week strip — Mon→Sun of the current week, each day a tappable circle */
  const dowT = parseDate(t).getDay();
  const monday = addDays(t, dowT === 0 ? -6 : 1 - dowT);
  let strip = '<div class="wkstrip">';
  for (let i = 0; i < 7; i++){
    const ds = addDays(monday, i);
    const dnum = dayNumOf(ds);
    const future = parseDate(ds) > parseDate(t);
    const st = future ? 'future' : dayStatus(ds);
    const rec = S.days[ds];
    let cls = 'future', glyph = parseDate(ds).getDate();
    if (ds === t) cls = 'today';
    else if (dnum < 1) { /* before Day 1: outside the run — neutral, never a red ✕ */ }
    else if (st === 'won') { cls = isImmaculate(ds, rec) ? 'imm' : 'won'; glyph = '✓'; }
    else if (isLostStatus(st)) { cls = 'lost'; glyph = '✕'; }
    else if (st === 'paused') { cls = 'paused'; glyph = '‖'; }
    strip += `<div class="wk-d ${cls}" onclick="App.peekDay('${ds}', ${dnum})">
      <span>${['M','T','W','T','F','S','S'][i]}</span><span class="wk-c">${glyph}</span></div>`;
  }
  strip += '</div>';
  const fs = flameState();
  const isPausedToday = dayStatus(t) === 'paused';
  // the ring is the level light: it flares all around when a rank is crossed
  const lvlUp = App._lvShown != null && lv.L > App._lvShown;
  App._lvShown = lv.L;
  if (lvlUp){ sfx('rank'); buzz([15,80,15]); }
  document.body.classList.toggle('ignited', !day.closed && !isPausedToday && met === req.length);
  document.body.classList.toggle('guttering', !day.closed && !isPausedToday && met < req.length && new Date().getHours() >= 20);
  let html = strip + `
  <div class="hero">
    <div class="grow">
      <div class="phase">${[phase, chapterFor(dn), S.attempts.length ? 'ATTEMPT ' + (S.attempts.length+1) : ''].filter(Boolean).join(' · ')}</div>
      <div class="big">${dayLabel} <span style="font-size:16px;color:var(--ink-3);font-weight:800">${denom}</span></div>
      <div class="date">${niceDate(t)}${votes>0?` · <b style="color:var(--ember-text)">${votes.toLocaleString()} votes</b>`:''}</div>
      <div class="rank-line"><span class="rk">⚒ ${lv.name}</span><span class="xv">${xp} XP · ${lv.need-lv.into} to ${levelFor(lv.next).name}</span></div>
      <div class="xpbar"><i style="width:${(lv.into/lv.need*100).toFixed(1)}%"></i></div>
      <div class="flame-line">${flameSVG(fs[0])}<span class="fl-t">${fs[1]}</span></div>
      ${(()=>{
        /* the overdrive chip: absent at zero (never a nag), an invitation while
           a chain is alive, hot while today is already beyond a goal */
        if (dn < 1) return '';
        const od = overdriveData().map;
        // a sealed day that didn't overdrive ends the chain — the designed
        // state is quiet absence, never "alive" on a day that already closed
        if (day.closed && !od[t]) return '';
        let y = addDays(t,-1); while (S.pauses[y]) y = addDays(y,-1);
        const chain = od[t] || od[y] || 0;
        const beyondNow = !day.closed && !isPausedToday && overdriveMarks(t, day).length > 0;
        if (!chain && !beyondNow) return '';
        /* passive display only — states what IS, never asks for more (that's
           the design: stretch effort stays volunteered, not solicited) */
        const label = beyondNow
          ? '⚡ OVERDRIVE LIVE · ×' + ((od[y]||0)+1) + ' TONIGHT'
          : (od[t] ? '⚡ OVERDRIVE ×' + od[t] + ' — SEALED' : '⚡ RUN ×' + chain + ' ALIVE');
        return `<div class="ov-chip${(beyondNow || chain>=3)?' hot':''}" onclick="App.openOverdrive()">${label}</div>`;
      })()}
      <div class="quote">“${cq?esc(cq.q):q[0]}” <span style="opacity:.7">— ${cq?esc(cq.a):q[1]}</span></div>
    </div>
    ${ringSVG(met/req.length, 104, met+'/'+req.length, (day.closed || met >= req.length) ? 'sealed' : (req.length-met)+' to go').replace('ring-wrap', 'ring-wrap' + (lvlUp ? ' lvlup' : '') + ((overdriveStreak() >= 3 && !(day.closed && !overdriveData().map[t])) ? ' overdrive' : ''))}
  </div>`;

  /* your own words, replayed — the investment loop's payoff */
  const pastNotes = Object.keys(S.days).filter(d=>d!==t && S.days[d].closed && S.days[d].note && S.days[d].note.trim()).sort();
  if (pastNotes.length){
    const pd = pastNotes[hashStr(t+'note') % pastNotes.length];
    html += `<div class="card tight small" style="border-left:3px solid var(--ember-text)"><b style="color:var(--ember-text)">DAY ${dayNumOf(pd)} YOU:</b> “${esc(S.days[pd].note.trim())}”</div>`;
  }

  /* night-owl guard: it's after midnight but the night isn't over. Yesterday
     has real reps on it and was never sealed — offer the seal it earned
     instead of letting the clock quietly turn it into a lost day. While that
     offer stands the day is NOT lost, so the loss/restart banners must stay
     quiet: the app never calls a day lost and sealable in the same breath. */
  const nightOwl = (()=>{
    const nowH = new Date().getHours() + new Date().getMinutes()/60;
    if (nowH >= 4.5) return null;
    const yd = addDays(t, -1);
    const yr = S.days[yd];
    const ydn = dayNumOf(yd);
    if (!yr || yr.closed || S.pauses[yd] || ydn < 1) return null;
    // count and gate on the SAME rule set, so Standard mode can't print "0 logged"
    const req = requiredRules(ydn);
    const ymet = req.reduce((a,r)=>a+(ruleMet(yr,r)?1:0),0);
    return ymet > 0 ? { yd, ydn, ymet } : null;
  })();

  html += coachBanner(dn, day, !!nightOwl);

  if (nightOwl){
    html += `<div class="banner ember"><span class="b-ic">🌙</span><div><b>Still last night?</b> Day ${nightOwl.ydn} has ${nightOwl.ymet} logged and was never sealed.
    <div class="mt8"><button class="btn sm" onclick="App.sealYesterday()">🔒 Seal Day ${nightOwl.ydn} (yesterday)</button></div></div></div>`;
  }

  /* the replanned day (AI planner): times moved, requirements didn't */
  if (S.ui.aiday && S.ui.aiday.d === t && !day.closed){
    const ad = S.ui.aiday;
    const nowM2 = new Date().getHours()*60 + new Date().getMinutes();
    html += `<div class="card tight">
      <div class="row"><div class="small grow"><b>⚡ TODAY, REPLANNED</b> · ${esc(ad.summary)}</div>
      <button class="del" style="color:var(--ink-3);padding:2px 6px" onclick="App.aiRevert()" aria-label="Revert to normal template">✕</button></div>
      <div class="sched" style="margin-top:8px">${ad.blocks.map(b=>{
        const m = +b.start.slice(0,-3)*60 + +b.start.slice(-2), m2 = +b.end.slice(0,-3)*60 + +b.end.slice(-2);
        return `<div class="slot ${nowM2>=m&&nowM2<m2?'now':''}"><div class="t">${esc(b.start)}–${esc(b.end)}</div><div class="b">${esc(b.title)}</div></div>`;
      }).join('')}</div>
    </div>`;
  }

  /* the day, blocked — lives right under the hero: even folded, the badge is a
     live "what am I doing right now" ticker (and the replan door sits inside) */
  const now = new Date();
  const mins = now.getHours()*60 + now.getMinutes();
  const blocks = daySchedule();
  let schedInner = '';
  let nowLabel = '', nowIdx = -1;
  blocks.forEach((b,i)=>{ if (mins >= b.s && mins < b.e) nowIdx = i; });
  if (nowIdx >= 0){
    const cur = blocks[nowIdx];
    const through = Math.min(100, Math.max(0, ((mins - cur.s) / Math.max(1, cur.e - cur.s)) * 100));
    const leftMin = Math.max(0, cur.e - mins);
    const nxt = blocks[nowIdx + 1];
    nowLabel = cur.x.split(/[·.]/)[0].trim();
    // the live block, in full — never a truncated chip
    schedInner += `<div class="nowcard">
      <div class="nc-l">RIGHT NOW · ${esc(cur.label)}</div>
      <div class="nc-t">${esc(cur.x)}</div>
      <div class="nc-w">${leftMin >= 60 ? Math.floor(leftMin/60) + 'h ' + (leftMin%60) + 'm' : leftMin + ' min'} left</div>
      <div class="nc-bar"><i style="width:${through.toFixed(0)}%"></i></div>
      ${nxt ? `<div class="nc-next">Next — <b>${esc(nxt.label)}</b> · ${esc(nxt.x)}</div>` : `<div class="nc-next">Last block. Land it.</div>`}
    </div>`;
  }
  schedInner += `<div class="sched" style="margin:0 -3px">`;
  blocks.forEach((b,i)=>{
    const isNow = i === nowIdx;
    const done = mins >= b.e;
    schedInner += `<div class="slot ${isNow?'now':''}" style="${done && !isNow ? 'opacity:.45' : ''}"><div class="t">${esc(b.label)}</div><div class="b">${esc(b.x)}</div></div>`;
  });
  schedInner += `</div>
    <div class="two-col mt12">
      <button class="btn ghost sm" onclick="App.openSchedEdit()">🗂 Edit blocks</button>
      <button class="btn ghost sm" onclick="App.openSettings('planner')">⚡ Something came up</button>
    </div>`;
  // the collapsed badge stays a short cue; the full text lives in the card above
  html += fold('sched', 'The Day', nowLabel ? '▸ ' + nowLabel : '', schedInner, nowIdx >= 0 && !day.closed);

  /* focus quest — targets his own leakiest rule, pays only if cleared */
  const fq = dn >= 1 ? focusRuleFor(t) : null;
  if (fq && !day.closed){
    const fr = RULES.find(r=>r.id===fq);
    const cleared = ruleMet(day, fr);
    html += cleared
      ? `<div class="quest-banner"><span>✅</span><div><b>Focus quest cleared — ${fr.title}.</b> +2 XP.</div></div>`
      : `<div class="quest-banner"><span>🎯</span><div><b>FOCUS QUEST · ${fr.title}.</b> Your leakiest rule this week. Clear it: +2 XP.</div></div>`;
  }

  /* ----- Runway Command Center (Day 0 / before Day 1) ----- */
  /* It disappears on its own at Day 1 — the permanent record moves to Progress.
     Before then, a fully-checked list shouldn't be DELETED (nothing earned is
     ever taken away) and shouldn't keep sprawling twelve green rows either. So
     it seals into one line, still tappable to review. */
  if (dn < 1){
    const done = RUNWAY_TASKS.filter(x=>S.runway.checks[x[0]]).length;
    const pct = done / RUNWAY_TASKS.length;
    const cleared = done === RUNWAY_TASKS.length;
    html += `<h2 class="sec">Runway Command Center <span class="ln"></span>CH. 20</h2>`;
  if (cleared && !S.ui.rwOpen){
    html += `
    <div class="card" style="cursor:pointer;border-color:rgba(12,163,12,0.3)" onclick="App.rwToggle()">
      <div class="row"><div class="grow">
        <div class="small"><b>Runway cleared — ${done}/${done} executed ✓</b></div>
        <div class="muted mt8">${dn===0?'Day 1 is tomorrow.':'Day 1 is coming.'} House stripped, machine stocked, baselines on the record.</div>
        <div class="muted mt8">MDS-16 ${S.runway.mds16?esc(S.runway.mds16):'—'} · speech ${S.runway.wpm?esc(S.runway.wpm)+' wpm':'—'} · tap to review the list</div>
      </div><div style="font-size:26px">🛫</div></div>
    </div>`;
  } else {
    html += `
    <div class="card">
      <div class="rw-head"><div class="small"><b>${cleared?'Runway cleared ✓':(dn===0?'Day 1 is tomorrow.':'Day 1 is coming.')}</b> ${cleared?'Every item executed.':'Executed, not studied. Top to bottom.'}</div>
      <div class="rw-pct">${done}/${RUNWAY_TASKS.length}</div></div>
      <div class="rw-bar"><i style="width:${(pct*100).toFixed(0)}%"></i></div>
      ${['Demolition','Supply'].map(grp=>`
        <div class="gcat">${grp}${grp==='Demolition'?' — tear it down':' — stock the machine'}</div>
        ${RUNWAY_TASKS.filter(x=>x[1]===grp).map(x=>`
          <div class="rw-item ${S.runway.checks[x[0]]?'on':''}" onclick="App.toggleRunway('${x[0]}')">
            <div class="gbox" style="border:2px solid var(--baseline);border-radius:7px;width:22px;height:22px;flex:none;display:grid;place-items:center;color:transparent;${S.runway.checks[x[0]]?'background:var(--good);border-color:var(--good);color:#0a2b0a':''}">${ICONS.check}</div>
            <div class="grow"><div class="rw-t">${x[2]}</div><div class="rw-d">${x[3]}</div></div>
          </div>`).join('')}`).join('')}
      <div class="two-col mt12">
        <div><div class="muted" style="margin-bottom:4px">MDS-16 baseline score</div>
        <input inputmode="numeric" id="rwMds" placeholder="0–64" value="${esc(S.runway.mds16||'')}" onchange="App.saveRunwayBase()"></div>
        <div><div class="muted" style="margin-bottom:4px">Speech baseline (WPM)</div>
        <input inputmode="numeric" id="rwWpm" placeholder="e.g. 178" value="${esc(S.runway.wpm||'')}" onchange="App.saveRunwayBase()"></div>
      </div>
      <div class="muted mt8">The before-photo for your mind and your mouth. Retake both around Day 60.</div>
      ${cleared?`<button class="btn ghost sm mt12" onclick="App.rwToggle()">Fold it away ✓</button>`:''}
    </div>`;
  }
  }

  if (day.closed){
    html += day.status==='won'
      ? `<div class="banner green"><span class="b-ic">✅</span><div><b>Day ${dn} — WON.</b> Another vote cast. <button class="btn sm ghost" style="margin-top:8px" onclick="App.reopenDay('${t}')">Reopen</button></div></div>`
      : `<div class="banner red"><span class="b-ic">📕</span><div><b>Day logged — not won.</b> Cause, one environment fix, tomorrow is mandatory. <button class="btn sm ghost" style="margin-top:8px" onclick="App.reopenDay('${t}')">Reopen</button></div></div>`;
  }

  html += `<h2 class="sec">The Non-Negotiables <span class="ln"></span><span style="color:var(--ember-text)">${met}/${req.length}</span></h2>
  ${!day.closed && met===0 ? `<div class="muted mb8" style="margin:-4px 2px 8px">Hold a card to seal it. Tap a number to type it.</div>` : ''}`;

  const dow = parseDate(t).getDay();
  const wknd = dow === 0 || dow === 6;
  const rung = currentRung();
  for (const r of RULES){
    const required = req.includes(r);
    const done = ruleMet(day, r);
    const dis = day.closed || isPausedToday;   // a held position takes no seals
    if (r.id === 'line'){
      // three-state keystone: unanswered / held / crossed. Crossing is only ever
      // declared in the close-out sheet — the card can affirm, never confess.
      const st = day.r.line;
      html += `
      <div class="rule tappable keystone ${st===true?'done':''} ${st===false?'crossed':''}${App._sealNow==='line'?' sealed-now':''}" ${dis?'':`data-hold="line"`}>
        <div class="r-ic">${ICONS[r.icon]}</div>
        <div class="grow">
          <div class="r-title">${r.title}</div>
          <div class="r-sub">${r.sub}</div>
          ${st===null?`<div class="r-hint mt8" style="margin-top:5px">Hold to seal when held — the close-out asks either way</div>`:''}
          ${st===false?`<div class="r-hint mt8" style="margin-top:5px;color:var(--critical)">Crossed — the restart rule applies</div>`:''}
        </div>
        <div class="r-check">${st===false?'✕':ICONS.check}</div>
      </div>`;
    } else if (r.type === 'bool'){
      const isSocial = r.id === 'social';
      const isPhoto = r.id === 'photo';
      const isSpeech = r.id === 'speech';
      html += `
      <div class="rule tappable ${done?'done':''} ${r.keystone?'keystone':''}${App._sealNow===r.id?' sealed-now':''}" ${dis?'':`data-hold="${r.id}"`}>
        <div class="r-ic">${ICONS[r.icon]}</div>
        <div class="grow">
          <div class="r-title">${r.title}${required?'':' <span style="font-size:10px;color:var(--ink-3);font-weight:700">(3×/WK NOW)</span>'}</div>
          <div class="r-sub">${r.sub}</div>
          ${isSocial?`<div class="ladder-line"><b>WK ${Math.min(rung,LADDER.length)} — ${LADDER[rung-1][0].toUpperCase()}:</b> ${LADDER[rung-1][1]} <button class="chip" style="margin-top:7px;display:block" onclick="event.stopPropagation();App.repeatRung()">Repeat this rung another week</button></div>
          ${done?`<div class="anx-row" onclick="event.stopPropagation()"><span class="anx-l">ANXIETY AT THE REP</span>${Array.from({length:10},(_,i)=>`<button class="anx ${day.socialAnx===i+1?'on':''}" onclick="App.setAnx(${i+1})">${i+1}</button>`).join('')}</div>`:''}`:''}
        </div>
        ${isPhoto&&!dis?`<button class="icon-btn" style="width:34px;height:34px" onclick="event.stopPropagation();App.snapPhoto()" aria-label="Take progress photo">📷</button>`:''}
        ${isSpeech&&!dis?`<button class="icon-btn" style="width:34px;height:34px" onclick="event.stopPropagation();App.openSpeech()" aria-label="Open speech drill">🎙</button>`:''}
        <div class="r-check">${ICONS.check}</div>
      </div>`;
    } else {
      const v = day.r[r.id] || 0;
      const pct = Math.min(1, v / r.goal);
      const altOn = r.alt && day.r.dialsAlt;
      const altLabel = r.alt ? (wknd
        ? (dow===6 ? 'Weekend block — Sat: JJ 9am + groceries + the big social rep counts' : 'Weekend block — Sun: church + batch cook + plan the week counts')
        : 'Between offers today — 3 applications / 2 hrs skill work counts') : '';
      html += `
      <div class="rule cnt ${done?'done':''}${App._sealNow===r.id?' sealed-now':''}">
        <div class="r-top">
          <div class="r-ic">${ICONS[r.icon]}</div>
          <div class="grow">
            <div class="r-title">${r.title}${r.alt&&wknd?' <span style="font-size:10px;color:var(--ink-3);font-weight:700">(MON–FRI RULE)</span>':''}</div>
            <div class="r-sub">${r.sub}</div>
          </div>
          <div class="r-check">${ICONS.check}</div>
        </div>
        <div class="r-bottom">
          <div class="grow">
            <div class="mini-meter ${pct>=1?'full':''}" style="margin-top:0"><i style="width:${(pct*100).toFixed(0)}%"></i></div>
          </div>
          <div class="ctr">
            <button ${dis?'disabled':''} data-bump="${r.id}:${-r.steps[0]}">−</button>
            <div class="val"${dis?'':` onclick="App.setCount('${r.id}')" style="cursor:pointer"`}><span${dis?'':' style="text-decoration:underline dotted rgba(255,176,32,.55);text-underline-offset:3px"'}>${v}</span><small>/ ${r.goal} ${r.unit}</small></div>
            <button ${dis?'disabled':''} data-bump="${r.id}:${r.steps[1]}">+${r.steps[1]>1? r.steps[1]:''}</button>
          </div>
        </div>
        ${r.alt?`<div class="alt-chip"><button class="chip ${altOn?'on':''}" ${dis?'':`onclick="App.toggleAlt()"`}>${altOn?'✓ ':''}${altLabel}</button></div>`:''}
      </div>`;
    }
  }
  html += `<input type="file" accept="image/*" capture="environment" id="photoInput" style="display:none" onchange="App.photoPicked(this)">`;

  /* supplements — folded: one glance, one tap */
  const suppsOn = SUPPS.filter(s=>day.supps[s[0]]).length;
  let suppInner = `<div class="chip-row">`;
  for (const s of SUPPS){
    const on = !!day.supps[s[0]];
    suppInner += `<button class="chip ${on?'on':''}" onclick="App.toggleSupp('${s[0]}')">${on?'✓ ':''}${s[1]}</button>`;
  }
  suppInner += `</div><div class="muted mt8">Mag at night · caffeine dies at noon.</div>`;
  html += fold('stack', 'The Stack', suppsOn + '/' + SUPPS.length, suppInner, false);

  /* morning weight — folded */
  const w = day.weight;
  html += fold('weight', 'Morning Weight', w!=null ? w.toFixed(1)+' lbs' : '—', `
  <div class="row">
    <div class="ctr">
      <button data-bump="weight:-0.5">−</button>
      <div class="val" style="min-width:84px;cursor:pointer" onclick="App.setWeight()">${w!=null? w.toFixed(1) : '—'}<small>lbs · tap to type</small></div>
      <button data-bump="weight:0.5">+</button>
    </div>
    <div class="grow muted">Same scale, same time.</div>
  </div>`, false);

  /* today's plan — decided last night, checked off as it happens */
  if (day.plan.some(p=>p.x) && !day.closed){
    html += `<div class="card tight">
      ${day.plan.map((p,i)=> p.x ? `<div class="plan-row ${p.d?'done':''}"><span class="pn" onclick="App.togglePlan('${t}',${i})">✓</span><div class="grow"><span class="px">${esc(p.x)}</span>${p.w?` <span class="pw">— ${esc(p.w)}</span>`:''}</div></div>` : '').join('')}
    </div>`;
  }

  /* congruence check + tomorrow's plan — folded, open in the evening */
  const evening = now.getHours() >= 19;
  const tmRec = S.days[addDays(t,1)];   // read-only: rendering must never mint day records
  const tmPlanCount = tmRec && Array.isArray(tmRec.plan) ? tmRec.plan.filter(p=>p.x).length : 0;
  html += fold('check', 'Congruence Check', (day.note&&day.note.trim()?'✓ noted':'') + (tmPlanCount?` · ${tmPlanCount} planned`:''), `
    <div class="small mb8">Did the talker and the doer match today?</div>
    <textarea id="dayNote" rows="2" placeholder="Tonight's evidence…" oninput="App.saveNote()">${esc(day.note)}</textarea>
    <button class="btn ghost sm mt12" onclick="App.openPlanner()">🗓 ${tmPlanCount?'Edit tomorrow’s plan ('+tmPlanCount+')':'Plan tomorrow'}</button>`, evening);

  /* close out + SOS */
  const tease = (!day.closed && dn >= 1 && corpus().length)
    ? `<div class="drop-tease"><span class="drop-dot ${dropTierFor(t)}"></span>Tonight's drop: ${TIERS[dropTierFor(t)].label} card — win the day to claim</div>` : '';
  if (isPausedToday){
    html += `<div class="banner" style="background:rgba(90,130,180,0.14);border-color:rgba(120,160,210,0.4);color:#c4d8ee"><span class="b-ic">⏸</span><div><b>Paused.</b> ${esc(S.pauses[t]||'Recover honestly.')} Blue in the grid, not red. Heal, then go again.</div></div>`;
  }
  html += `
  <div class="mt16">
    ${isPausedToday ? '' : tease}
    <div class="row" style="gap:8px">
      ${day.closed || isPausedToday ? '' : `<button class="btn" style="flex:1.7" onclick="App.closeDay()">🔒 Seal Day ${dn>0?dn:''}</button>`}
      <button class="btn ghost" style="flex:1" onclick="App.openSOS()">🌊 Hold the line</button>
    </div>
  </div>

/* hold-to-seal: a rule is committed with a ~550ms press — the ring draws while
   you hold, early release cancels. Motor commitment kills misclicks and makes
   every rule a micro-ceremony. */
let _hold = null;
const HOLD_C = 106.8;   // circumference of the r=17 progress ring
function holdStart(el, e){
  if (e.target.closest('button, input, textarea, .anx-row, .alt-chip')) return;
  const id = el.dataset.hold;
  if (!id) return;
  holdCancel();
  const check = el.querySelector('.r-check');
  // sealing draws ember; UN-sealing (card already done/crossed) draws bone-white,
  // and the check itself keeps its current look until the hold completes
  const unseal = el.classList.contains('done') || el.classList.contains('crossed');
  let hr = null;
  if (check){
    const old = check.querySelector('.hold-ring');
    if (old) old.remove();
    check.insertAdjacentHTML('beforeend',
      `<svg class="hold-ring" viewBox="0 0 38 38"><circle class="hr" cx="19" cy="19" r="17" fill="none" stroke="${unseal ? 'rgba(255,246,238,0.9)' : 'var(--ember-text)'}" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="${HOLD_C}" stroke-dashoffset="${HOLD_C}" transform="rotate(-90 19 19)"/></svg>`);
    hr = check.querySelector('.hold-ring .hr');
  }
  const t0 = performance.now();
  _hold = { el, id, raf: 0, done: false };
  el.classList.add('holding');
  const tickFrame = (t)=>{
    if (!_hold || _hold.el !== el) return;
    const p = Math.min(1, (t - t0) / 550);
    if (hr) hr.style.strokeDashoffset = (HOLD_C * (1 - p)).toFixed(1);
    if (p >= 1){
      _hold.done = true;
      el.classList.remove('holding');
      _hold = null;
      if (id === 'line') App.toggleLine(); else App.toggleRule(id);
      return;
    }
    _hold.raf = requestAnimationFrame(tickFrame);
  };
  _hold.raf = requestAnimationFrame(tickFrame);
}
function holdCancel(){
  if (!_hold) return;
  cancelAnimationFrame(_hold.raf);
  const el = _hold.el;
  _hold = null;
  el.classList.remove('holding');
  // let go early: the ring retreats smoothly, then leaves without a blink
  const ring = el.querySelector('.hold-ring');
  if (ring){
    const hr = ring.querySelector('.hr');
    if (hr){ hr.style.transition = 'stroke-dashoffset .22s var(--ease-out)'; hr.style.strokeDashoffset = HOLD_C; }
    setTimeout(()=>{ if (ring.parentNode) ring.remove(); }, 260);
  }
}

  const after = d.r[id] >= rule.goal;
  if (crossedOverdrive(id, v0, d.r[id])) haptic.over();   // past the line gets its own sound
  else if (!before && after){
    // the completion moment fires the same seal as a held rule
    haptic.seal();
    App._sealNow = id;
    markFirstSeal(d);
    const req = requiredRules(dayNumOf(todayStr()));
    if (req.every(r=>ruleMet(d, r))) haptic.success();
  } else haptic.step();

function dayXP(t){
  const d = S.days[t];
  if (!d) return { total:0, lines:[] };
  const lines = [];
  const rules = RULES.reduce((a,r)=>a+(ruleMet(d,r)?1:0),0);
  const rulesXP = RULES.reduce((a,r)=>a+(ruleMet(d,r)?ruleXP(r):0),0);
  if (rules) lines.push(['Non-negotiables kept ×' + rules, rulesXP]);
  if (d.closed && d.status === 'won'){
    lines.push(['Every rule — day won', 3]);
    const yr = S.days[addDays(t, -1)];
    if (yr && yr.closed && yr.status === 'lost') lines.push(['COMEBACK — never missed twice', 3]);
  }
  if (d.waves) lines.push(['Waves outlasted ×' + d.waves, d.waves * 2]);
  if (d.early) lines.push(['🌅 Early ignition — first rule before 09:00', 1]);
  // personal record: most dials in a single day — judged against days BEFORE t
  // only (chronological, matching _xpCalc), so a past report can never shrink
  const dialsToday = d.r.dials || 0;
  if (dialsToday > 0){
    let best = 0;
    for (const k in S.days) if (k < t) best = Math.max(best, S.days[k].r.dials || 0);
    if (dialsToday > best && best > 0) lines.push(['PR — most dials in a day (' + dialsToday + ')', 1]);
  }
  const f = focusRuleFor(t);
  if (f && ruleMet(d, RULES.find(r=>r.id===f))) lines.push(['Focus quest cleared', 2]);
  const mt = S.money.meetings[t] || 0;
  if (mt) lines.push(['Meetings booked ×' + mt, Math.min(2, mt) * 3]);
  const mk = Math.min(3, S.money.mocks[t] || 0);
  if (mk) lines.push(['Mock calls (deliberate practice)', mk]);
  if (S.affirm[t] && S.affirm[t] !== 'skip') lines.push(['Values affirmation', 2]);
  const rec = S.recoveries[t];
  if (rec && rec.cause && rec.cause.trim() && rec.fix && rec.fix.trim() && isLostStatus(dayStatus(t))) lines.push(['Recovery protocol run', 2]);
  if (d.closed && d.status === 'won'){
    const ov = overdriveMarks(t, d);
    if (ov.length){
      lines.push(['⚡ OVERDRIVE — ' + ov.map(m=>m.label.toLowerCase()).join(' · '), 2]);

/* ============================================================
   FORTNIGHT REPORTS — every 14 days the record becomes a story
   ============================================================ */
function periodRange(n){
  const a = 14 * (n - 1) + 1;
  const b = Math.min(14 * n, FORGE_DAYS);
  return { a, b, da: dateOfDayNum(a), db: dateOfDayNum(b) };
}
function periodCount(){ return Math.ceil(FORGE_DAYS / 14); }   // 6 (last = days 71-75)
function reportReady(){
  // newest fully-elapsed fortnight, if any
  const dn = dayNumOf(todayStr());
  for (let n = periodCount(); n >= 1; n--){
    if (dn > periodRange(n).b) return n;
  }
  return 0;
}
function periodStats(n){
  const { a, b, da, db } = periodRange(n);
  const t = todayStr();
  const s = { n, a, b, da, db, days: b - a + 1, won: 0, lost: 0, votes: 0, xp: 0,
    dials: 0, convos: 0, mocks: 0, meetings: 0, waves: 0, comebacks: 0,
    ddMin: 0, income: 0, saved: 0, anxFirst: [], anxLast: [], comp: {} };
  for (const r of RULES) s.comp[r.id] = { met: 0, tot: 0 };
  const half = (b - a + 1) / 2;   // midpoint split works for the 5-day final period too
  for (let d = a; d <= b; d++){
    const ds = dateOfDayNum(d);
    if (parseDate(ds) > parseDate(t)) continue;
    const rec = S.days[ds];
    const st = dayStatus(ds);
    if (st === 'won') s.won++;
    else if (isLostStatus(st)) s.lost++;
    if (rec){
      s.xp += dayXP(ds).total;
      for (const r of requiredRules(d)){
        s.comp[r.id].tot++;
        if (ruleMet(rec, r)) s.comp[r.id].met++;
        if (ruleMet(rec, r)) s.votes++;
      }
      s.dials += rec.r.dials || 0;
      s.waves += rec.waves || 0;
      if (rec.socialAnx != null) (d - a < half ? s.anxFirst : s.anxLast).push(rec.socialAnx);
      const yr = S.days[addDays(ds, -1)];
      if (rec.closed && rec.status === 'won' && yr && yr.closed && yr.status === 'lost') s.comebacks++;
    } else {
      // no day record (imported/edge state): money-keyed XP still counts,
      // matching _xpCalc so the report and the total never disagree
      s.xp += 3 * (S.money.meetings[ds] || 0) + Math.min(3, S.money.mocks[ds] || 0);
      if (S.affirm[ds] && S.affirm[ds] !== 'skip') s.xp += 2;
    }
    s.convos += S.money.convos[ds] || 0;
    s.mocks += S.money.mocks[ds] || 0;
    s.meetings += S.money.meetings[ds] || 0;
    s.ddMin += S.dd.filter(x => x.date === ds).reduce((x, y) => x + y.min, 0);
  }
  for (const wk of [2 * n - 1, 2 * n]){
    // only weeks whose day-span actually intersects this fortnight
    const wkA = 7 * (wk - 1) + 1, wkB = 7 * wk;
    if (wkB < a || wkA > b) continue;
    const r = S.reviews[revKey(wk)];
    if (r && Array.isArray(r.a) && r.a.filter(x => x && x.trim().length > 2).length >= 4) s.xp += 5;
  }
  for (const tx of S.money.txns){
    if (parseDate(tx.date) >= parseDate(da) && parseDate(tx.date) <= parseDate(db)){
      if (tx.type === 'income') s.income += tx.amount;
      else if (tx.cat === 'invest') s.saved += tx.amount;
    }
  }
  // weight: last reading in period vs last reading before it (or period first)
  const wAll = S.body.entries.filter(e => e.weight != null);
  const wIn = wAll.filter(e => parseDate(e.date) >= parseDate(da) && parseDate(e.date) <= parseDate(db));
  const wBefore = wAll.filter(e => parseDate(e.date) < parseDate(da));
  s.wStart = wBefore.length ? wBefore[wBefore.length - 1].weight : (wIn.length ? wIn[0].weight : null);
  s.wEnd = wIn.length ? wIn[wIn.length - 1].weight : null;
  s.wPts = wIn.map(e => ({ x: e.date, y: e.weight }));
  // measurements: latest full entry in period vs latest before
  const mAll = S.body.entries.filter(e => e.waist != null || e.shoulders != null || e.chest != null || e.arms != null);
  s.mNow = mAll.filter(e => parseDate(e.date) <= parseDate(db)).slice(-1)[0] || null;
  s.mPrev = s.mNow ? (mAll.filter(e => parseDate(e.date) < parseDate(s.mNow.date)).slice(-1)[0] || null) : null;
  const avg = (xs) => xs.length ? xs.reduce((x, y) => x + y, 0) / xs.length : null;
  s.anxA = avg(s.anxFirst); s.anxB = avg(s.anxLast);
  return s;
}
function trendArrow(cur, prev, goodUp){
  if (prev == null || cur == null || prev === cur) return '<span style="color:var(--ink-3)">—</span>';
  const up = cur > prev;
  const good = goodUp ? up : !up;
  return `<span style="color:${good ? 'var(--good)' : 'var(--ink-2)'}">${up ? '▲' : '▼'}</span>`;
}
/* kind-voice narrative lines, computed from the record — never shaming */
function coachLines(s, prev){
  const L = [];
  const compArr = RULES.filter(r => s.comp[r.id].tot > 0)
    .map(r => ({ r, pct: s.comp[r.id].met / s.comp[r.id].tot }));
  if (compArr.length){
    const best = compArr.slice().sort((x, y) => y.pct - x.pct)[0];
    if (best.pct >= 0.99) L.push(`🏛 <b>${best.r.title}</b> — perfect all fortnight. That rule is becoming who you are.`);
    else if (best.pct >= 0.8) L.push(`🏛 Strongest rule: <b>${best.r.title}</b> (${Math.round(best.pct * 100)}%).`);
    const worst = compArr.slice().sort((x, y) => x.pct - y.pct)[0];
    if (worst.pct < 0.7) L.push(`🎯 Biggest opening: <b>${worst.r.title}</b> (${Math.round(worst.pct * 100)}%). One environment fix beats two weeks of willpower.`);
  }
  if (prev && prev.dials > 0 && s.dials > prev.dials) L.push(`📈 Dials up <b>${Math.round((s.dials / prev.dials - 1) * 100)}%</b> on the last fortnight — the arithmetic is compounding.`);
  if (s.meetings > 0) L.push(`🎯 <b>${s.meetings} meeting${s.meetings > 1 ? 's' : ''} booked.</b> That's the number that becomes money.`);
  if (s.comebacks > 0) L.push(`🛡 <b>${s.comebacks} comeback${s.comebacks > 1 ? 's' : ''}</b> — every loss answered the next morning. Never missed twice.`);
  // the tape gets the verdict; the scale only gets a mention
  if (s.mNow && s.mPrev && s.mNow.waist && s.mNow.shoulders && s.mPrev.waist && s.mPrev.shoulders){
    const rN = s.mNow.shoulders / s.mNow.waist, rP = s.mPrev.shoulders / s.mPrev.waist;
    if (Math.abs(rN - rP) >= 0.005)
      L.push(`📐 Shoulder:waist <b>${rP.toFixed(3)} → ${rN.toFixed(3)}</b>${rN > rP ? ' — the V is widening. Golden is 1.618.' : ' — hold the waist and the ratio comes back.'}`);
  }
  if (s.wStart != null && s.wEnd != null && s.wEnd !== s.wStart){
    const d = s.wEnd - s.wStart;
    L.push(`⚖️ Scale: <b>${d > 0 ? '+' : ''}${d.toFixed(1)} lbs</b> this fortnight — context only. What it <i>means</i> is written on the tape.`);
  }
  if (s.anxA != null && s.anxB != null && s.anxB < s.anxA) L.push(`🪜 Social anxiety at the rep: <b>${s.anxA.toFixed(1)} → ${s.anxB.toFixed(1)}</b>. The number is falling. That's the rewiring.`);
  if (s.waves > 0) L.push(`🌊 <b>${s.waves} waves outlasted.</b> Every one was a vote cast in the same hour the urge wanted one.`);
  if (!L.length) L.push('The fortnight is logged. The next one is where the story picks up.');
  return L;
}

App.openReport = (n)=>{
  const s = periodStats(n);
  const prev = n > 1 ? periodStats(n - 1) : null;
  if (!S.reports[revKey(n)]){ S.reports[revKey(n)] = todayStr(); save(); }
  const winPct = (s.won + s.lost) ? Math.round(s.won / (s.won + s.lost) * 100) : null;

  <div class="statgrid mt12">

  <button class="btn mt8" onclick="App.closeSheet()">Back to the work</button>`);
  // async photo pair: first + last photo taken inside the fortnight
  photoDates().then(dates => {

    const before = dates.filter(d => parseDate(d) < parseDate(s.da));
    const p1 = inRange.length >= 2 ? inRange[0] : (before.length ? before[before.length - 1] : null);
    const p2 = inRange.length ? inRange[inRange.length - 1] : null;
    if (!p1 || !p2 || p1 === p2){

      if (!b1 || !b2 || !$('repPhotos')) return;
      const u1 = URL.createObjectURL(b1), u2 = URL.createObjectURL(b2);

function blobToDataURL(blob){
  return new Promise((res, rej)=>{
    const r = new FileReader();
    r.onload = ()=>res(r.result);
    r.onerror = ()=>rej(r.error);
    r.readAsDataURL(blob);
  });
}

function archiveDownload(blob, fname){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = fname;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 8000);
  toast('The complete record — saved. 📜');
}

/* ============================================================
   THE TROPHY CASE — every badge, earned and unearned, in one room.
   Locked ones print their exact requirement (pre-announced, always).
   Nothing here can ever be revoked; this is the evidence wall.
   ============================================================ */
App.openTrophies = ()=>{
  const t = todayStr();
  // badges are LIFETIME facts. A restart resets the day counter and a start-date
  // edit re-numbers the calendar — neither may un-earn a badge. So day-based
  // trophies read a monotonic measure: the furthest day reached, the number of
  // days actually sealed, and every archived attempt — whichever is largest.
  const dn = Math.max(
    dayNumOf(t),
    Object.keys(S.days).filter(k=>S.days[k].closed).length,
    ...(S.attempts.length ? S.attempts.map(a=>a.days||0) : [0])
  );
  const won = Object.keys(S.days).filter(k=>S.days[k].closed && S.days[k].status === 'won').length;
  const xp = xpTotal();
  const lv = currentLevel();
  const od = overdriveData();
  const imm = Object.keys(S.days).filter(d=>isImmaculate(d, S.days[d])).length;
  const stats = recoveryStats();
  const waves = wavesTotal();
  const early = Object.keys(S.days).filter(k=>S.days[k].early).length;
  const cards = vaultCount();
  const revs = Object.keys(S.reviews).filter(w=>S.reviews[w] && Array.isArray(S.reviews[w].a) && S.reviews[w].a.some(x=>x&&x.trim())).length;
  const comebacks = Object.keys(S.days).filter(k=>{
    const d = S.days[k], yr = S.days[addDays(k,-1)];
    return d.closed && d.status==='won' && yr && yr.closed && yr.status==='lost';
  }).length;
  const grad = S.gradSeen || dn > FORGE_DAYS;
  // derived from the record itself, so no date edit or restart can shrink it
  const bestEverStreak = ()=>{
    const keys = Object.keys(S.days).filter(k=>S.days[k].closed && S.days[k].status === 'won').sort();
    let best = 0, cur = 0, prev = null;
    for (const k of keys){
      let step = prev;
      if (step){ do { step = addDays(step, 1); } while (S.pauses[step]); }   // pauses are transparent
      cur = (step && k === step) ? cur + 1 : 1;
      if (cur > best) best = cur;
      prev = k;
    }
    return Math.max(best, bestStreak(), ...(S.attempts.length ? S.attempts.map(a=>a.bestStreak||0) : [0]));
  };

  // the tiles ARE the tally — no parallel array to drift out of sync with them
  let _tot = 0, _got = 0;
  const tile = (em, name, req, got, note)=>(_tot++, got && _got++, `
    <div class="badge ${got?'unlocked':''}" style="text-align:left;padding:12px 12px">
      <div class="row" style="gap:9px;align-items:flex-start">
        <div class="b-em" style="font-size:19px;line-height:1">${em}</div>
        <div class="grow">
          <div class="b-t" style="margin-top:0;font-size:12px;text-align:left">${name}</div>
          <div class="b-d" style="text-align:left;margin-top:3px;letter-spacing:0">${got ? (note || 'Earned') : req}</div>
        </div>
        ${got?'<div style="color:var(--ember-text);font-size:13px">✓</div>':''}
      </div>
    </div>`);
  const grid = (items)=>`<div class="badges" style="grid-template-columns:1fr;gap:8px">${items.join('')}</div>`;

  const milestones = MILESTONES.map(m=>{
    const got = dn >= m[0] || won >= m[0];
    return tile(m[1], m[2], 'Reach Day ' + m[0], got, 'Day ' + m[0] + ' · ' + m[3]);
  });
  const ranks = RANKS.map((r,i)=>{
    const need = xpThreshold(i);
    return tile(i>=16?'⚔️':(i>=10?'🗡':(i>=7?'🔨':'🔥')), r, need + ' XP', lv.L >= i, need + ' XP');
  });
  const overdrive = [
    tile('⚡','OVERDRIVE','Win a day and beat a printed line', od.count >= 1, od.count + ' overdrive day' + (od.count===1?'':'s')),
  ].concat(OV_TIERS.map(x=> tile(x[3], x[1], x[0] + ' overdrive days in a row', od.best >= x[0], 'Best chain ×' + od.best)));
  const records = [
    tile('✨','IMMACULATE','Every rule, no retro-marks, sealed before 22:00', imm >= 1, imm + ' immaculate day' + (imm===1?'':'s')),
    tile('🌅','EARLY IGNITION','Seal your first rule before 9:00am', early >= 1, early + ' morning' + (early===1?'':'s')),
    tile('🛡','NEVER MISSED TWICE','Answer every lost day the next morning', stats.losses === 0 || stats.missedTwice === 0, stats.losses === 0 ? 'No losses yet' : comebacks + ' comeback' + (comebacks===1?'':'s')),
    tile('🌊','WAVE BREAKER','Outlast one urge with the 20-minute timer', waves >= 1, waves + ' wave' + (waves===1?'':'s') + ' outlasted'),
    tile('🗡','THE HONEST THIRTY','Complete a weekly review', revs >= 1, revs + ' review' + (revs===1?'':'s')),
    tile('🎴','THE VAULT','Claim a quote card by winning a day', cards >= 1, cards + ' / ' + corpus().length + ' cards'),
    tile('🔥','BEST STREAK','Win days back to back', bestEverStreak() >= 1, bestEverStreak() + ' day' + (bestEverStreak()===1?'':'s') + ' in a row'),
    tile('👑','FORGED','Finish all 75 days', grad, 'The Forge is complete'),
  ];
  const chapters = CHAPTERS.map((c,i)=> tile(['🌱','🧭','🚂','🪞','🏛'][i]||'📖', 'CH. ' + (i+1) + ' — ' + c[1], 'Reach Day ' + c[0], dn >= c[0], 'Day ' + c[0] + ' onward'));

  openPage('trophies', 'THE TROPHY CASE', _got + ' of ' + _tot + ' earned', `
    <div class="card center">
      <div class="hero-num" style="color:var(--ember-text)">${_got}<span style="font-size:22px;color:var(--ink-3)"> / ${_tot}</span></div>
      <div class="muted mt8">Everything below is either yours already or has its exact price printed on it. Nothing here is ever taken back — not by a lost day, not by a restart.</div>
    </div>
    <h2 class="sec">Milestones <span class="ln"></span>THE 75</h2>${grid(milestones)}
    <h2 class="sec">The Record <span class="ln"></span>WHAT YOU DID</h2>${grid(records)}
    <h2 class="sec">Overdrive <span class="ln"></span>BEYOND THE LINE</h2>${grid(overdrive)}
    <h2 class="sec">Chapters <span class="ln"></span>THE ARC</h2>${grid(chapters)}
    <h2 class="sec">The Ladder <span class="ln"></span>${lv.name.toUpperCase()} · ${xp} XP</h2>${grid(ranks)}
    <div class="muted center mt16" style="padding-bottom:20px">Locked badges show what they cost, before you spend anything. That's the deal everywhere in this app.</div>`);
};

function parseSets(rx){ const m = rx.match(/^(\d+)/); return m? +m[1] : 3; }

function renderTrain(){

  const dow = parseDate(t).getDay();

          }).join('')}

  /* body metrics */
  const latest = {}; // last non-null per field

    <div class="muted mt8">The tape beats the scale. Shoulders ≈ 1.618 × waist.</div>`, isMeasureDay);

  $('view-train').classList.remove('entering');
  $('view-train').innerHTML = html;
}

App.saveSet = ()=>{

  const t = todayStr();
  if (!S.workouts.logs[t]) S.workouts.logs[t] = { key, sets:{} };

App.startRest = (secs, label)=>{
  const el = $('restChip');
  if (!el) return;             // a rest timer is function, not decoration —
                               // reduced-motion users still get their intervals
  clearInterval(App._restT);
  const endAt = Date.now() + secs * 1000;
  el.classList.add('on'); el.classList.remove('done');
  el.onclick = ()=>{ clearInterval(App._restT); App._restT = null; el.classList.remove('on'); };
  const paint = ()=>{
    const ms = endAt - Date.now();
    const left = Math.max(0, Math.ceil(ms / 1000));
    if (ms > 0){
      el.innerHTML = '⏱ REST ' + Math.floor(left/60) + ':' + pad(left%60) + ' <span style="color:var(--ink-3);font-weight:600">· tap to clear</span>';
    } else {
      clearInterval(App._restT); App._restT = null;
      el.classList.add('done');

      setTimeout(()=>{ if (!App._restT) el.classList.remove('on'); }, 8000);
    }
  };
  App._restT = setInterval(paint, 500);
  paint();
};

App.undoMeal = ()=>{
  const d = getDay(todayStr());
  const last = d.meals.pop();
  if (last == null){ toast('Nothing to undo'); return; }

  if (typeof last === 'string'){ const m = MEALS.find(x=>x.id===last); if (m){ cal=m.cal; p=m.p; } }
  else { cal = last.cal||0; p = last.p||0; }
  d.cal = Math.max(0, d.cal - cal); d.protein = Math.max(0, d.protein - p);
  save(); renderFuel();

function lineStreak(){
  let n=0, d=todayStr();
  while (parseDate(d) >= parseDate(S.profile.startDate)){
    const rec = S.days[d];
    if (rec && rec.r.line === false) break;
    n++; d = addDays(d,-1);
  }
  return n;
}

  const row = (a)=>`<div class="tx"><div class="grow">${esc(a.name)}</div><div class="amt ${a.kind==='asset'?'in':''}">${money(a.value)}</div></div>`;
  openSheet(`
  <div class="grab"></div>
  <div class="sheet-head"><div><h3>The breakdown</h3><div class="sub">The number is a photo. The climb is the movie.</div></div>
  <button class="x-btn" onclick="App.closeSheet()">✕</button></div>
  <div class="statgrid">
    <div class="stat"><div class="lbl">Assets</div><div class="val pos">${money(nw.assets)}</div></div>
    <div class="stat"><div class="lbl">Owed</div><div class="val">${money(nw.liabilities)}</div></div>
  </div>
  ${assets.length?`<div class="small mb8"><b>What you hold</b></div>${assets.map(row).join('')}`:''}
  ${debts.length?`<div class="small mb8 mt12"><b>What you owe</b></div>${debts.map(row).join('')}<div class="muted mt8">Debt listed honestly is debt with a countdown on it.</div>`:''}
  ${first?`<div class="small mt16"><b>Baseline:</b> ${money(first.net)} on ${shortDate(first.date)}. Everything above that line, you built clean.</div>`:''}
  ${S.money.goals.length?`<div class="small mt12"><b>Goals funded:</b> ${S.money.goals.filter(g=>g.target>0&&g.saved>=g.target).length}/${S.money.goals.length} · total saved ${money(S.money.goals.reduce((a,g)=>a+g.saved,0))}</div>`:''}
  <button class="btn ghost mt16" onclick="App.closeSheet()">Back to work</button>`);
};
App.addAccount = ()=>{
  openSheet(`
  <div class="grab"></div><div class="sheet-head"><div><h3>Add account</h3><div class="sub">Checking, savings (different bank, no card), cash, debts.</div></div>
  <button class="x-btn" onclick="App.closeSheet()">✕</button></div>
  <input id="accName" placeholder="Name — e.g. Ally savings" style="margin-bottom:8px">
  <input id="accVal" inputmode="decimal" placeholder="Current value $" style="margin-bottom:8px">
  <div class="chip-row mb8" id="accKind">
    <button class="chip on" data-k="asset" onclick="App.pickKind(this)">Asset</button>
    <button class="chip" data-k="liability" onclick="App.pickKind(this)">Debt / owed</button>
  </div>
  <button class="btn mt8" onclick="App.saveAccount()">Add account</button>`);
  App._kind = 'asset';
};
App.pickKind = (el)=>{ App._kind = el.dataset.k; document.querySelectorAll('#accKind .chip').forEach(c=>c.classList.toggle('on',c===el)); };
App.saveAccount = ()=>{
  const name = $('accName').value.trim();
  const val = parseFloat($('accVal').value)||0;
  if (!name){ toast('Name it'); return; }
  S.money.accounts.push({ id:uid(), name, kind:App._kind, value:val });
  snapshotNW(); App.closeSheet(); renderMoney();
};
App.editAccount = (id)=>{
  const a = S.money.accounts.find(x=>x.id===id);
  if (!a) return;
  openSheet(`
  <div class="grab"></div><div class="sheet-head"><div><h3>${esc(a.name)}</h3><div class="sub">${a.kind}</div></div>
  <button class="x-btn" onclick="App.closeSheet()">✕</button></div>
  <input id="accVal2" inputmode="decimal" value="${a.value}" style="margin-bottom:8px">
  <button class="btn" onclick="App.saveAccountVal('${a.id}')">Update value</button>
  <button class="btn ghost mt8" onclick="App.delAccount('${a.id}')">Remove account</button>`);
};
App.saveAccountVal = (id)=>{
  const a = S.money.accounts.find(x=>x.id===id);
  a.value = parseFloat($('accVal2').value)||0;
  snapshotNW(); App.closeSheet(); renderMoney();
};
App.delAccount = (id)=>{ S.money.accounts = S.money.accounts.filter(x=>x.id!==id); snapshotNW(); App.closeSheet(); renderMoney(); };
App.snapNow = ()=>{ snapshotNW(); renderMoney(); toast('Net worth snapshotted 📸'); };
App.addCooling = ()=>{
  const item = $('coolItem').value.trim();
  const amt = parseFloat($('coolAmt').value);
  if (!item || isNaN(amt)){ toast('Item + price'); return; }
  S.money.cooling.push({ id:uid(), item, amount:amt, addedAt: Date.now(), decided:null });
  save(); renderMoney(); toast('Parked. Decide tomorrow with a fresh brain.');
};
App.decideCooling = (id, decision)=>{
  // 'removed' = plain delete of a typo/duplicate — it never counts as money kept
  if (decision === 'removed'){
    S.money.cooling = S.money.cooling.filter(x=>x.id!==id);
    save(); renderMoney(); return;
  }
  const c = S.money.cooling.find(x=>x.id===id);
  if (c){ c.decided = decision; save(); renderMoney(); if (decision==='skipped') toast('That’s the muscle. 💪'); }
};
App.addMock = ()=>{
  const t = todayStr();
  S.money.mocks[t] = (S.money.mocks[t]||0)+1;
  save(); renderMoney(); toast('Mock call logged — deliberate practice');
};
App.addConvo = ()=>{
  const t = todayStr();
  S.money.convos[t] = (S.money.convos[t]||0)+1;
  save(); renderMoney(); toast('Conversation logged');
};
App.addMeeting = ()=>{
  const t = todayStr();
  S.money.meetings[t] = (S.money.meetings[t]||0)+1;
  haptic.success();
  save(); renderMoney(); confettiBurst(); toast('MEETING BOOKED. That\'s the arithmetic working. 🎯');
};
App.sealLock = ()=>{
  const offer = $('lockOffer').value.trim();
  const date = $('lockDate').value;
  if (!offer || !date){ toast('Name the offer and the date'); return; }
  S.money.lock = { offer, date };
  save(); renderMoney(); toast('Sealed. 12 months. Long-term games.');
};
App.editLock = (btn)=>{
  if (btn.dataset.armed){ S.money.lock = { offer:'', date:'' }; save(); renderMoney(); }
  else { btn.dataset.armed = '1'; btn.textContent = 'Tap again to break the seal — dead offer / red flags only'; }
};

/* ---------- PROGRESS ---------- */
function renderProgress(){
  const t = todayStr();
  const dn = dayNumOf(t);
  const won = wonCount();
  const stats = recoveryStats();
  const cs = currentStreak(), bs = bestStreak();
  // only scoreable days count — an open today and Standard-mode untracked days
  // never deflate the headline number
  const scoreable = won + lostCount();
  const votes = votesCast();
  const waves = wavesTotal();
  const xpP = xpTotal();
  const lvP = currentLevel();

  let html = `
  <div class="hero">
    <div class="grow">
      <div class="phase">THE SCOREBOARD</div>
      <div class="big">${won} <span style="font-size:16px;color:var(--ink-3);font-weight:800">days won</span></div>
      <div class="date">${cs>0?'streak '+cs+' · ':''}best ${bs} · Momentum ${momentumScore()} · ${dn>FORGE_DAYS? (dn-FORGE_DAYS)+' days into The Standard' : Math.max(0,FORGE_DAYS-Math.max(dn,0))+' days left in The Forge'}</div>
      <div class="date" style="margin-top:3px"><b style="color:var(--ember-text)">${votes.toLocaleString()} votes cast</b>${waves>0?` · 🌊 ${waves} waves outlasted`:''}</div>
    </div>
    ${ringSVG(scoreable>0?won/scoreable:0, 104, scoreable>0? Math.round(won/scoreable*100)+'%' : '—', 'win rate')}
  </div>
  <div class="muted" style="margin:-4px 2px 12px">No single loss decides the election.</div>

  <div class="tindex">
    ${[['sec-blade','THE BLADE'],['sec-trophies','TROPHIES'],['sec-vault','THE VAULT'],['sec-fivemen','THE FIVE MEN'],['sec-receipts','THE RECEIPTS']].map(([id,l],i)=>`<button onclick="var e=document.getElementById('${id}');if(e)e.scrollIntoView({behavior:'smooth',block:'start'})">${l}<span class="ti-n">0${i+1}</span></button>`).join('')}
  </div>

  <div class="card center" id="sec-blade">
    ${bladeSVG(lvP.L)}
    <div class="rank-line" style="justify-content:center"><span class="rk">⚒ ${lvP.name}</span><span class="xv">${xpP} XP</span></div>
    <div class="xpbar" style="max-width:260px;margin:8px auto 0"><i style="width:${(lvP.into/lvP.need*100).toFixed(1)}%"></i></div>
    <div class="muted mt8">${lvP.need-lvP.into} XP to <b>${levelFor(lvP.next).name}</b> — every rep is a hammer strike.</div>
  </div>`;

  if (S.gradSeen || dn > FORGE_DAYS){
    html += `<div class="card tight center"><button class="btn ghost sm" onclick="App.openGraduation()">👑 FORGED — read your graduation again</button></div>`;
  }

  /* the vault — wisdom earned one won day at a time */
  if (corpus().length){
    const claims = Object.entries(S.vault.claims).sort((a,b)=>a[0]<b[0]?1:-1);
    html += `<h2 class="sec" id="sec-vault">The Vault <span class="ln"></span>${vaultCount()}/${corpus().length} CARDS</h2>
    <div class="card">
      ${claims.length ? claims.slice(0,3).map(([d,i])=>{
        const c = corpus()[i]; if (!c) return '';
        return `<div class="vault-mini" style="${c.t!=='common'?'border-color:rgba(255,160,50,0.4)':''}">“${esc(c.q)}”<div class="qauthor">— ${esc(c.a)} · ${TIERS[c.t].label} · ${shortDate(d)}</div></div>`;
      }).join('') : `<div class="small mb8"><b>400 cards. Locked.</b> Tonight's is already chosen — <span style="color:var(--ember-text)">win the day and flip it.</span></div>`}
      <button class="btn ghost sm" onclick="App.openVault()">Open the vault — odds printed inside</button>
    </div>`;
  }
  html += `
  <h2 class="sec">The Grid <span class="ln"></span>${shortDate(S.profile.startDate).toUpperCase()} → ${shortDate(dateOfDayNum(FORGE_DAYS)).toUpperCase()}</h2>
  <div class="card">
    <div class="legend">
      <span><i style="background:var(--good)"></i>Won</span>
      <span><i style="background:linear-gradient(160deg,#ffe9b0,#fff);border:1px solid #ffd700"></i>Immaculate</span>
      <span><i style="background:var(--critical-dim);border:1px solid var(--critical)"></i>Lost</span>
      <span><i style="background:rgba(90,130,180,0.3);border:1px solid rgba(120,160,210,0.5)"></i>Paused</span>
      <span><i style="border:2px solid var(--ember-text);background:transparent"></i>Today</span>
    </div>
    <div class="grid75">`;
  const d0dow = parseDate(S.profile.startDate).getDay();
  for (let i=0;i<7;i++) html += `<div class="g-dow">${['S','M','T','W','T','F','S'][(d0dow+i)%7]}</div>`;
  for (let n=1; n<=FORGE_DAYS; n++){
    const ds = dateOfDayNum(n);
    let cls = 'future', mark = '';
    if (parseDate(ds) < parseDate(t)){
      const st = dayStatus(ds);
      const rec = S.days[ds];
      if (st==='won'){
        cls = isImmaculate(ds, rec) ? 'won immaculate' : 'won'; mark='✓';
      } else if (st==='paused'){ cls='paused'; mark='‖'; }
      else { cls='lost'; mark='✕'; }
    } else if (ds === t){
      const st = dayStatus(t);
      if (st==='won'){ cls='won today'; mark='✓'; }
      else if (st==='lost'){ cls='lost today'; mark='✕'; }
      else { cls='today'; mark=n; }
    }
    html += `<button class="g-cell ${cls}" onclick="App.peekDay('${ds}',${n})" aria-label="Day ${n}">${mark}</button>`;
  }
  html += `</div>
    <div class="muted">Tap any day.</div>
  </div>`;

  const immCount = elapsedDates().filter(d=>isImmaculate(d, S.days[d])).length;
  html += `
  <div class="statgrid">
    <div class="stat" style="cursor:pointer" onclick="App.momentumMath()"><div class="lbl">Momentum ⓘ</div><div class="val" style="color:var(--ember-text)">${miniRing(momentumScore()/100, 26)}${momentumScore()}</div><div class="sub">tap for the math — a loss is a dent, never a zero</div></div>
    <div class="stat"><div class="lbl">Immaculate</div><div class="val" style="color:#ffe9b0">${immCount}</div><div class="sub">all rules · no retro · sealed &lt;22:00</div></div>
    <div class="stat"><div class="lbl">Bounce-back</div><div class="val">${stats.losses? stats.avgRecover.toFixed(1)+'d' : '—'}</div><div class="sub">avg days to recover a loss</div></div>
    <div class="stat"><div class="lbl">Missed twice</div><div class="val" style="${stats.missedTwice===0?'color:var(--good)':'color:var(--critical)'}">${stats.missedTwice===0?'Never':stats.missedTwice+'×'}</div><div class="sub">the only unforgivable stat</div></div>
    <div class="stat" style="cursor:pointer" onclick="App.openOverdrive()"><div class="lbl">Overdrive ⚡</div><div class="val" style="color:var(--ember-text)">${overdriveData().count}</div><div class="sub">days beyond the goal · tap for the rules</div></div>
    <div class="stat"><div class="lbl">Best heater</div><div class="val" style="color:#ffe9b0">${overdriveData().best>0?'×'+overdriveData().best:'—'}</div><div class="sub">longest overdrive chain</div></div>
    <div class="stat"><div class="lbl">Early ignitions 🌅</div><div class="val">${Object.keys(S.days).filter(k=>S.days[k].early).length}</div><div class="sub">first rule sealed before 9am</div></div>
    <div class="stat"><div class="lbl">Pace</div><div class="val">${(()=>{ const w = elapsedDates().filter(x=>S.days[x]&&S.days[x].wpm); return w.length ? S.days[w[w.length-1]].wpm : '—'; })()}</div><div class="sub">latest speech WPM · target 140</div></div>
  </div>`;

  /* the five men — lifetime identity votes */
  const iv = identityVotes();
  const ivMax = Math.max(1, ...VOTE_MAP.map(([k])=>iv[k]));
  html += `<h2 class="sec" id="sec-fivemen">The Five Men <span class="ln"></span>LIFETIME VOTES</h2>
  <div class="card">
    ${VOTE_MAP.map(([k, name])=>`
      <div class="compl"><div class="c-head"><span><b>${name}</b></span><span class="muted">${iv[k].toLocaleString()}</span></div>
      <div class="c-track"><i style="width:${(iv[k]/ivMax*100).toFixed(0)}%;background:var(--ember-grad)"></i></div></div>`).join('')}
    <div class="muted">Every rule kept is a vote. Votes survive everything.</div>
  </div>`;

  /* the receipts — progress photos (filled async from IndexedDB) */
  html += `
  <h2 class="sec" id="sec-receipts">The Receipts <span class="ln"></span>PHOTOS</h2>
  <div class="card" id="rcptCard"><div class="muted">Checking the photo vault…</div></div>`;

  /* trigger playbook — lapses turned into data */
  const recs = Object.keys(S.recoveries).sort().slice(-5).reverse()
    .map(d=>({ d, ...S.recoveries[d] })).filter(x=>(x.cause&&x.cause.trim())||(x.fix&&x.fix.trim()));
  if (recs.length){
    html += `<h2 class="sec">Trigger Playbook <span class="ln"></span>LAPSES → DATA</h2><div class="card tight">`;
    for (const r of recs){
      html += `<div class="step"><div class="sn">${shortDate(r.d).split(' ')[1]||'·'}</div><div><b>${esc(r.cause||'—')}</b><br><span class="muted">fix: ${esc(r.fix||'—')}</span></div></div>`;
    }
    html += `</div>`;
  }

  /* anxiety at the rep — the number that falls */
  const anxPts = elapsedDates().filter(d=>S.days[d] && S.days[d].socialAnx!=null)
    .map(d=>({ x:d, y:S.days[d].socialAnx }));
  if (anxPts.length >= 5){
    html += `
    <h2 class="sec">The Ladder <span class="ln"></span>CH. 15</h2>
    <div class="card chart-card">
      <div class="ch-title">Anxiety at the social rep</div>
      <div class="ch-sub">watch the number fall — that's the rewiring, on paper</div>
      ${lineChart(anxPts, {unit:''})}
    </div>`;
  }

  /* daydream log — flat and boring by design */
  if (S.dd.length){
    const days14 = Array.from({length:14},(_,i)=>addDays(t, i-13));
    const ddVals = days14.map(d=>S.dd.filter(x=>x.date===d).reduce((a,x)=>a+x.min,0));
    html += `
    <h2 class="sec">Daydream Log <span class="ln"></span>LOGGED MINUTES</h2>
    <div class="card chart-card">
      <div class="ch-sub">self-monitoring, not a scoreboard — logging it is the treatment</div>
      ${barChart(ddVals, days14.map(d=>parseDate(d).getDate()), 0)}
    </div>`;
  }

  /* runway record */
  if (dn >= 1){
    const rwDone = RUNWAY_TASKS.filter(x=>S.runway.checks[x[0]]).length;
    if (rwDone > 0 || S.runway.mds16 || S.runway.wpm){
      html += `<div class="card tight small">Runway: ${rwDone}/${RUNWAY_TASKS.length} executed${S.runway.mds16?` · MDS-16 baseline ${esc(S.runway.mds16)}`:''}${S.runway.wpm?` · speech ${esc(S.runway.wpm)} wpm`:''}</div>`;
    }
  }

  /* the trophy case — the whole badge wall, one tap away */
  {
    const od2 = overdriveData();
    const imm2 = elapsedDates().filter(d=>isImmaculate(d, S.days[d])).length;
    const next = MILESTONES.find(m=>!(dn >= m[0] || won >= m[0]));
    html += `<h2 class="sec" id="sec-trophies">The Trophy Case <span class="ln"></span>EARNED &amp; EARNABLE</h2>
    <div class="card" style="cursor:pointer" onclick="App.openTrophies()">
      <div class="row">
        <div class="grow">
          <div class="small">${MILESTONES.filter(m=>dn>=m[0]||won>=m[0]).length}/${MILESTONES.length} milestones · ${od2.count} overdrive · ${imm2} immaculate · ${vaultCount()} cards${next?` · next: ${next[2]} on Day ${next[0]}`:''}</div>
        </div>
        <div style="font-size:26px">🏆</div>
      </div>
    </div>`;
  }

  /* fortnight reports shelf */
  const rrMax = reportReady();
  if (rrMax > 0){
    html += `<h2 class="sec" id="sec-reports">Progress Reports <span class="ln"></span>EVERY 14 DAYS</h2>
    <div class="card tight"><div class="chip-row">
      ${Array.from({ length: rrMax }, (_, i) => i + 1).map(nn => {
        const ps = periodStats(nn);
        const wr = (ps.won + ps.lost) ? ps.won / (ps.won + ps.lost) : 0;
        const seen = !!S.reports[revKey(nn)];
        return `<button class="chip ${seen ? '' : 'on'}" onclick="App.openReport(${nn})">${miniRing(wr, 20)}F${nn}${seen ? '' : ' ●'}</button>`;
      }).join('')}
    </div>
    <div class="muted mt8">Photos, tape, dials, weight — auto-assembled. The Day-75 archive keeps all of it.</div></div>`;
  }

  /* per-rule compliance */
  const comp = ruleCompliance().filter(c=>c.tot>0);
  if (comp.length){
    let leakInner = '';
    for (const c of comp){
      leakInner += `<div class="compl"><div class="c-head"><span>${c.rule.title}</span><span class="muted">${c.pct}%</span></div>
      <div class="c-track"><i style="width:${c.pct}%"></i></div></div>`;
    }
    leakInner += `<div class="muted">The lowest bar = next week's environment fix.</div>`;
    const worstLeak = comp.slice().sort((a,b)=>a.pct-b.pct)[0];
    html += fold('leaks', 'The Leaks', worstLeak ? worstLeak.rule.title.slice(0,16) + ' ' + worstLeak.pct + '%' : '', leakInner, false);
  }

  /* THE BUILD — the tape leads, the scale is context.
     A goal weight can't tell "leaner" from "just heavier", and the build he's
     actually after is a ratio, not a number on a scale. So the headline is
     shoulders ÷ waist against the golden 1.618, and bodyweight only appears
     once he's logged some — as a trend with no target line anywhere. */
  const br = buildRatio();
  const wpts = S.body.entries.filter(e=>e.weight!=null).map(e=>({x:e.date, y:e.weight}));
  const wsPts = S.body.entries.filter(e=>e.waist!=null).map(e=>({x:e.date, y:e.waist}));
  let buildInner;
  if (br){
    const gapSh = Math.max(0, ADONIS * br.now.waist - br.now.shoulders);
    const gapW  = Math.max(0, br.now.waist - br.now.shoulders / ADONIS);
    buildInner = `
    <div class="row" style="align-items:baseline;gap:8px">
      <div style="font-family:var(--font-display);font-size:34px;line-height:1;color:var(--ember-text)">${br.now.r.toFixed(3)}</div>
      <div class="muted">shoulders ${br.now.shoulders}″ ÷ waist ${br.now.waist}″ · golden 1.618</div>
    </div>
    <div class="rw-bar mt12"><i style="width:${(br.pct*100).toFixed(0)}%"></i></div>
    <div class="muted mt8">${br.pct>=1
      ? 'Golden. Hold the waist, keep adding shoulders.'
      : `From here: <b>+${gapSh.toFixed(1)}″ shoulders</b> at this waist, or <b>−${gapW.toFixed(1)}″ waist</b> at these shoulders. Either road gets there.`}</div>
    ${br.n>=2 ? `<div class="muted mt8">Since your first tape: ${br.first.r.toFixed(3)} → ${br.now.r.toFixed(3)} <b style="color:${br.delta>=0?'var(--good)':'var(--ink-3)'}">${br.delta>=0?'+':''}${br.delta.toFixed(3)}</b></div>` : ''}
    ${wsPts.length>=2 ? `<div class="chart-card mt12"><div class="ch-sub">waist — down is the whole game · target 32–33″</div>${lineChart(wsPts,{goal:32.5, unit:'″'})}</div>` : ''}
    ${wpts.length>=2 ? `<div class="chart-card mt8"><div class="ch-sub">bodyweight — context only, not a target</div>${lineChart(wpts,{unit:' lbs'})}</div>` : ''}`;
  } else {
    buildInner = `<div class="muted" style="padding:6px 0">The tape is the measure here — shoulders and waist, on Measure-Day (TRAIN tab, every 4th Sunday). Two numbers and this whole panel comes alive.</div>
    ${wpts.length>=2 ? `<div class="chart-card mt12"><div class="ch-sub">bodyweight — context only, not a target</div>${lineChart(wpts,{unit:' lbs'})}</div>` : ''}`;
  }
  html += fold('build', 'The Build', br ? br.now.r.toFixed(2) + ' → 1.618' : 'tape it', buildInner, !!br);

  /* weekly review */
  const wk = dn>0 ? Math.ceil(dn/7) : 0;
  const isFri = parseDate(t).getDay() === 5;
  const _rvNow = wk>0 ? S.reviews[revKey(wk)] : null;
  const done = !!(_rvNow && Array.isArray(_rvNow.a) && _rvNow.a.some(x=>x&&x.trim()));
  html += `
  <h2 class="sec">Weekly Review <span class="ln"></span>FRIDAYS, 30 MIN</h2>
  <div class="card">
    ${isFri && !done ? `<div class="banner ember" style="margin-bottom:10px"><span class="b-ic">🗡</span><div><b>WEEKLY BOSS.</b> Eight questions, no flinching. +5 XP.</div></div>`:''}
    <div class="small mb8">${done? `Week ${wk} reviewed ✓` : (wk>0? `Week ${wk} — not yet reviewed` : 'Starts with Day 1')}</div>
    ${wk>0? `<button class="btn ghost sm" onclick="App.openReview(${wk})">${done?'Edit review':'Do the review'}</button>`:''}
    ${Object.keys(S.reviews)
        .filter(k => keyAttempt(k) === S.attempts.length + 1 && keyWeek(k) !== wk
                  && S.reviews[k] && Array.isArray(S.reviews[k].a) && S.reviews[k].a.some(x=>x&&x.trim()))

/* ---------- chart helpers (validated palette: series-1 blue on dark) ---------- */
function niceTicks(lo, hi){
  if (hi - lo < 1e-9) { hi = lo + 1; }
  const span = hi - lo;
  const step = Math.pow(10, Math.floor(Math.log10(span/2)));
  const s = [1,2,5,10].map(m=>m*step).find(x=> span/x <= 4) || step*10;
  const start = Math.ceil(lo/s)*s;
  const out = [];
  for (let v=start; v<=hi+1e-9; v+=s) out.push(Math.round(v*100)/100);
  return out;
}
function fmtTick(v){
  if (Math.abs(v) >= 1000) return (v/1000).toFixed(Math.abs(v)>=10000?0:1).replace(/\.0$/,'') + 'k';
  return String(Math.round(v*10)/10);
}
function roundTopRect(x, y, w, h, r){
  if (h <= 0) return '';
  r = Math.min(r, w/2, h);
  return `M${x} ${y+h} L${x} ${y+r} Q${x} ${y} ${x+r} ${y} L${x+w-r} ${y} Q${x+w} ${y} ${x+w} ${y+r} L${x+w} ${y+h} Z`;
}

function lineChart(pts, opts){
  opts = opts || {};
  const W=340, H=150, L=38, R=14, T=14, B=24;
  const iw = W-L-R, ih = H-T-B;
  const ys = pts.map(p=>p.y);
  let lo = Math.min(...ys), hi = Math.max(...ys);
  if (opts.goal != null && opts.goal <= hi + (hi-lo || 4) * 1.6 && opts.goal >= lo - (hi-lo || 4)) hi = Math.max(hi, opts.goal);
  const padY = (hi-lo || 2) * 0.12;
  lo -= padY; hi += padY;
  const X = i => L + (pts.length===1 ? iw/2 : i/(pts.length-1)*iw);
  const Y = v => T + ih - (v-lo)/(hi-lo)*ih;
  const ticks = niceTicks(lo, hi);
  const path = pts.map((p,i)=> (i?'L':'M') + X(i).toFixed(1) + ' ' + Y(p.y).toFixed(1)).join(' ');
  const area = path + ` L${X(pts.length-1).toFixed(1)} ${T+ih} L${X(0).toFixed(1)} ${T+ih} Z`;
  const lastI = pts.length-1;
  const goalIn = opts.goal!=null && opts.goal>=lo && opts.goal<=hi;
  const pre = opts.prefix||'';
  const ptsData = esc(JSON.stringify(pts.map((p,i)=>({x:X(i), l: shortDate(p.x), v:p.y}))));
  return `
  <div class="chart-wrap" data-pts="${ptsData}" data-unit="${esc(opts.unit||'')}" data-prefix="${esc(pre)}">
    <svg viewBox="0 0 ${W} ${H}" style="width:100%">
      ${ticks.map(v=>`<line x1="${L}" x2="${W-R}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}" stroke="#2c2c2a" stroke-width="1"/>
        <text x="${L-6}" y="${(Y(v)+3).toFixed(1)}" font-size="9" fill="#898781" text-anchor="end">${pre}${fmtTick(v)}</text>`).join('')}
      ${goalIn?`<line x1="${L}" x2="${W-R}" y1="${Y(opts.goal).toFixed(1)}" y2="${Y(opts.goal).toFixed(1)}" stroke="#ffb020" stroke-width="1" opacity="0.55"/>
        <text x="${W-R}" y="${(Y(opts.goal)-4).toFixed(1)}" font-size="9" fill="#ffb020" text-anchor="end" font-weight="700">target ${pre}${opts.goal}</text>`:''}
      <path d="${area}" fill="#3987e5" opacity="0.10"/>
      <path d="${path}" fill="none" stroke="#3987e5" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
      <circle cx="${X(lastI).toFixed(1)}" cy="${Y(pts[lastI].y).toFixed(1)}" r="4.5" fill="#3987e5" stroke="#1a1a19" stroke-width="2"/>
      <text x="${Math.min(X(lastI), W-R-2).toFixed(1)}" y="${(Y(pts[lastI].y)-9).toFixed(1)}" font-size="10" font-weight="700" fill="#ffffff" text-anchor="end">${pre}${fmtTick(pts[lastI].y)}${esc(opts.unit||'')}</text>
      <text x="${L}" y="${H-6}" font-size="9" fill="#898781">${shortDate(pts[0].x)}</text>
      <text x="${W-R}" y="${H-6}" font-size="9" fill="#898781" text-anchor="end">${shortDate(pts[lastI].x)}</text>
      <line class="xh" y1="${T}" y2="${T+ih}" stroke="#c3c2b7" stroke-width="1" opacity="0" />
    </svg>
    <div class="tt"></div>
  </div>`;
}

function barChart(vals, labels, goal){
  const W=340, H=120, L=30, R=10, T=12, B=20;
  const iw=W-L-R, ih=H-T-B;
  const hi = Math.max(goal||0, ...vals, 10) * 1.1;
  const n = vals.length;
  const slot = iw/n;
  const bw = Math.min(24, slot-6);
  const Y = v => T + ih - (v/hi)*ih;
  const ticks = niceTicks(0, hi);
  const maxI = vals.indexOf(Math.max(...vals));
  let bars = '';
  vals.forEach((v,i)=>{
    const x = L + i*slot + (slot-bw)/2;
    const y = Y(v), h = T+ih-y;
    bars += `<path d="${roundTopRect(x, y, bw, Math.max(h, v>0?2:0), 4)}" fill="#3987e5"/>`;
    if (i===maxI && v>0) bars += `<text x="${x+bw/2}" y="${y-4}" font-size="9.5" font-weight="700" fill="#ffffff" text-anchor="middle">${v}</text>`;
    bars += `<text x="${x+bw/2}" y="${H-6}" font-size="9" fill="#898781" text-anchor="middle">${labels[i]}</text>`;
  });
  return `
  <div class="chart-wrap">
    <svg viewBox="0 0 ${W} ${H}" style="width:100%">
      ${ticks.filter(v=>v>0).map(v=>`<line x1="${L}" x2="${W-R}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}" stroke="#2c2c2a" stroke-width="1"/>
        <text x="${L-5}" y="${(Y(v)+3).toFixed(1)}" font-size="9" fill="#898781" text-anchor="end">${fmtTick(v)}</text>`).join('')}
      <line x1="${L}" x2="${W-R}" y1="${T+ih}" y2="${T+ih}" stroke="#383835" stroke-width="1"/>
      ${goal?`<line x1="${L}" x2="${W-R}" y1="${Y(goal).toFixed(1)}" y2="${Y(goal).toFixed(1)}" stroke="#ffb020" stroke-width="1" opacity="0.55"/>
      <text x="${W-R}" y="${(Y(goal)-4).toFixed(1)}" font-size="9" fill="#ffb020" text-anchor="end" font-weight="700">${goal}/day</text>`:''}
      ${bars}
    </svg>
  </div>`;
}

function nwChart(){
  const snaps = S.money.snapshots;
  if (snaps.length < 2) return `<div class="muted mt12">Add accounts and snapshot — the curve starts at two points. Watch "built, not taken" go up and to the right.</div>`;

/* chart hover (delegated) — pointerdown too, so a TAP shows the tooltip on touch */
const chartPoint = (e)=>{
  const wrap = e.target.closest ? e.target.closest('.chart-wrap[data-pts]') : null;
  document.querySelectorAll('.chart-wrap[data-pts]').forEach(w=>{
    if (w !== wrap){
      const tt = w.querySelector('.tt'); if (tt) tt.style.display='none';
      const xh = w.querySelector('.xh'); if (xh) xh.setAttribute('opacity','0');
    }
  });
  if (!wrap) return;
  let pts;
  try { pts = JSON.parse(wrap.dataset.pts); } catch(err){ return; }
  if (!pts || !pts.length) return;
  const svg = wrap.querySelector('svg');
  const rect = svg.getBoundingClientRect();
  if (!rect.width) return;
  const fx = (e.clientX - rect.left) / rect.width * 340;
  let best = 0, bd = 1e9;
  pts.forEach((p,i)=>{ const d = Math.abs(p.x - fx); if (d < bd){ bd = d; best = i; } });
  const p = pts[best];
  const xh = wrap.querySelector('.xh'), tt = wrap.querySelector('.tt');
  if (xh){ xh.setAttribute('x1', p.x); xh.setAttribute('x2', p.x); xh.setAttribute('opacity','0.35'); }
  if (tt){
    tt.innerHTML = `<b>${wrap.dataset.prefix||''}${p.v.toLocaleString('en-US')}${wrap.dataset.unit||''}</b> · ${p.l}`;
    tt.style.display = 'block';
    tt.style.left = (p.x / 340 * rect.width) + 'px';
    tt.style.top = '14px';
  }
};
document.addEventListener('pointermove', chartPoint, { passive:true });
document.addEventListener('pointerdown', chartPoint, { passive:true });
document.addEventListener('pointerleave', (e)=>{
  // on touch screens the tooltip stays until the next tap elsewhere
  if (window.matchMedia && matchMedia('(pointer:coarse)').matches) return;
  if (e.target && e.target.classList && e.target.classList.contains('chart-wrap')){
    const tt = e.target.querySelector('.tt'); if (tt) tt.style.display='none';
    const xh = e.target.querySelector('.xh'); if (xh) xh.setAttribute('opacity','0');
  }
}, true);

/* ---------- confetti (ember burst) ---------- */
function confettiBurst(){
  if (REDUCED_MOTION) return;
  const cv = $('confetti');
  const ctx = cv.getContext('2d');
  cv.width = innerWidth; cv.height = innerHeight;
  cv.style.display = 'block';
  const colors = ['#ff5f1f','#ffc233','#ffb020','#ffffff','#d95926'];
  const ps = Array.from({length:140},()=>({
    x: innerWidth/2 + (Math.random()-0.5)*140,
    y: innerHeight*0.35,
    vx: (Math.random()-0.5)*11,
    vy: -(Math.random()*11+4),
    s: Math.random()*5+3,
    c: colors[Math.floor(Math.random()*colors.length)],
    r: Math.random()*Math.PI,
    vr: (Math.random()-0.5)*0.3,
  }));
  let frames = 0;
  (function tick(){
    frames++;
    ctx.clearRect(0,0,cv.width,cv.height);
    for (const p of ps){
      p.x += p.vx; p.y += p.vy; p.vy += 0.32; p.r += p.vr;
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.r);
      ctx.fillStyle = p.c; ctx.globalAlpha = Math.max(0, 1 - frames/110);
      ctx.fillRect(-p.s/2, -p.s/2, p.s, p.s*0.6);
      ctx.restore();
    }
    if (frames < 115) requestAnimationFrame(tick);
    else { cv.style.display='none'; ctx.clearRect(0,0,cv.width,cv.height); }
  })();
}

/* ---------- sheet plumbing ----------
   Sheets carry ONE reusable history entry (the guard) so the phone's back
   gesture closes the sheet instead of exiting the installed app. Programmatic
   closes never touch history — the armed guard is reused by the next sheet,
   or consumed invisibly by the next back press. No races, no app exits. */
function openSheet(html){
  // NOTE: a running timer is deliberately NOT cancelled here — swapping sheets
  // (SOS → daydream log, drill → recovery) used to silently kill the 20-minute
  // urge clock and the 10-minute drill. runClock owns its own slot; paint()
  // tolerates a missing clock element, and onDone still fires.
  $('sheet').classList.toggle('swap', $('ovl').classList.contains('open'));
  $('sheet').innerHTML = html;
  if (!$('ovl').classList.contains('open')){
    if (!App._pageOpen){
      App._scrollY = window.scrollY || 0;
      document.body.style.top = (-App._scrollY) + 'px';
      document.body.classList.add('sheet-open');   // lock the page behind the sheet (iOS)
    }
    if (!App._sheetHist){
      App._sheetHist = true;
      try { history.pushState({ c75: (App._pageOpen ? 1 : 0) + 1 }, ''); } catch(e){}
    }
  }
  $('ovl').classList.add('open');
}
function closeSheetDOM(){
  clearInterval(App._sosT); App._sosT = null;
  // never leave the mic hot: closing the sheet ends the rep and the recording
  clearInterval(App._repT); App._repT = null;
  if (App._sp && App._sp.repOn) App.repEnd();
  else fillerStop();
  if (App._mr){ try { App._mr.stop(); } catch(e){} }
  if (App._tapeUrl){ URL.revokeObjectURL(App._tapeUrl); App._tapeUrl = null; }
  App._closeDate = null;               // cancelled close-outs re-capture the date next time
  App._planDate = null;
  _sheetUrls.forEach(u=>URL.revokeObjectURL(u)); _sheetUrls = [];
  $('ovl').classList.remove('open');
  $('sheet').innerHTML = '';
  if (!App._pageOpen){
    document.body.classList.remove('sheet-open');
    document.body.style.top = '';
    window.scrollTo(0, App._scrollY || 0);
  }
}
App.closeSheet = closeSheetDOM;
